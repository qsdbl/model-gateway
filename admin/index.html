<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 禁止双击/双指放大：移动端误触放大后整个后台排版会错位。
     maximum-scale=1 + user-scalable=no；iOS Safari 10+ 会忽略这两个声明，
     所以下面还有 CSS touch-action 和 JS gesturestart 两道兜底。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Personal Model Gateway</title>
<style>
/*
 * 设计规范来源（用户要求：不凭感觉写设计，注明来源与数值）：
 * 1) Typography — Apple HIG Typography（Dynamic Type Large 档）
 *    https://developer.apple.com/design/human-interface-guidelines/typography
 *    22/28 title2 · 20/25 title3 · 17/22 body · 15/20 subheadline
 *    13/18 footnote · 12/16 caption1 · 11/13 caption2
 * 2) Color — Apple HIG Color（语义色，明暗两套）
 *    https://developer.apple.com/design/human-interface-guidelines/color
 * 3) 列表 — iOS「分组列表」范式：行高 44–56pt、分组间隔 24–32
 *    https://developer.apple.com/design/human-interface-guidelines/lists-and-tables
 * 4) 弹窗 — iOS Alert：宽 270pt、圆角 14、标题 17 semibold、按钮行高 44
 *    https://developer.apple.com/design/human-interface-guidelines/alerts
 * 5) 控件 — iOS Segmented Control / Search Field：高 32–36、圆角 8–10
 *    https://developer.apple.com/design/human-interface-guidelines/segmented-controls
 * 正文对比度 ≥4.5:1（浅色 #000/#4A4A50 on #FFF、深色 #FFF/#C7C7CC on #1C1C1E）。
 */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F7F7FA;
  --label:#000000; --label-2:#4A4A50; --label-3:#6E6E73;
  --separator:#D8D8DC; --fill:#E9E9EE; --accent:#0A62C4;
  --ok:#1A7F37; --warn:#A8480A; --err:#C62828;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --label:#FFFFFF; --label-2:#C7C7CC; --label-3:#98989D;
  --separator:#38383A; --fill:#3A3A3C; --accent:#4DA3FF;
  --ok:#32D74B; --warn:#FF9F0A; --err:#FF453A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
    --label:#FFFFFF; --label-2:#C7C7CC; --label-3:#98989D;
    --separator:#38383A; --fill:#3A3A3C; --accent:#4DA3FF;
    --ok:#32D74B; --warn:#FF9F0A; --err:#FF453A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--label)}
/* 禁止双击/双指缩放（规范：MDN touch-action
   https://developer.mozilla.org/en-US/docs/Web/CSS/touch-action）：
   pan-x pan-y 保留单指滚动与点击，但关掉 double-tap zoom 和 pinch zoom。
   注意 manipulation 不够——它仍允许捏合缩放。比 user-scalable=no 可靠，
   后者被 iOS Safari 10+ 刻意忽略（另有 JS gesturestart 兜底）。 */
html,body{touch-action:pan-x pan-y}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  font-size:17px;line-height:22px;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 0}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0 16px}
h1{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;
  color:var(--accent);background:var(--surface);border:1px solid var(--separator);
  border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.chip b{font-weight:600}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.chip.paid .dot{background:var(--warn)}
/* R2.44：无可用候选（全部账号被剔除）时顶栏告警色，跟 paid 的橙色区分开 */
.chip.blocked{border-color:var(--err);color:var(--err)}
.chip.blocked .dot{background:var(--err)}

.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:none;background:none;color:var(--label-2);
  font-size:13px;line-height:18px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* R2.28：图标按钮内 svg 与文字基线对齐、不收缩 */
.swPlayInline svg{flex:0 0 auto;display:block}
/* R2.34：池占比迷你条——嵌在「全部」按钮内，绿色=免费池占比、灰=付费池。
   小屏隐藏绝对数字后，比例条仍一眼可见（用户要看的是 free/paid 比例关系）。 */
.sw-bar .swmix{display:inline-block;width:18px;height:5px;margin-left:5px;
  vertical-align:middle;border-radius:3px;overflow:hidden;background:var(--separator)}
.sw-bar .swmix i{display:block;height:100%;background:var(--ok,#0F6E56);border-radius:3px 0 0 3px}
/* R2.32：范围 + 池过滤合并成一行——范围在前、池在后、播放按钮行尾。
   窄屏（<500px）压缩 hseg 内边距与 label 间距，勉强塞进 375px；
   实在放不下时横向滚动兜底（auto），绝不把按钮挤没或换行堆叠。 */
.sw-bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding-bottom:2px}
.sw-bar .hseg{flex:0 0 auto}
.sw-bar .swrange-label{flex:0 0 auto;margin-right:0}
.sw-bar .swPlayInline{flex:0 0 30px;margin-left:0}
@media(max-width:500px){
  .sw-bar{gap:4px}
  .sw-bar .hseg button{padding:3px 5px;font-size:10px}
  /* 手机端隐藏「范围」label 和池计数数字——按钮文案本身已表意，省下约 90px
     让范围+池+播放按钮真正塞进 375px 一行（实测原需 413px > 366px 被裁）。 */
  .sw-bar .swrange-label{display:none}
  .sw-bar .swcnt{display:none}
}
/* R2.31：播放按钮恢复 R2.28 的圆形小圆钮样式（位置仍在范围行末尾，见 R2.30）。
   R2.29/30 曾改成无框扁平款，用户嫌丑。回到圆形：1px 边框 + 圆角 50% + 浅阴影 +
   30px 点击区，单色 SVG 图标不变（Apple HIG Icons：单色模板、统一线宽、足够点击区）。 */
.swPlayInline{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;flex:0 0 30px;padding:0;cursor:pointer;
  border:1px solid var(--separator);border-radius:50%;background:var(--surface);
  color:var(--label-2);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.swPlayInline:hover{color:var(--accent);border-color:var(--accent)}
.swPlayInline[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
/* R2.29：范围 label 纯文本，不被 .hseg 边框包成按钮样式 */
.swrange-label{font-size:11px;color:var(--label-3);align-self:center;
  margin-right:6px;white-space:nowrap}

/* 搜索框（HIG Search Field：高 36、圆角 10、低调填充） */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:36px;border:none;border-radius:10px;background:var(--fill);
  color:var(--label);font-size:15px;padding:0 12px 0 32px;font-family:inherit;outline:none}
.search input::placeholder{color:var(--label-3)}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;fill:var(--label-3)}

/* 筛选胶囊 */
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-size:13px;line-height:18px;font-weight:600;padding:6px 12px;border-radius:999px;
  border:1px solid var(--separator);background:var(--surface);color:var(--label-2);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.group{margin-bottom:20px}
.ghead{font-size:12px;line-height:16px;color:var(--label-3);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;padding:0 4px 6px;display:flex;align-items:center;gap:6px}
/* 分区标题后的说明问号：与标题同权重，点击弹统一风格说明 */
.ghead .ghelp{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border:0;background:transparent;color:var(--label-3);cursor:pointer;padding:0;vertical-align:middle}
.ghead .ghelp:hover{color:var(--accent)}
/* 平台区块展开/收起：与 ghelp 同款图标按钮；箭头方向只交给 CSS，
   JS 只切换 aria-expanded，避免字符与旋转两套来源互相抵消（R2.37 教训）。 */
.ghead .gcaret{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border:0;background:transparent;color:var(--label-3);cursor:pointer;padding:0;transition:transform .15s}
.ghead .gcaret:hover{color:var(--accent)}
.ghead .gcaret[aria-expanded="true"]{transform:rotate(90deg)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:10px}
/* R1：长列表固定高度、内部滚动（用户反馈列表太长整页滚动很乱）。
   规范来源：Apple HIG Lists and Tables（分区固定可视区 + 滚动）。
   高度用 min(62vh,560px) 自适应，窄屏再收一档；细滚动条避免抢视觉。 */
.scroll-list{max-height:min(62vh,560px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--separator) transparent}
.scroll-list::-webkit-scrollbar{width:6px;height:6px}
.scroll-list::-webkit-scrollbar-thumb{background:var(--separator);border-radius:3px}
@media (max-width:480px){.scroll-list{max-height:min(58vh,460px)}}
/* 图表容器：固定高度 + 内部滚动，跟随主题（canvas 无法读 CSS 变量，颜色在 JS 里显式设） */
.chart-box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  padding:12px;height:min(46vh,380px)}

/* 分组头（可折叠） */
.gh{display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:44px;cursor:pointer;
  border-bottom:1px solid var(--separator);background:var(--surface-2)}
.gh:active{background:var(--fill)}
.gh .t{font-size:13px;line-height:18px;font-weight:600;color:var(--label-2)}
.gh .c{font-size:12px;line-height:16px;color:var(--label-3)}
.gh .cv{margin-left:auto;color:var(--label-3);font-size:12px;transform:rotate(0deg);transition:transform .15s}
.gh[aria-expanded="true"] .cv{transform:rotate(90deg)}

.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;
  border-bottom:1px solid var(--separator);cursor:default}
.row:last-child{border-bottom:none}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--surface-2)}
.rmain{flex:1 1 auto;min-width:0}
.rtitle{font-size:15px;line-height:20px;font-weight:600;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:12px;line-height:16px;color:var(--label-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub.wrap{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.rright{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--label-2)}
.mono{font-variant-numeric:tabular-nums}
.row.active{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tick{color:var(--accent);font-weight:700;font-size:16px;line-height:1}
/* R2.53：「刚用过」——最近真实调度的模型标记，与「当前首选✓」区分语义 */
.justused{display:inline-block;margin-left:6px;padding:0 5px;font-size:10px;line-height:14px;
  border-radius:4px;color:var(--label-2);background:var(--fill);vertical-align:1px}

.pill{display:inline-block;font-size:11px;line-height:13px;font-weight:600;padding:3px 7px;border-radius:7px;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.pill.err{color:var(--err);background:color-mix(in srgb,var(--err) 14%,transparent)}
.pill.info{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill.plain{color:var(--label-2);background:var(--fill)}
/* R2.6：真免费模型用暖橙 FREE 角标，和同名付费模型一眼可分。
   付费方不额外加角标（避免列表噪音），靠「有/无 FREE」区分即可。 */
.pill.free{color:#B45309;background:rgba(245,158,11,.16)}
/* R2.47：最近调度「同一模型多个账号」的 chip 列表。
   flex-wrap 天然响应式：宽屏一行放多个、手机端自动换行，不需要 JS 算列数。
   每个 chip 自带「掩码名 · N 次 · 最近 HH:MM:SS」，和信息密度一致。 */
.sched-accts{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px}
.sched-acct{font-size:11px;line-height:15px;color:var(--label-2);white-space:nowrap}
.sched-acct b{color:var(--label-1);font-weight:600}
.sched-acct i{font-style:normal;color:var(--label-3)}
/* R2.49：账号当前冷却/429 → chip 标红 + 原因，和仍可用的账号一眼区分 */
.sched-acct.off,.sched-acct.off b{color:var(--err)}
.sched-acct.off i{color:var(--err);opacity:.8}
.sched-acct.off .sched-why{margin-left:3px}
.dotst{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dotst.ok{background:var(--ok)} .dotst.err{background:var(--err)} .dotst.warn{background:var(--warn)}

/* 平台前置标签（账号页 / 切换历史 / 请求列表共用）。
   颜色来源 Apple HIG Color 系统色：
   https://developer.apple.com/design/human-interface-guidelines/color
   平台是品牌标识，深浅主题统一用固定实底（不随 --accent 变）——否则深色下
   --accent 变浅蓝 #4DA3FF，白字对比度掉到 2.6:1，不合格。
   WorkBuddy=蓝 #0A62C4（白字 5.6:1）、Qoder=紫 #8944AB（6.5:1）、mock=灰，
   两者都 ≥4.5:1（WCAG AA 正文）。 */
.ptag{display:inline-block;font-size:11px;line-height:13px;font-weight:700;padding:3px 7px;
  border-radius:6px;background:#0A62C4;color:#fff;
  white-space:nowrap;flex:0 0 auto}
.ptag[data-plat="qoder"]{background:#8944AB;color:#fff}
.ptag[data-plat="mock"],.ptag[data-plat="unknown"]{background:var(--fill);color:var(--label-2)}
.ptag.dim{opacity:.32}   /* 合并行里未启用平台的角标淡化，一眼看出该平台没参与 */
.orderrow.hidden-plat{display:none}   /* 只有未启用平台的模型，勾选平台切换后整行隐藏 */

/* Qoder 账号行内的授权按钮（P44）。
   规格来源：Material Design 3 — Buttons / text button
   https://m3.material.io/components/buttons/guidelines
   取值：label-large 14sp/20sp；shape corner small = 8dp
   https://m3.material.io/styles/shape/overview-levels
   min-width 44px 是 Apple HIG 的最小可点区域（44pt）
   https://developer.apple.com/design/human-interface-guidelines/buttons
   高度 32px：为了塞进 56px 的账号行；整行 .row.tap 本身也是可点的，
   所以实际触控区域比按钮大。 */
.qbtn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  min-width:44px;height:32px;padding:0 10px;border-radius:8px;
  border:1px solid var(--separator);background:var(--fill);color:var(--accent);
  font-size:14px;line-height:20px;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap}
.qbtn:active{opacity:.7}
.qbtn.pri{background:var(--accent);color:#fff;border-color:transparent}
/* R2.39：凭据续期失败/过期的红色「重新授权」按钮 + 行内告警文字。
   依据 Apple HIG 语义色：告警用系统红，正文对比度 ≥4.5:1（深色模式用亮红）。 */
.qbtn.danger{background:var(--err);color:#fff;border-color:transparent}
/* R2.41：账号展开区「从网关剔除」按钮——红色描边（区别于填充的重新授权）。 */
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger:hover{background:var(--err);color:#fff}
.reauth-hint{color:var(--err);font-weight:600;margin-right:6px}
.qbtn[disabled]{opacity:.45;cursor:default}

/* 指引 / 代码块 */
.step{display:flex;gap:12px;padding:14px}
.cfg{padding:14px}
.cfg+.cfg{border-top:1px solid var(--separator)}
.cfg h3{font-size:15px;line-height:20px;font-weight:600}
.cfg p{font-size:13px;line-height:18px;color:var(--label-2);margin-top:2px;overflow-wrap:anywhere}
.ghint{font-size:12px;line-height:17px;color:var(--label-3);padding:8px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--separator)}
.step>div:last-child{flex:1 1 auto;min-width:0}
.step+.step{border-top:1px solid var(--separator)}
.num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:12px;line-height:22px;text-align:center;font-weight:700}
.step h3{font-size:15px;line-height:20px;font-weight:600}
.step p{font-size:13px;line-height:18px;color:var(--label-2);margin-top:2px;overflow-wrap:anywhere}
.code{display:flex;flex-direction:column;margin-top:8px}
pre{background:var(--surface-2);border:1px solid var(--separator);border-radius:10px;
  padding:10px 12px;order:1;width:100%;overflow-x:auto;font-size:12px;line-height:17px;
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--label);
  -webkit-user-select:all;user-select:all}
code{font-family:inherit}
.copy{align-self:flex-start;order:0;margin-bottom:6px;font-size:12px;line-height:16px;padding:5px 10px;
  border-radius:8px;border:1px solid var(--separator);background:var(--surface);
  color:var(--label-2);cursor:pointer;font-weight:600}
.copy:active{background:var(--fill)}
.copy.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.copyrow{display:flex;gap:8px;align-items:center;order:0;margin-bottom:6px}
.copyrow .copy{align-self:center;margin:0}
.toggle{font-size:12px;line-height:16px;padding:5px 10px;border-radius:8px;border:1px solid var(--separator);
  background:var(--surface);color:var(--label-3);cursor:pointer}
.note{font-size:12px;line-height:17px;color:var(--label-3);padding:0 4px 12px;margin-top:-10px}
.note code{font-size:11px}

.kvrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--separator)}
.kvrow:last-child{border-bottom:none}
.kvrow .k{font-size:13px;color:var(--label-2);flex:0 0 auto;width:72px}
.kvrow .v{font-size:13px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.kvrow .aside{flex:0 0 auto;font-size:11px;color:var(--label-3);font-family:var(--mono,monospace)}

/* 调度页：可拖拽的模型顺序列表 + 策略开关 */
/* R2.8：禁止长按选中文字——手机端长按 handle 附近会误选模型名，干扰拖拽。
   列表数据都在 data-* 里，复制配置走接入页，这里禁用文本选择不影响功能。 */
.orderlist{display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.orderrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--separator);
  background:var(--surface)}
.orderrow:last-child{border-bottom:none}
.orderrow.dragging{opacity:.35}
.orderrow.over{box-shadow:inset 0 2px 0 var(--accent)}
/* R2.5：模型列表默认折叠，只显示前 3 个；其余 .folded 隐藏，点展开按钮再显示。
   展开后列表恢复可滚动（.scroll-list），收起时高度自然收缩。 */
.orderrow.folded{display:none}
.orderexpand{display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 12px;border-top:1px solid var(--separator);border:0;width:100%;
  background:var(--surface-2);color:var(--accent);font:inherit;font-size:12px;line-height:16px;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.orderexpand:active{background:var(--fill)}
/* 触摸拖拽：抬起的项加阴影，避免和滚动混淆 */
.orderrow.touchdrag{opacity:.9;box-shadow:0 4px 14px rgba(0,0,0,.2);position:relative;z-index:2}
.orderrow.off .omodel{color:var(--label-3);text-decoration:line-through}
.handle{flex:0 0 auto;width:20px;text-align:center;color:var(--label-3);cursor:grab;font-size:14px;
  line-height:1;user-select:none;-webkit-user-select:none;touch-action:none}
/* 角标（平台/FREE/high#N/次数）之间留固定间距，杜绝贴在一起；
   模型名单独一层 .mname 承载省略号，flex 布局下才不会被角标挤碎。 */
.orderrow .omodel{flex:1 1 auto;min-width:0;font-size:13px;display:flex;align-items:center;
  gap:5px;flex-wrap:wrap;white-space:nowrap}
.orderrow .omodel .mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.orderrow .omodel>.pill,.orderrow .omodel>.ptag{flex:0 0 auto}
/* 价格信息（P41）：要能收缩 + 省略，绝不能被挤出容器。
   窄屏时（见下方媒体查询）整块换到第二行显示，不做横向滚动。 */
.orderrow .ometa{flex:0 1 auto;min-width:0;max-width:46%;font-size:11px;color:var(--label-3);
  font-family:var(--mono,monospace);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orderrow .oact{flex:0 0 auto;display:flex;gap:4px;align-items:center}
.orderrow .oact button{font-size:11px;line-height:14px;padding:3px 7px;border-radius:6px;
  border:1px solid var(--separator);background:transparent;color:var(--label-2);cursor:pointer}
.orderrow .oact button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.orderrow .oact .mv{padding:3px 6px;font-family:var(--mono,monospace)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--separator)}
.srow:last-child{border-bottom:none}
.srow .sk{flex:1 1 auto;min-width:0;font-size:13px}
.srow .sk small{display:block;font-size:11px;color:var(--label-3);margin-top:2px}
.srow .sv{flex:0 0 auto;display:flex;gap:6px;align-items:center}
.tgl{font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;border:1px solid var(--separator);
  background:transparent;color:var(--label-2);cursor:pointer;white-space:nowrap}
.tgl[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* 「立即探测」这类操作按钮：与同区域的下拉/开关同高同字号，不用整宽 44px 主按钮。 */
.srow .probe-btn{font:inherit;font-size:13px;line-height:18px;padding:5px 12px;border-radius:8px;
  border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;white-space:nowrap}
.srow .probe-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.srow .probe-btn:disabled{opacity:.5;cursor:default}
/* 下拉选择（手动指定模型）：与后台其它控件同一套边框/圆角/字号 */
.srow select{font-size:13px;line-height:18px;padding:5px 8px;border-radius:8px;
  border:1px solid var(--separator);background:var(--surface-2,var(--surface));color:var(--label-1);
  cursor:pointer;max-width:220px}
/* 手动指定的模型：左侧一条强调色竖条，和「已停用」的划线区分开 */
.orderrow.manual{box-shadow:inset 3px 0 0 var(--accent)}
.orderrow.manual .omodel{font-weight:600}
.tgl.warn[aria-pressed="true"]{background:var(--warn,#b45309);border-color:var(--warn,#b45309)}
.selgrp{display:flex;gap:6px}
.selgrp button{font-size:12px;padding:6px 12px;border-radius:9px;border:1px solid var(--separator);
  background:transparent;color:var(--label-2);cursor:pointer}
.selgrp button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.kvrow .mini{flex:0 0 auto;font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--separator);
  background:var(--surface);color:var(--label-2);cursor:pointer}

/* 测试结果 */
.testbox{margin-top:10px;border-radius:12px;padding:12px;background:var(--surface-2);
  border:1px solid var(--separator);font-size:13px;line-height:19px}
.testbox.ok{border-color:color-mix(in srgb,var(--ok) 40%,var(--separator))}
.testbox.err{border-color:color-mix(in srgb,var(--err) 40%,var(--separator))}
.testbox b{font-weight:600}
.testbox .reply{font-size:15px;line-height:21px;margin:6px 0 8px;color:var(--label);white-space:pre-wrap}
.testbox .meta{color:var(--label-3);font-size:12px;line-height:17px}
.btn{display:block;width:100%;min-height:44px;border:none;border-radius:12px;background:var(--accent);
  color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.5;cursor:default}
.btn.secondary{background:var(--fill);color:var(--label)}
/* 次要按钮：描边样式，用于「发登录链接」这类不比主操作重要的动作；
   a.btn 也走这里，所以补上和按钮一致的居中与去下划线 */
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.loader{display:inline-flex;align-items:center;gap:8px;color:var(--label-3);font-size:13px}

.empty{padding:28px 16px;text-align:center;color:var(--label-3);font-size:15px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--separator);
  border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);
  background:var(--label);color:var(--bg);font-size:13px;line-height:18px;padding:8px 14px;
  border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* iOS Alert：宽 270pt、圆角 14、按钮 44 高、非全屏遮罩 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
/* 说明弹窗叠在配置弹窗之上 */
#infoOverlay{z-index:80}
.alert{width:270px;max-width:100%;background:var(--surface);border-radius:14px;overflow:hidden;
  /* 矮视口（手机横屏 / 笔记本 200% 缩放）下弹窗会比视口高，overflow:hidden 会把
     底部连同按钮一起裁掉；这里限高且允许内部滚动，保证内容永远可达。 */
  max-height:calc(100dvh - 48px);overflow-y:auto;overscroll-behavior:contain;
  transform:scale(.96);transition:transform .18s;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.overlay.show .alert{transform:scale(1)}
.alert .head{padding:18px 16px 14px;text-align:center}
.alert h2{font-size:17px;line-height:22px;font-weight:600}
.alert .msg{font-size:13px;line-height:18px;color:var(--label-2);margin-top:4px;overflow-wrap:anywhere}
.alert .rows{padding:0 16px 14px}
.alert .arow{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px;
  padding:3px 0;color:var(--label-3)}
.alert .arow b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.alert .warnline{margin:0 16px 14px;font-size:12px;line-height:17px;color:var(--err);
  background:color-mix(in srgb,var(--err) 10%,transparent);border-radius:8px;padding:8px 10px}
.alert .acts{display:flex;border-top:1px solid var(--separator);
  /* 弹窗内容超过视口时需要滚动，按钮钉在底部才不会跟着滚走 */
  position:sticky;bottom:0;background:var(--surface);z-index:1}
.alert .acts button{flex:1 1 0;min-height:44px;border:none;background:var(--surface);color:var(--accent);
  font-size:17px;font-family:inherit;cursor:pointer}
.alert .acts button+button{border-left:1px solid var(--separator)}
.alert .acts button.danger{color:var(--err);font-weight:600}
.alert .acts button.primary{font-weight:600}


/* ---------- 账号展开详情（P18） ---------- */
.detail{background:var(--surface-2);border-bottom:1px solid var(--separator);padding:12px 14px 14px}
.detail:last-child{border-bottom:none}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.barx{display:flex;justify-content:space-between;font-size:11px;line-height:14px;color:var(--label-3);
  margin:5px 0 8px;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px;
  padding:3px 0;color:var(--label-3)}
.kv b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64%}
.sub2{font-size:11px;line-height:14px;color:var(--label-3);font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;margin:12px 0 6px}
.spark{display:flex;align-items:flex-end;gap:4px;height:38px}
.spark>span{flex:1 1 0;background:color-mix(in srgb,var(--accent) 40%,transparent);
  border-radius:3px 3px 0 0;min-width:4px}
.sparkempty{font-size:12px;line-height:17px;color:var(--label-3);padding:8px 0}
.sparkx{display:flex;justify-content:space-between;font-size:10px;line-height:13px;
  color:var(--label-3);margin-top:3px}
.bal{font-size:15px;line-height:20px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.bal i{font-style:normal;font-size:11px;line-height:13px;font-weight:500;color:var(--label-3);margin-left:3px}
.cv{color:var(--label-3);font-size:10px;transition:transform .15s;display:inline-block}
.cv.open{transform:rotate(90deg)}
.plus{font-size:20px;line-height:20px;color:var(--accent);font-weight:400}

/* ---------- 用量明细（P27） ---------- */
/* 「今日消耗」是展开后第一眼要看的东西，所以给到 23px/600；
   平台账单口径与网关请求口径分两块写，避免两个不同来源的数字混在一起。 */
.ustat{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 0}
.ustat .u1 b{font-size:23px;line-height:27px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label)}
.ustat .u1 b.zero{color:var(--label-2)}
.ustat .u1 em{font-style:normal;font-size:12px;line-height:16px;color:var(--label-3);margin-left:5px}
.ustat .u2{font-size:11px;line-height:15px;color:var(--label-3);text-align:right;flex:0 0 auto;max-width:52%}
/* 日期控件：左箭头 + 日期（点开日历）+ 右箭头，沿用 .hseg 的 7px 圆角与 caption 字号。
   规范依据：Apple HIG Date Pickers（单个日期用紧凑控件 + 弹层日历，不用整排按钮）。 */
/* .udtop：日期控件与柱状/折线切换同一行，一左一右；窄屏自动换行不挤成一团。 */
.udtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:8px}
.udays{display:inline-flex;align-items:center;gap:0;max-width:100%;border:1px solid var(--separator);
  border-radius:7px;overflow:hidden;background:var(--surface-2)}
/* 手机端描边别太重：整体用一个浅边框包住，内部按钮不再各自描边，
   但按钮之间保留 1px 分隔线，和 .hseg 分段控件一个观感。 */
.udays button{font:inherit;font-size:12px;line-height:16px;color:var(--label);cursor:pointer;
  background:transparent;border:0;height:28px}
.ud-nav{display:inline-flex;align-items:center;justify-content:center;width:30px;flex:0 0 30px;
  color:var(--label-2)}
.udays .ud-nav:first-child{border-right:1px solid var(--separator)}
.ud-nav:disabled{color:var(--label-3);opacity:.4;cursor:not-allowed}
.udays .ud-date{min-width:88px;padding:0 10px;font-weight:600;border-right:1px solid var(--separator);
  display:inline-flex;align-items:center;justify-content:center}
/* 图表切换与日期控件完全同款：28px 高、12px 字、7px 圆角、1px 边框、
   内部分隔线一致；去掉 hctl 的外边距。 */
.udtop .hctl{margin-top:0}
.udtop .hseg button{height:28px;font-size:12px;line-height:16px;padding:0 10px}
/* 自定义日历弹层（不用浏览器默认 input[type=date]，与后台控件同风格）。
   弹窗宽度贴合日历本身，四周用同一 padding，避免左右比上下空一大截。 */
.alert.cal-dialog{width:min(320px,100%)}
.cal{width:100%;max-width:100%;margin:0 auto}
.cal .calhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.cal .caltitle{font-size:15px;font-weight:600;color:var(--label)}
.cal .calnav{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border:1px solid var(--separator);border-radius:7px;background:var(--surface-2);
  color:var(--label-2);cursor:pointer}
.cal .calnav:disabled{opacity:.35;cursor:not-allowed}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 16px 8px}
.calgrid .cw{font-size:11px;line-height:16px;color:var(--label-3);text-align:center;padding:4px 0}
.calgrid .cd{position:relative;display:flex;align-items:center;justify-content:center;
  height:34px;border:0;border-radius:8px;background:transparent;color:var(--label);
  font:inherit;font-size:13px;cursor:pointer}
.calgrid .cd:hover:not(:disabled){background:var(--fill)}
.calgrid .cd:disabled{color:var(--label-3);opacity:.35;cursor:not-allowed}
.calgrid .cd[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.calgrid .cd.today:not([aria-pressed="true"])::after{content:"";position:absolute;bottom:4px;
  width:3px;height:3px;border-radius:50%;background:var(--accent)}
.calgrid .cd.empty{visibility:hidden}
.calfoot{padding:6px 16px 16px;font-size:11px;line-height:16px;color:var(--label-3);text-align:center}
/* P48 图表控件：segmented control，Apple HIG 11/13 caption，选中态用强调色 */
.hctl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hseg{display:inline-flex;border:1px solid var(--separator);border-radius:7px;overflow:hidden}
.hseg button{font:inherit;font-size:11px;line-height:15px;padding:3px 8px;border:0;border-right:1px solid var(--separator);
  background:var(--surface-2);color:var(--label-2);cursor:pointer}
.hseg button:last-child{border-right:0}
.hseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.hwarn{color:var(--warn,#BA7517)}
/* 峰值标注：Apple HIG caption1 12/16；数值用强调色，不抢正文 */
.hpeak{font-size:12px;line-height:16px;color:var(--label-2);margin-top:8px}
.hpeak b{color:var(--accent)}
/* 峰值柱的小色点：取代原来压在文字行上的柱顶数值标签 */
.hpeak .pkdot{display:inline-block;width:7px;height:7px;border-radius:2px;
  background:var(--accent);margin-left:6px;vertical-align:middle}
.hbars button{position:relative}
/* R2.2：峰值数值标在峰值「柱顶」/「折线点旁」。
   柱顶标签 bottom:100% 向上伸进预留的 20px 顶部空间，
   与上面的读数行（.hpeak）分行，不再重叠。窄屏自动缩短、ewige 峰值才标。 */
.hbarpk{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;line-height:14px;font-weight:700;color:var(--accent);pointer-events:none}
.hlinepk{position:absolute;transform:translate(-50%,-125%);white-space:nowrap;pointer-events:none;
  font-size:11px;line-height:14px;font-weight:700;color:var(--accent);
  padding:0 3px;border-radius:3px;background:var(--surface)}
.hline svg circle.pk{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.hline{position:relative;height:54px;margin-top:22px}
.hline svg{width:100%;height:54px;display:block;overflow:visible}
.hline svg circle{fill:var(--accent);stroke:var(--surface);stroke-width:1}
.hlinehit{position:absolute;inset:0;display:flex;gap:2px}
.hlinehit button{flex:1 1 0;height:100%;padding:0;border:0;background:none;cursor:pointer;
  position:relative}
.hlinehit button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* R2.23：折线选中态只保留淡底高亮；竖线已去掉（用户反馈中间那条竖线多余）。 */
.hlinehit button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.hbars{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:22px}
.hbars button{flex:1 1 0;min-width:0;height:100%;padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:flex-end}
/* R2.57：全部模式 stacked 柱必须上下堆叠（low 在下/high 在上）。
   原默认 flex-direction:row 让两段左右并排各占一半宽，峰值标签居中在两半交界，
   看起来「靠右」。改 column 后两段共占满柱宽，标签真正居中。 */
.hbars button.stacked{flex-direction:column;justify-content:flex-end}
.hbars button>i{display:block;width:100%;min-height:2px;border-radius:2px 2px 0 0;
  background:color-mix(in srgb,var(--accent) 32%,transparent);transition:background .12s}
.hbars button[aria-pressed="true"]>i{background:var(--accent)}
.hbars button.haserr>i{background:color-mix(in srgb,var(--err) 50%,transparent)}
.hbars button[aria-pressed="true"].haserr>i{background:var(--err)}
.hx{display:flex;justify-content:space-between;font-size:10px;line-height:13px;color:var(--label-3);margin-top:3px}
.hsum{font-size:12px;line-height:17px;color:var(--label-2);margin-top:6px}
/* R1.1：low/high 叠加配色。high 固定品牌紫（与 Qoder 角标同色系），
   low 用强调色；深浅色主题下都保证与背景对比度。 */
:root{--purple:#8944AB}
.hline svg circle.m-low{fill:var(--accent)}
.hline svg circle.m-high{fill:var(--purple)}
.hbars button>i.seg-low{background:color-mix(in srgb,var(--accent) 40%,transparent);border-radius:2px 2px 0 0}
.hbars button>i.seg-high{background:var(--purple);border-radius:0}
.hbars button.stacked[aria-pressed="true"]>i.seg-low{background:var(--accent)}
/* 峰值柱：与上方 .pkdot 呼应，堆叠/单柱都高亮成主色 */
.hbars button.pk>i.seg-low{background:var(--accent)}
/* R2.53：小时下钻的分钟分桶图 */
.drill{margin-top:10px;padding:10px 12px;border:1px solid var(--fill);border-radius:8px;
  background:color-mix(in srgb,var(--accent) 4%,transparent)}
.drillhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12px;line-height:16px;color:var(--label-2);margin-bottom:8px}
.drillhead .dbseg{margin-left:auto}
.drillback{border:0;background:none;color:var(--accent);cursor:pointer;
  font-size:11px;line-height:16px;padding:0}
.dbseg button{border:1px solid var(--fill);background:none;color:var(--label-3);
  font-size:11px;line-height:15px;padding:1px 7px;cursor:pointer}
.dbseg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.dbars{display:flex;align-items:flex-end;gap:2px;height:58px}
/* R2.55：下钻柱状——容器 relative 让峰值数值贴柱顶（bottom 按柱高内联） */
.dbucket{flex:1 1 0;min-width:0;height:100%;position:relative;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.dbucket i{display:block;width:100%;max-width:22px;min-height:1px;border-radius:2px 2px 0 0;
  background:color-mix(in srgb,var(--accent) 55%,transparent);position:relative}
/* R2.57：峰值标签挂在柱 <i> 上（position:relative），bottom:100% 贴柱顶再 +3px 间隙；
   原来挂在 .dbucket 上按 bottom:hgt 定位，忘了算下方 .dtick 时刻标签的高度，
   标签底边压进柱子约 13px。 */
.dbpk{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;line-height:14px;font-weight:700;color:var(--accent);pointer-events:none}
.dtick{font-size:9px;line-height:11px;color:var(--label-3);font-variant-numeric:tabular-nums;margin-top:2px}
/* 下钻折线：与主图同款（viewBox 拉伸，文字用 overlay）。
   R2.57：顶部留 22px 给峰值标签（与主图 .hline 一致），避免冲进上方按钮行。 */
.dline{position:relative;height:54px;margin:22px 0 0}
.dline svg{width:100%;height:54px;display:block;overflow:visible}
.dline svg circle{fill:var(--accent);stroke:var(--surface);stroke-width:1}
.dline svg circle.dlinepk{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.hlegend{display:flex;gap:14px;justify-content:flex-end;font-size:11px;line-height:15px;color:var(--label-2);margin-top:3px}
.hlegend span{display:inline-flex;align-items:center;gap:4px}
.hlegend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.mtag{display:inline-block;font-size:9px;line-height:12px;padding:0 4px;margin-right:5px;border-radius:3px;
  font-weight:700;vertical-align:1px}
.mtag.low{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.mtag.high{background:color-mix(in srgb,var(--purple) 22%,transparent);color:var(--purple)}
/* FREE 角标：账号行标题后，表示当前该账号有免费模型可蹭。绿色系，与 ok pill 一致。 */
.freebadge{display:inline-block;margin-left:6px;padding:0 5px;font-size:9px;line-height:14px;
  border-radius:4px;font-weight:800;letter-spacing:.4px;
  background:color-mix(in srgb,var(--ok,#0F6E56) 16%,transparent);color:var(--ok,#0F6E56);
  vertical-align:1px}
/* R1.1：免费池健康度条。进度 = 可用免费组合/总候选，颜色随风险变化。 */
.freebar{padding:12px 14px}
.fbhead{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;line-height:20px}
.fbhead b{font-weight:700}
.fbnum{font-size:12px;color:var(--label-2)}
.fbtrack{height:7px;border-radius:4px;background:var(--fill);overflow:hidden;margin:8px 0}
.fbtrack i{display:block;height:100%;border-radius:4px;background:var(--ok,#0F6E56);transition:width .3s}
.freebar[data-level="mid"] .fbtrack i{background:var(--warn,#BA7517)}
.freebar[data-level="low"] .fbtrack i{background:#E07B39}
.freebar[data-level="empty"] .fbtrack i{background:var(--err)}
.fbsub{font-size:12px;line-height:17px;color:var(--label-2);margin-top:2px}
.fbnote{font-size:11px;line-height:15px;color:var(--label-3);margin-top:6px}
/* P48 调度切换段：Apple HIG footnote 13/18、caption1 12/16 */
.swrow{padding:9px 12px;border-bottom:1px solid var(--fill)}
.swrow:last-child{border-bottom:0}
.swmain{min-width:0}
.swtitle{font-size:13px;line-height:18px;color:var(--label);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swtitle b{font-weight:500;display:inline-flex;align-items:center;gap:6px}
.swfrom{font-size:12px;line-height:16px;color:var(--label-3)}
.swfrom .ptag{vertical-align:middle}
.swfirst{font-size:12px;line-height:16px;color:var(--label-3)}
.swsub{font-size:12px;line-height:16px;color:var(--label-2);margin-top:2px}
.swreason{font-size:11px;line-height:15px;color:var(--label-3);margin-top:2px;overflow-wrap:anywhere}
/* 调度切换图表控件行：播放按钮 + 段计数 + 当前段说明 */
.sw-controls{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.sw-controls .btn{font-size:12px;line-height:16px;padding:4px 10px}
/* R2.27：时间轴说明行——desc 很长，原来和「第 N/300 段」挤一行读不清。
   让它独占整行（flex-basis:100%），文本允许折行；step 用等宽数字。 */
#swStep{font-variant-numeric:tabular-nums;font-weight:600}
#swDesc{flex-basis:100%;line-height:1.5;overflow-wrap:anywhere}
@media (max-width:480px){.sw-controls{gap:8px}}
/* R1.3：免费/付费过滤行 + 折叠提示 + tier 徽章。
   颜色固定（不随主题变），对比度按 WCAG AA 校过：#1D7A34 on #E4F5EA = 4.9:1 */
#swFilter{display:inline-flex;border:1px solid var(--separator);border-radius:7px;overflow:hidden}
#swFilter button{font:inherit;font-size:11px;line-height:15px;padding:3px 8px;border:0;border-right:1px solid var(--separator);
  background:transparent;color:var(--label-2);cursor:pointer}
#swFilter button:last-child{border-right:0}
#swFilter button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw-fold-hint{font-size:12px;line-height:17px;color:var(--label-2);background:var(--fill);
  border-radius:8px;padding:6px 10px;margin-bottom:8px}
.swtier{font-size:10px;line-height:13px;padding:1px 6px;border-radius:6px;font-weight:500;flex:none}
/* R1.5 最近使用模型列表：low/high 徽章（固定色，对比度 ≥4.5:1） */
.sw-mode-pill{display:inline-flex;align-items:center;font-size:10px;line-height:14px;font-weight:600;
  padding:1px 6px;border-radius:6px;flex:none;letter-spacing:.02em}
.sw-mode-pill.m-low{background:#E4F5EA;color:#1D7A34}
.sw-mode-pill.m-high{background:#FCE9E7;color:#B3261E}
:root[data-theme="dark"] .sw-mode-pill.m-low{background:#123A22;color:#7EE2A0}
:root[data-theme="dark"] .sw-mode-pill.m-high{background:#3E1614;color:#FF9B94}
/* R1.6 最近使用列表：左侧平台·模型名，右侧数据汇总（对齐 Apple HIG Lists 行布局） */
.swrecent-head{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap;
  border-bottom:1px solid var(--separator);font-size:12px;color:var(--label-2)}
/* R2.26：账号名智能两态——基础态 = 账号名完整 + 允许换行（"实在放不下就换行，
   此时账号名不缩略"）；JS 测量后给塞得下的行加 .rc-shrink = 账号名省略号 + 强制单行
   （"尽量显示在一行，账号名可缩略"）。判据见 fitRecentRows()。 */
.swrecent-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;
  padding:8px 12px;border-bottom:1px solid var(--fill)}
.swrecent-row.rc-shrink{flex-wrap:nowrap;gap:4px 8px}
.swrecent-row:last-child{border-bottom:0}
.swrecent-name{display:flex;align-items:center;gap:7px;flex:0 1 auto;min-width:0}
.swrecent-row.rc-shrink .swrecent-name{flex:1 1 auto;min-width:0;gap:5px}
.swrecent-name b{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* R2.24：模型名颜色区分 low/high（去掉行内 high 徽章，顶部已有汇总标签）。
   复用 sw-mode-pill 的同款文字色，浅色/深色主题对比度 ≥4.5:1。 */
.swrecent-name b.m-high{color:#B3261E}
.swrecent-name b.m-low{color:#1D7A34}
:root[data-theme="dark"] .swrecent-name b.m-high{color:#FF9B94}
:root[data-theme="dark"] .swrecent-name b.m-low{color:#7EE2A0}
/* R2.19：最近使用列表的账号名（掩码），弱于平台色、强于统计小字 */
.swrecent-acct{font-size:12px;color:var(--label-2);white-space:nowrap;
  max-width:96px;overflow:hidden;text-overflow:ellipsis}
/* 基础态账号名不缩略（完整显示，配合换行）；rc-shrink 态才省略号塞一行 */
.swrecent-row:not(.rc-shrink) .swrecent-acct{max-width:none;overflow:visible}
.swrecent-stat{display:flex;align-items:center;gap:8px;flex:0 1 auto;margin-left:auto;
  font-size:11px;color:var(--label-3);flex-wrap:wrap;justify-content:flex-end}
.swrecent-row.rc-shrink .swrecent-stat{flex:none;margin-left:0;gap:6px;flex-wrap:nowrap}
.swrecent-stat>b{font-size:12px;color:var(--label-2);font-weight:600;white-space:nowrap}
.swrecent-split{white-space:nowrap}
.swrecent-time{white-space:nowrap;font-variant-numeric:tabular-nums}
.swtier.t-free{background:#E4F5EA;color:#1D7A34}
.swtier.t-paid{background:#FCE9E7;color:#B3261E}
.swtier.t-mixed{background:#FFF3E0;color:#8A5A00}
.swtier.t-unknown{background:var(--fill);color:var(--label-3)}
.hlist{margin-top:2px}
/* R2.3：小时明细行——状态改用色点（不再写 success/error 文本），补平台角标+账号掩码。
   两行 flex：色点+时间+角标+账号+模型为一行，数值右对齐；窄屏 meta 自动换行不溢出。 */
.hitem{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding:6px 0;border-bottom:1px solid var(--fill)}
.hitem:last-child{border-bottom:0}
.hitem .sdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.hitem[data-st="error"] .sdot,.hitem[data-st="cancelled"] .sdot{background:var(--err)}
.hitem[data-st="pending"] .sdot{background:var(--warn)}
.hitem .t{font-size:11px;line-height:15px;color:var(--label-3);font-variant-numeric:tabular-nums;flex:0 0 42px}
.hitem .meta{display:flex;align-items:center;gap:6px;flex:1 1 120px;min-width:0}
.hitem .meta .ptag{font-size:10px;line-height:12px;padding:1px 5px}
.hitem .acct{font-size:11px;line-height:15px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hitem .m{font-size:12px;line-height:16px;color:var(--label);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hitem .n{font-size:11px;line-height:15px;color:var(--label-3);font-variant-numeric:tabular-nums;
  flex:0 0 auto;margin-left:auto}
/* R2.53：本次实际扣费积分——真扣费才显示，用强调色区分于耗时/token */
.hitem .n .cost{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
/* 底部颜色图例：说明色点含义，避免用文字标状态 */
.hlegend-st{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;
  font-size:11px;line-height:16px;color:var(--label-3)}
.hlegend-st span{display:inline-flex;align-items:center;gap:5px}
.hlegend-st i{width:7px;height:7px;border-radius:50%;display:inline-block}
.mdl{display:flex;align-items:center;gap:8px;padding:4px 0}
.mdl .nm{font-size:12px;line-height:16px;color:var(--label);flex:1 1 auto;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.mdl .ct{font-size:11px;line-height:15px;color:var(--label-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.mdl .bw{flex:0 0 56px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.mdl .bw i{display:block;height:100%;background:var(--accent);border-radius:2px}
.uload{font-size:12px;line-height:17px;color:var(--label-3);padding:7px 0}
/* R1.6：全账号汇总卡片内部留白，避免内容贴边（尤其手机端）。
   规范：Apple HIG Layout——分组内容统一 16pt 边距；窄屏降到 12pt。 */
.uh-summary-card{padding:14px 14px 12px}
@media (max-width:480px){.uh-summary-card{padding:12px 12px 10px}}
.ulegend{font-size:11px;line-height:16px;color:var(--label-3);margin-top:6px}
/* R2.23：展开/收起按钮——倒三角图标 + 文案融合，和 hsum 文案同一行，不再是独立丑按钮。 */
/* R2.24：展开/收起按钮在图例行行尾（margin-left:auto），倒三角图标融进文案。 */
.hmore{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;
  font-size:11px;line-height:16px;margin-left:auto;white-space:nowrap}
.hmore:hover{text-decoration:underline}
.hmore .caret{display:inline-block;font-size:9px;transition:transform .15s;margin-left:3px}
.hmore[aria-expanded="true"] .caret{transform:rotate(180deg)}
/* R2.23：「最新」标签内联在明细文案行前，只有默认最新小时才加。 */
.latest-tag{font-size:10px;font-weight:600;color:#1D7A34;background:#E4F5EA;
  padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:middle}
:root[data-theme="dark"] .latest-tag{background:#123A22;color:#7EE2A0}
/* P29：账单口径 vs 网关口径的解释块。用户主动问「是不是要加个差额说明」——
   差额不能算成一个数（网关侧大部分请求拿不到扣费），所以这里只讲成分。 */
.gapnote{font-size:11.5px;line-height:18px;color:var(--label-2);margin-top:6px;
  padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--separator)}
.gapnote b{color:var(--label);font-weight:600}

/* ---------- 添加账号弹窗 ---------- */
.alert.wide{width:min(440px,100%)}
/* 扫码 / 粘贴 两段式：扫码是默认，符合「手机上最省事的一条路」 */
.imptabs{display:flex;gap:6px;padding:0 16px 12px}
.imptabs button{flex:1;font:inherit;font-size:13px;line-height:18px;padding:7px 10px;border-radius:9px;
  border:1px solid var(--separator);background:var(--surface-2);color:var(--label-2);cursor:pointer}
.imptabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
/* 平台选择（WorkBuddy / Qoder）：这是**更上一级**的维度 —— 每个平台的
   登录方式完全不一样（WorkBuddy 扫 .info，Qoder 扫设备码），
   混在一个 tab 组里会让人以为「二维码搞混了」（用户原话）。 */
.plattabs{display:flex;gap:6px;padding:0 16px 12px}
.plattabs button{flex:1;font:inherit;font-size:13.5px;line-height:19px;font-weight:600;padding:9px 10px;
  border-radius:10px;border:1px solid var(--separator);background:var(--surface-2);color:var(--label-2);cursor:pointer}
.plattabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.platnote{font-size:12px;line-height:17px;color:var(--label-3);padding:0 16px 10px}
/* 平台差异说明块：讲清「接入方式」和「额度来源」是两件事，避免把
   扫码后余额 0 误读成扫码失败或网关 bug。信息蓝底，深浅主题都可读。 */
.platinfo{margin:0 16px 12px;padding:10px 12px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--separator);
  font-size:12px;line-height:18px;color:var(--label-2)}
.platinfo b{color:var(--label);font-weight:600}
.platinfo .pi-row{display:flex;gap:6px}
.platinfo .pi-k{flex:none;color:var(--label-3);font-weight:600}
.platinfo .pi-warn{color:var(--warn,#B45309)}
.platinfo .pi-ok{color:var(--ok,#1A7F37)}
/* 积分数字是用户最关心的信息，红色醒目（浅色深红/深色亮红，都有足够对比度） */
.platinfo .pi-hot{color:var(--err,#C62828);font-weight:700}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 16px 8px}
/* 二维码固定白底黑模块：识别依赖对比度，绝不能跟着深色主题反色。
   flex:none 是关键——父级 .qrbox 是纵向 flex，默认 flex-shrink:1 会在
   矮视口把二维码压扁（压扁=扫不出来），这里禁止它被压缩。 */
.qrbox .qr{flex:none;width:200px;height:200px;aspect-ratio:1/1;background:#fff;border-radius:12px;padding:8px;
  border:1px solid var(--separator);box-shadow:var(--shadow)}
/* 后端返回的 SVG 带 viewBox，100% 即等比缩放；缺 viewBox 时会被裁切（见 qrlogin._with_viewbox） */
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrtip{font-size:12px;line-height:17px;color:var(--label-3);text-align:center;max-width:300px}
.qrbox .btn{margin-top:2px}
.imp{padding:0 16px 14px}
.imp textarea{width:100%;height:132px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:16px;padding:10px;border-radius:10px;border:1px solid var(--separator);
  background:var(--surface-2);color:var(--label);outline:none;overflow-wrap:anywhere}
.imp textarea:focus{border-color:var(--accent)}
.improw{display:flex;align-items:center;gap:8px;margin-top:8px}
.filebtn{font-size:13px;line-height:18px;color:var(--accent);cursor:pointer;white-space:nowrap}
.impname{font-size:12px;line-height:16px;color:var(--label-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 通用输入弹窗（P20：改找回邮箱） */
.field{padding:0 16px 14px}
.field label{display:block;font-size:12px;line-height:16px;color:var(--label-3);margin-bottom:6px}
/* 字段标签后的说明问号（与 ghead 的 ghelp 同款：单色 currentColor、可点） */
.field .lbl{display:flex;align-items:center;gap:5px}
.field .ghelp{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border:0;background:transparent;color:var(--label-3);cursor:pointer;padding:0;vertical-align:middle}
.field .ghelp:hover{color:var(--accent)}
.field input{width:100%;height:40px;padding:0 11px;font-size:15px;font-family:inherit;
  border:1px solid var(--separator);border-radius:9px;background:var(--bg);color:var(--label)}
.field input:focus{outline:none;border-color:var(--accent)}
/* 输入框内自研清空按钮（✕）：右对齐、currentColor 单色，风格与系统图标统一，
   替代浏览器原生 type=search 的清除叉（原生样式在深浅色下不一致）。 */
.input-wrap{position:relative}
.input-wrap input{padding-right:36px}
.clear-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;display:none;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--label-3);cursor:pointer;padding:0;border-radius:6px}
.clear-btn:hover{background:var(--fill);color:var(--label)}
.input-wrap.has-val .clear-btn{display:inline-flex}
.clear-btn svg{width:14px;height:14px}
.field .err{margin-top:8px;font-size:12px;line-height:17px;color:var(--err);min-height:0}
.hintline{font-size:11px;line-height:16px;color:var(--label-3);margin-top:6px}.err{font-size:12px;line-height:17px;color:var(--err);margin-top:8px;overflow-wrap:anywhere}

@media (max-width:640px){
  .wrap{padding:12px 12px 0}
  .row{min-height:54px;padding:10px 12px}
  .kvrow .k{width:64px}
  pre{font-size:11.5px}
  /* P41：模型行在窄屏换行——价格信息落到第二行，不横向溢出也不截字 */
  .orderrow{flex-wrap:wrap;row-gap:4px;padding:9px 10px}
  .orderrow .omodel{flex:1 1 auto}
  /* R2.37：high 行徽标多（平台+high#N+次数+纯聊天）时，让操作按钮保持右上角、
     和模型名同一行；徽标在 omodel 内换行，不把「启用」按钮挤到下一行掉位。 */
  #highlist .orderrow .oact{margin-left:auto;align-self:flex-start}

  /* R2.5：flex-basis 100% + margin-left 30px 会超出容器 30px，导致 scroll-list
     内部能左右滑。改成 calc 扣掉缩进，并允许收缩，手机端彻底不横向溢出。 */
  .orderrow .ometa{flex:1 1 calc(100% - 30px);max-width:calc(100% - 30px);order:3;margin-left:30px;

  .srow{flex-direction:column;align-items:flex-start;gap:5px}

<!-- R1：ECharts 本地化（admin/vendor/），不依赖外网 CDN——服务器断网图也不空白。
     src 用 "admin/vendor/..." 而不是 "vendor/..."：页面 URL 是 /admin（无尾斜杠），
     相对路径会拿最后一段当目录，"vendor/x" 会解析到 /vendor/x（404），
     "admin/vendor/x" 则正确解析成 /admin/vendor/x（带 /gw 前缀时是 /gw/admin/vendor/x，
     两种部署都不用硬编码前缀）。 -->
<script src="admin/vendor/echarts.min.js"></script>
<script>
/* 禁止双击/双指放大（第三道兜底，专治 iOS Safari：
   - 它忽略 viewport 的 user-scalable=no；
   - gesturestart 是 Safari 私有的双指缩放事件，可 preventDefault 掐掉；
   - dblclick 兜住桌面端双击选中/放大。
   CSS touch-action:pan-x pan-y 负责现代浏览器，这里是老 Safari 的保险。 */
document.addEventListener("gesturestart", e=>e.preventDefault(), {passive:false});
document.addEventListener("gesturechange", e=>e.preventDefault(), {passive:false});
document.addEventListener("dblclick", e=>e.preventDefault(), {passive:false});
/* 鉴权（P17）：页面里没有、也不许有访问口令。口令只在登录页用一次，
   之后靠 HttpOnly + SameSite=Lax 的会话 cookie 自动携带——JS 读不到，XSS 也偷不走；
   地址栏只剩 /admin，不会再出现 ?token=。
   支持子路径部署（nginx /gw/ → 127.0.0.1:8080）：前缀从 location.pathname 推断。 */
const QS=new URLSearchParams(location.search);
const PREFIX=(location.pathname.match(/^(.*?)\/admin\/?$/)||[,""])[1];
const API=p=>PREFIX+"/admin/api/"+p;
const LOGIN=PREFIX+"/admin";
(function(){const t=QS.get("theme");
  if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);})();

const esc=s=>String(s??"—").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=t=>t?new Date(t*1000).toLocaleString("zh-CN",{hour12:false}):"—";
const fmtShort=t=>t?new Date(t*1000).toLocaleTimeString("zh-CN",{hour12:false}):"—";
const fmtMD=t=>{const d=new Date(t*1000);const p=n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
/* R2.25：最近使用列表的时间——今天只显「时:分」，跨天才带日期。
   窄屏省一大截宽度，避免右侧汇总掉到第二行。 */
const fmtRecent=t=>{const d=new Date(t*1000),now=new Date(),p=n=>String(n).padStart(2,"0");
  const today=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  return today?`${p(d.getHours())}:${p(d.getMinutes())}`
              :`${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
const pill=(t,k)=>`<span class="pill ${k}">${esc(t)}</span>`;
const num=v=>Number(v).toLocaleString("zh-CN",{maximumFractionDigits:2});
/* R2.28：单色 SVG 图标（替代 ⏱/⏸/▶ emoji 码点——它们在部分系统字体下渲染成
   彩色表情包）。依据 Apple HIG Icons：矢量(SVG)、单色模板(currentColor)、
   统一线宽(stroke-width=1.8)、16px 网格、与相邻文字同权重。 */
const SVG_PAUSE='<svg viewBox="0 0 16 16" width="14" height="14" fill="none" '
  +'stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">'
  +'<path d="M5.5 3.5v9M10.5 3.5v9"/></svg>';
const SVG_PLAY='<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">'
  +'<path d="M4.5 3.2a.7.7 0 0 1 1.06-.6l7 4.8a.7.7 0 0 1 0 1.2l-7 4.8a.7.7 0 0 1-1.06-.6z"/></svg>';
/* 日期控件左右箭头（Apple HIG Icons：单色 currentColor、统一线宽） */
const SVG_CHEVRON_L='<svg viewBox="0 0 16 16" width="13" height="13" fill="none" '
  +'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  +'<path d="M10 3.5 5.5 8l4.5 4.5"/></svg>';
const SVG_CHEVRON_R='<svg viewBox="0 0 16 16" width="13" height="13" fill="none" '
  +'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  +'<path d="M6 3.5 10.5 8 6 12.5"/></svg>';
/* 说明问号（Apple HIG Icons：单色 currentColor、统一线宽 1.8、16px 网格）。
   放在分区标题后，点击弹统一风格说明，替代原先贴在列表底部的两行文字。 */
const SVG_HELP='<svg viewBox="0 0 16 16" width="13" height="13" fill="none" '
  +'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  +'<circle cx="8" cy="8" r="6.2"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.77c-.6.28-.8.65-.8 1.28"/>'
  +'<circle cx="8" cy="11.7" r=".7" fill="currentColor" stroke="none"/></svg>';
/* 输入框清空叉（Apple HIG Icons：单色 currentColor、线宽 1.8、16px 网格） */
const SVG_CLEAR='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" '
  +'stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/>'
  +'<path d="M5.8 5.8 10.2 10.2M10.2 5.8 5.8 10.2"/></svg>';

/* 单位与钱的写法统一：credits_workbuddy → 积分，避免 "1265.65000006 credits_workbuddy" */
const UNIT={credits_workbuddy:"积分",credits_wb:"积分",credits_qoder:"积分",mock_credits:"积分"};
const unitOf=u=>UNIT[u]||u||"";
const balanceText=(v,u)=>{
  if(v==null) return "未知";
  return num(v)+" "+(unitOf(u)||"");
};
const priceText=x=>{
  // R2.39b：免费判定统一走官方免费池真源（is_free_pool），不用 DB 的 is_free 猜。
  if(x.is_free_pool||x.pricing==="free") return "免费";
  if(x.pricing==="dynamic") return "浮动";
  if(x.price_factor==null) return "未标价";

  return (f>=1?f.toFixed(1):String(f))+"×";
};
const ctxText=v=>{
  if(!v) return "";
  if(v>=10000) return +(v/10000).toFixed(1)+" 万上下文";
  return v+" 上下文";
};
const msText=ms=>ms>=1000?(ms/1000).toFixed(1)+" 秒":ms+" ms";
/* 错误文案：把人看不懂的英文前缀换成人话，原文保留在后面便于排查 */
function errText(raw){
  const s=String(raw||"");
  if(s.includes("HTTP 429")) return "被限流（429）：额度或频率超限，换个模型再试 —— "+s.replace(/^upstream /,"");
  if(s.includes("HTTP 401")) return "凭据失效（401）：去服务器检查账号凭据 —— "+s.replace(/^upstream /,"");
  if(s.includes("unapproved channel")||s.includes("11128")) return "上游风控拒绝（11128）：这次请求被判定为未授权渠道 —— "+s;
  if(s.includes("no qualified free model")) return "没有可用免费模型，且未开付费兜底（历史记录）";
  return s;
}

let toastTimer;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2100);
}

/* ---------- 复制：http 直连时 navigator.clipboard 不可用（非安全上下文），必须有兜底 ---------- */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text); return true;
    }
  }catch{}
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
    const ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch{ return false; }
}

/* ---------- 扫码登录分享卡片（手机长按保存图片） ----------
   用户原话：把扫码登录做成手机上可长按保存的图片。
   做法：内联 SVG 二维码 → Image → Canvas 绘卡片 → toDataURL(png)。
   参考同类「分享卡片」实现（白底二维码 + 标题/副标题/提示），
   pixelRatio=2 高清输出。移动端长按图片即可保存/识别。 */
const QRCARD_TEXT={
  workbuddy:{brand:"WorkBuddy",title:"扫码登录 WorkBuddy",
    sub:"微信扫码 · 完成手机号验证即可接入网关",
    hint:"微信长按识别二维码完成登录",foot:"模型网关 · 扫码添加账号",
    grad:["#0A62C4","#28A0E6"]},
  qoder:{brand:"Qoder",title:"扫码授权 Qoder",
    sub:"微信扫码 · 在页面确认授权即可接入网关",
    hint:"微信长按识别二维码完成授权",foot:"模型网关 · 扫码添加账号",
    grad:["#6D28D9","#A855F7"]}
};
function svgToImage(svg){
  return new Promise((resolve,reject)=>{
    // segno / 内联 DOM 的 <svg> 常缺 xmlns，作为独立 blob image 加载会失败。
    // 补上命名空间再转 Blob，保证既能画进 canvas 又保持二维码清晰。
    let src=(svg||"").trim();
    if(src && !/<svg[^>]*\bxmlns=/.test(src)){
      src=src.replace(/<svg\b/,'<svg xmlns="http://www.w3.org/2000/svg"');
    }
    const blob=new Blob([src],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror=e=>{ URL.revokeObjectURL(url); reject(e); };
    img.src=url;
  });
}
function _rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
async function makeQrShareCard(svg,platform){
  const t=QRCARD_TEXT[platform]||QRCARD_TEXT.workbuddy;
  const W=750,H=1080,S=2;
  const cv=document.createElement("canvas");
  cv.width=W*S; cv.height=H*S;
  const g=cv.getContext("2d"); g.scale(S,S);
  // 背景
  g.fillStyle="#F5F6F8"; g.fillRect(0,0,W,H);
  // 顶部渐变 header —— 文案只保留品牌名（WorkBuddy / Qoder），垂直居中放大
  const grad=g.createLinearGradient(0,0,W,210);
  grad.addColorStop(0,t.grad[0]); grad.addColorStop(1,t.grad[1]);
  g.fillStyle=grad; g.fillRect(0,0,W,210);
  g.fillStyle="#fff"; g.textAlign="left"; g.textBaseline="middle";
  g.font="700 54px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
  g.fillText(t.brand,40,105);
  g.textBaseline="alphabetic";
  // 卡片
  const cx=W/2, cardX=40, cardW=W-80, cardY=240, cardH=700;
  g.fillStyle="#fff"; g.strokeStyle="#E5E7EB"; g.lineWidth=1;
  _rr(g,cardX,cardY,cardW,cardH,20); g.fill(); g.stroke();
  // 二维码白底容器 —— 不要描边（白底只是保证扫码对比度，边框多余）
  const qSize=520, qPad=16;
  const qX=cx-qSize/2, qY=cardY+40;
  g.fillStyle="#fff";
  _rr(g,qX,qY,qSize,qSize,12); g.fill();
  const img=await svgToImage(svg);
  g.drawImage(img,qX+qPad,qY+qPad,qSize-2*qPad,qSize-2*qPad);
  // 提示（去掉 foot「模型网关 · 扫码添加账号」那行，只留长按提示）
  g.textAlign="center"; g.fillStyle="#1F2937";
  g.font="600 30px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
  g.fillText(t.hint,cx,qY+qSize+64);
  return cv.toDataURL("image/png");
}
function showQrShareCard(svg,platform){
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px";
  const tip=document.createElement("div");
  tip.textContent="长按图片保存 / 识别二维码";
  tip.style.cssText="color:#fff;font-size:15px;-apple-system,BlinkMacSystemFont,sans-serif";
  const img=document.createElement("img");
  img.style.cssText="max-width:100%;max-height:82vh;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.5)";
  const close=document.createElement("button");
  close.textContent="关闭";
  close.style.cssText="background:#fff;border:0;border-radius:10px;padding:10px 28px;font-size:15px;cursor:pointer";
  wrap.appendChild(tip); wrap.appendChild(img); wrap.appendChild(close);
  document.body.appendChild(wrap);
  close.onclick=()=>wrap.remove();
  wrap.onclick=e=>{ if(e.target===wrap) wrap.remove(); };
  makeQrShareCard(svg,platform).then(data=>{ img.src=data; })
    .catch(()=>{ wrap.remove(); toast("卡片生成失败"); });
}

/* ---------- 自定义弹窗（替代浏览器原生 confirm，样式随主题） ---------- */
function dialog({title,message,rows=[],warn="",confirmText="好",cancelText="取消",danger=false}){
  return new Promise(resolve=>{
    const ov=document.getElementById("overlay");
    const box=document.getElementById("alert");
    box.innerHTML=`
      <div class="head"><h2>${esc(title)}</h2>
        ${message?`<div class="msg">${esc(message)}</div>`:""}</div>
      ${rows.length?`<div class="rows">${rows.map(([k,v])=>
        `<div class="arow"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>`:""}
      ${warn?`<div class="warnline">${esc(warn)}</div>`:""}
      <div class="acts">
        <button type="button" data-act="cancel">${esc(cancelText)}</button>
        <button type="button" data-act="ok" class="${danger?"danger":"primary"}">${esc(confirmText)}</button>
      </div>`;
    const close=val=>{ ov.classList.remove("show"); box.innerHTML=""; resolve(val); };
    box.querySelector('[data-act="cancel"]').onclick=()=>close(false);
    box.querySelector('[data-act="ok"]').onclick=()=>close(true);
    ov.classList.add("show");
  });
}

/* 只读说明弹窗：只给「知道了」一个按钮，样式与 dialog 完全一致。
   用于分区标题问号——把「一看就知道」之外的补充说明收进弹层，不占列表底部空间。 */
function infoDialog({title,message="",lines=[]}){
  return new Promise(resolve=>{
    // 独立遮罩层：从 SMTP 等弹窗里点问号时，不复用 #alert，
    // 否则关掉说明会把外层表单连输入内容一起清掉。
    const ov=document.getElementById("infoOverlay"), box=document.getElementById("infoAlert");
    box.innerHTML=`
      <div class="head"><h2>${esc(title)}</h2>${message?`<div class="msg">${esc(message)}</div>`:""}</div>
      ${lines.length?`<div class="rows">${lines.map(x=>`<div class="arow" style="display:block;text-align:left">${esc(x)}</div>`).join("")}</div>`:""}
      <div class="acts"><button type="button" data-act="ok" class="primary">知道了</button></div>`;
    const close=()=>{ ov.classList.remove("show"); box.innerHTML=""; resolve(true); };
    box.querySelector('[data-act="ok"]').onclick=close;
    ov.classList.add("show");
  });
}

/* 单行输入弹窗：返回用户输入（取消返回 null）。样式与 dialog 一致，不用原生 prompt */
function inputDialog({title,message="",label="",value="",placeholder="",
                       confirmText="保存",type="text",hint=""}){
  return new Promise(resolve=>{
    const ov=document.getElementById("overlay");
    const box=document.getElementById("alert");
    box.classList.add("wide");
    box.innerHTML=`
      <div class="head"><h2>${esc(title)}</h2>
        ${message?`<div class="msg">${esc(message)}</div>`:""}</div>
      <div class="field">
        ${label?`<label for="dlgInput">${esc(label)}</label>`:""}
        <input id="dlgInput" type="${esc(type)}" value="${esc(value)}"
          placeholder="${esc(placeholder)}" autocapitalize="off" spellcheck="false">
        ${hint?`<div class="hintline">${esc(hint)}</div>`:""}
        <div class="err" id="dlgErr"></div>
      </div>
      <div class="acts">
        <button type="button" data-act="cancel">取消</button>
        <button type="button" data-act="ok" class="primary">${esc(confirmText)}</button>
      </div>`;
    const input=document.getElementById("dlgInput");
    const err=document.getElementById("dlgErr");
    const close=val=>{ ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML=""; resolve(val); };
    box.querySelector('[data-act="cancel"]').onclick=()=>close(null);
    box.querySelector('[data-act="ok"]').onclick=()=>{
      const v=input.value.trim();
      if(!v){ err.textContent="不能为空"; return; }
      close(v);
    };
    input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); box.querySelector('[data-act="ok"]').click(); } });
    ov.classList.add("show");
    setTimeout(()=>{ input.focus(); input.select(); },60);
  });
}

/* SMTP 配置弹窗：多字段，返回对象（取消返回 null）。授权码留空=不改动。 */
function smtpDialog(cfg){
  return new Promise(resolve=>{
    const ov=document.getElementById("overlay");
    const box=document.getElementById("alert");

/* 会话被拒时的整页提示（不再用浏览器 alert） */
function authWall(kind,detail){
  const body=document.getElementById("body");
  const blocked=kind==="blocked";
  const t=blocked?"访问被临时限制":"需要重新登录";
  const d=blocked
    ? "输错次数太多，稍后再试。"
    : "登录已过期，输一次口令继续。";
  body.innerHTML=`<div class="group"><div class="card">
    <div class="step"><div><h3>${t}</h3><p>${esc(d)}</p></div></div>
    <div class="field">
      <label for="relogin-token">访问口令</label>
      <input id="relogin-token" type="password" autocomplete="current-password"
             autocapitalize="off" spellcheck="false" placeholder="访问口令">
      <div class="err" id="relogin-err">${detail?esc(detail):""}</div>
    </div>
    <div class="field" style="padding-top:0">
      <button class="btn" id="relogin-go">用口令登录</button>
      <a class="btn sec" id="relogin-mail" href="${LOGIN}">发一封登录链接到邮箱</a>
    </div>
  </div></div>`;

  const inp=document.getElementById("relogin-token");
  const err=document.getElementById("relogin-err");
  const go=document.getElementById("relogin-go");
  if(!inp||!go) return;
  async function submit(){
    const v=(inp.value||"").trim();
    if(!v){ err.textContent="请先输入口令"; inp.focus(); return; }
    go.disabled=true; go.textContent="登录中…"; err.textContent="";
    try{
      const r=await fetch(API("login"),{method:"POST",credentials:"same-origin",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({token:v})});
      let d=null; try{ d=await r.json(); }catch{}
      if(r.ok&&d&&d.ok){ location.reload(); return; }
      err.textContent=(d&&d.error)||("登录失败（HTTP "+r.status+"）");
      if(r.status===429){ go.textContent="暂时不能试了"; return; }
    }catch(e){
      err.textContent="网络不通，稍后再试";
    }
    go.disabled=false; go.textContent="用口令登录"; inp.select();
  }
  go.addEventListener("click",submit);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); } });
  if(!blocked) setTimeout(()=>{ try{ inp.focus(); }catch(e){} },60);
}

/* ==================== R2.11 细粒度 DOM patch（Vue 式原地更新） ====================
   实时刷新每 5 秒一次，innerHTML 整块重写会「销毁旧节点→重建新节点」，造成页面跳动、
   滚动位置归零、输入框失焦。这里做精简版 keyed diff：解析新 HTML 到模板，递归对比现有
   DOM，只改变化的文本/属性，节点身份保留 → 已绑定的事件自然保留、不重复绑定。
   位置配对为主（同位置同标签直接复用）；ECharts canvas 容器由 _pskip 跳过。 */
function _pskip(el){
  return el._echarts_instance_ || el.__patched_skip__ ||
    (typeof el.className==="string"&&el.className.indexOf("echarts")>=0);
}
function _ppatchNode(oldN,newN){
  if(oldN.nodeType===3||oldN.nodeType===8){
    if(oldN.nodeValue!==newN.nodeValue) oldN.nodeValue=newN.nodeValue;
    return;
  }
  if(oldN.nodeType!==1||_pskip(oldN)) return;
  const oa=oldN.attributes, na=newN.attributes;
  for(let i=na.length-1;i>=0;i--){
    const a=na[i];
    if(a.name==="value") continue;   // 不覆盖用户正在输入的值
    if(oldN.getAttribute(a.name)!==a.value) oldN.setAttribute(a.name,a.value);
  }
  for(let i=oa.length-1;i>=0;i--)
    if(!newN.hasAttribute(oa[i].name)) oldN.removeAttribute(oa[i].name);
  _ppatchChildren(oldN,newN);
}
function _ppatchChildren(parent,tplParent){
  const olds=[...parent.childNodes], news=[...tplParent.childNodes];
  const n=Math.min(olds.length,news.length);
  for(let i=0;i<n;i++){
    const a=olds[i], b=news[i];
    const same=a.nodeType===b.nodeType &&
      (a.nodeType!==1||a.tagName.toLowerCase()===b.tagName.toLowerCase());
    if(same) _ppatchNode(a,b);
    else parent.replaceChild(document.importNode(b,true),a);
  }
  for(let i=olds.length-1;i>=n;i--) parent.removeChild(olds[i]);
  for(let i=n;i<news.length;i++) parent.appendChild(document.importNode(news[i],true));
}
function patchDOM(container,html){
  html=String(html).trim();
  if(container.innerHTML.trim()===html) return;
  const tpl=document.createElement("template");
  tpl.innerHTML=html;
  _ppatchChildren(container,tpl.content);
}

async function getJSON(path){
  const r=await fetch(API(path),{credentials:"same-origin",headers:{"Accept":"application/json"}});
  if(r.status===401){ authWall("expired"); throw Object.assign(new Error("会话已过期"),{auth:true}); }
  if(r.status===429){ authWall("blocked"); throw Object.assign(new Error("访问被限制"),{auth:true}); }
  if(r.status===503) throw new Error("后台未启用（服务器未配置访问口令）");
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function postJSON(path,payload){
  const r=await fetch(API(path),{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(payload||{})});
  if(r.status===401){ authWall("expired"); throw Object.assign(new Error("会话已过期"),{auth:true}); }
  if(r.status===429){ authWall("blocked"); throw Object.assign(new Error("访问被限制"),{auth:true}); }
  const text=await r.text();
  let data=null; try{ data=JSON.parse(text); }catch{}
  if(!r.ok){
    const d=(data&&(data.detail||data.error))||text;
    throw new Error(String(d).slice(0,180));
  }
  return data;
}

      : (p==="models" ? ("models?mode="+encodeURIComponent(M.mode)) : p);

    // R2.26：改按时间窗口取最近 7 天全量——只取 300 条时，近期 low 密集会把

    let sw=[];

/* R2.51：模型页有 low / high 两个档位 tab，各自看本档当前调度。默认 low。 */
const M={q:"",scope:"rec",mode:"low",open:new Set(),items:[],active:null,activeAcc:null,blocked:null,manualModel:null,recentSchedule:null};

function groupOf(x){
  if(x.kind&&x.kind!=="chat") return "gen";
  if(x.pricing==="free") return "free";
  if(x.pricing==="dynamic"||x.pricing==="unknown"||x.price_factor==null) return "unpriced";
  const f=x.price_factor;
  if(f<=0.2) return "low";
  if(f<1) return "mid";
  return "high";
}
const GROUPS=[
  ["free","免费"],
  ["low","低倍率 0.01–0.2×"],
  ["mid","中倍率 0.2–1×"],
  ["high","高倍率 ≥1×"],
  ["unpriced","浮动 / 未标价"],
  ["gen","生成类（图片·视频）"],
];
const GHINT={
  high:"倍率 ≥1×，消耗快。",
  unpriced:"无固定倍率，auto 按任务浮动计费。",
  gen:"仅生成内容，不支持对话与工具。",
};
function defaultOpen(scope){
  if(scope==="rec") return ["free","low","mid","high"];
  if(scope==="free") return ["free"];
  if(scope==="image") return ["free","low"];
  return ["free","low"];
}

function renderModels(items,activeAcc,recentSchedule,blocked,manualModel,mode){
  const body=document.getElementById("body");
  M.items=items||[];
  // R2.51：low / high 档位切换；high 不显示免费池。
  M.mode=(mode==="high")?"high":"low";
  // R2.51：当前档位的置顶模型，控制「恢复自动调度」按钮
  M.manualModel=manualModel||null;
  /* 账号信息要跨函数用：卡片是在 paintModels() 里画的，不是 renderModels。
     之前把它当参数往下传，paintModels 拿不到 → ReferenceError → 整张卡片
     连同整个模型列表都不渲染。放进全局状态才安全。 */
  M.activeAcc=activeAcc||null;
  // R2.44：没有可用候选时的真实原因（调度器 reason）。有值时页面顶部显示
  // 「当前没有可用账号」，不再把默认模型当成「正在使用」。
  M.blocked=blocked||null;
  // R2.39b：最近窗口的真实调度聚合（与用量日志同口径）
  M.recentSchedule=recentSchedule||M.recentSchedule||null;
  if(!M.items.length){ body.innerHTML='<div class="empty">暂无模型数据</div>'; return; }
  M.active=M.items.find(x=>x.active)||null;
  M.open=new Set(defaultOpen(M.scope));
  const isHigh=M.mode==="high";
  body.innerHTML=`
    <div class="seg" role="tablist" id="modelModeSeg" style="margin-bottom:14px">
      <button type="button" role="tab" data-mm="low" aria-selected="${!isHigh}">low · 低成本</button>
      <button type="button" role="tab" data-mm="high" aria-selected="${isHigh}">high · 高质量</button>
    </div>
    ${isHigh?"":'<div id="freebar"></div>'}
    <div class="search">
      <svg viewBox="0 0 16 16"><path d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.3 3.3 1.4-1.4-3.3-3.3zM6.5 10.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
      <input id="mq" placeholder="搜索模型名或用途" value="${esc(M.q)}" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button class="fchip" data-s="rec" aria-pressed="${M.scope==="rec"}">常用</button>
      <button class="fchip" data-s="all" aria-pressed="${M.scope==="all"}">全部</button>
      ${isHigh?"":`<button class="fchip" data-s="free" aria-pressed="${M.scope==="free"}">免费</button>`}
      <button class="fchip" data-s="image" aria-pressed="${M.scope==="image"}">支持图片</button>
      ${M.manualModel?`<button class="fchip" id="resetModelPin" title="清除本档位置顶，恢复自动调度">↺ 恢复默认</button>`:""}
    </div>
    <div id="mlist"></div>`;
  // R2.51：low/high tab 切换——各自重新拉本档位数据
  document.querySelectorAll("#modelModeSeg [data-mm]").forEach(b=>b.onclick=async()=>{
    const m=b.dataset.mm;
    if(m===M.mode) return;
    M.mode=m; M.q=""; M.scope="rec";
    await load("models");
  });
  const resetBtn=document.getElementById("resetModelPin");
  if(resetBtn) resetBtn.onclick=async()=>{
    try{
      const key=M.mode==="high"?"manual_model_high":"manual_model_low";
      await postJSON("schedule",{[key]:null});
      toast("已恢复默认（"+M.mode.toUpperCase()+"）");
      M.manualModel=null;
      resetBtn.remove();   // 恢复后按钮立即消失，不必整页重绘
      await refreshChip();
      const d=await getJSON("models?mode="+encodeURIComponent(M.mode));
      if(d){
        M.items=d.items||[]; M.activeAcc=d.active_account||null;
        M.blocked=d.blocked||null; M.recentSchedule=d.recent_schedule||null;
        M.active=M.items.find(i=>i.active)||null;
        paintModels();
      }
    }catch(e){ toast("恢复失败："+e.message); }
  };
  document.getElementById("mq").addEventListener("input",e=>{ M.q=e.target.value.trim().toLowerCase(); paintModels(); });
  document.getElementById("filters").addEventListener("click",e=>{
    const b=e.target.closest("[data-s]"); if(!b) return;

    document.querySelectorAll("#filters .fchip").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.s===M.scope)));
    M.open=new Set(defaultOpen(M.scope));

  });

/* R1.1：免费池健康度条（模型 tab 顶部）。预测是估算，文案如实标注。 */
function freeBarHTML(f){
  if(!f||!f.health) return "";
  const h=f.health, est=f.estimate||{}, last=f.last_429||{};
  // R1.3：分母是免费池自身容量（真免费模型×可用账号），不是「全部候选」。
  // 之前拿 142 个候选当分母，8/142=6% 被误标「紧张」，其实免费池是满的。
  const free=h.free_pairs||0, cap=h.free_capacity||0;
  const pct=cap?Math.round((free/cap)*100):0;
  const level=cap===0?"empty":(pct===100?"high":(pct>=50?"mid":"low"));
  let timeText="";
  if(est.available){
    if(est.minutes_left===0) timeText="当前已在付费模式";
    else if(est.minutes_left==null) timeText=est.reason||"";
    else timeText="按最近强度，约 "+est.minutes_left+" 分钟后可能进入付费"
      +(est.range?"（区间 "+est.range[0]+"–"+est.range[1]+" 分钟）":"");
  }else{
    // 没有预测数据时整行不显示：后端 reason（如「样本不足，暂不预测」）
    // 属于内部状态说明，不是给用户看的文案，绝不回显到界面上。
    timeText="";
  }
  const reset=last.reset_pending?" · 上次 429 将于 "+hhmm(last.reset_at)+" 重置":"";
  // 真免费模型（目录 pricing=free，无论多长都扣 0）
  // R2.45：池子为空（0/0）时不再显示「模型：无」——「无」不是信息，
  // 只会让人以为网关把模型列表弄丢了；没模型就整行不画。
  const models=(h.free_models||[]).join("、");
  // 短请求免扣：付费模型，仅输入极短时恰好不扣钱 —— 单独一栏，不算免费池
  const lim=h.short_free_limits||{};
  const shortParts=(h.short_free_models||[]).map(m=>
    m+(lim[m]?"（≤"+lim[m]+" token）":"")).join("、");
  return `<div class="group"><div class="card freebar" data-level="${level}">
    <div class="fbhead"><b>免费池</b><span class="fbnum">${free}/${cap} 可用</span></div>
    <div class="fbtrack"><i style="width:${pct}%"></i></div>
    ${(timeText||reset)?`<div class="fbsub">${esc(timeText)}${esc(reset)}</div>`:""}
    ${models?`<div class="fbsub">模型：${esc(models)}</div>`:""}
    ${shortParts?`<div class="fbsub fbshort">短请求免扣：${esc(shortParts)}</div>`:""}
  </div></div>`;
}
function paintFreeBar(){
  const host=document.getElementById("freebar");
  if(!host) return;
  if(!US.health){ patchDOM(host,'<div class="card"><div class="uload">免费池状态加载中…</div></div>');
    loadForecast().then(()=>paintFreeBar()); return; }
  patchDOM(host,freeBarHTML(US.health));
}

  return `<div class="row tap${x.active?" active":""}" data-model="${esc(x.model_name)}">
    <div class="rmain"><div class="rtitle">${esc(x.display_name||x.model_name)}${badges.join("")}</div>
      <div class="rsub">${esc(sub.join(" · "))}</div></div>
    <div class="rright">${right}</div></div>`;
}

function paintModels(){
  const box=document.getElementById("mlist");
  const visible=M.items.filter(modelVisible);
  if(!visible.length){ box.innerHTML='<div class="empty">没有匹配的模型</div>'; return; }
  let h="";
  // R2.39b：模型 tab 与用量日志统一口径 —— 顶部卡片显示**最近窗口的真实调度**，
  // 不再是「典型短请求预览」。数据来自 /models 的 recent_schedule（requests 表）。
  const rs=M.recentSchedule;
  if(rs && rs.total>0 && (rs.items||[]).length){
    const win=rs.window_minutes||5;
    const label=n=>n===1?"1 次":n+" 次";
    /* R2.47：同平台 + 同模型的多个账号合并成一行，账号用 flex-wrap 的 chip 铺开——
       宽屏一行放得下就都放一行，手机端自动换行（不需要 JS 算列数）。
       后端 items 仍按 (平台,模型,账号) 聚合，这里按 (平台,模型) 二次归并，不动后端。 */
    const groups=[];
    const gi=new Map();
    for(const it of (rs.items||[])){
      // R2.54：high 档「最近调度」不该出现免费池模型（hy4flash-free 等）——
      // 那是 low 的历史，混进来会让用户以为 high 在用免费模型。
      if(M.mode==="high" && it.is_free_pool) continue;
      const k=(it.platform||"?")+"|"+it.model_name;
      let g=gi.get(k);
      if(!g){ g={platform:it.platform,model:it.model_name,
        price_factor:it.price_factor,is_free_pool:it.is_free_pool,accts:[],last_at:0};
        gi.set(k,g); groups.push(g); }
      g.accts.push(it);
      g.last_at=Math.max(g.last_at,it.last_at||0);
      if(g.price_factor==null) g.price_factor=it.price_factor;
    }
    groups.sort((a,b)=>b.last_at-a.last_at);
    // 当前正在被调用的模型 = 模型列表的对勾口径（M.active），随 5 秒刷新一起更新
    const activeModel=M.active&&M.active.model_name;
    /* R2.55：口径统一 —— 对勾 = 最近一次真实调用的模型（后端 active 已从
       recent_schedule 取最后一条真实请求，与日志「Token 调用记录」同一口径）。
       本区展示的就是真实调度历史，对勾落在其中最近用过的那一行，用户不再困惑
       「日志里用的模型 vs 模型页勾选」对不上。 */
    const lastUsedModel=groups[0]&&groups[0].model;  // 仍保留：无 active 时的兜底显示
    const rowsHtml=groups.slice(0,8).map(g=>{
      const inPool=!!g.is_free_pool;
      let price;
      if(inPool) price="免费";
      else if(g.price_factor!=null) price=num(g.price_factor)+"x";
      const pill=price?`<span class="pill ${inPool?"free":"info"}">${esc(price)}</span>`:"";
      const tick=(activeModel&&g.model===activeModel)?'<span class="tick" title="当前实际使用的模型（与日志同一口径，每 5 秒刷新）">✓</span>':"";
      /* R2.55：对勾已代表最近真实调用，不再单列「刚用过」徽章（语义重复）。
         仅当后端没给出 active（如窗口内无请求且预览也拿不到）时，兜底标一下最近用过。 */
      const lastUsed=(!activeModel&&g.model===lastUsedModel)?'<span class="justused" title="最近一次真实使用的模型">刚用过</span>':"";
      const accts=g.accts.slice().sort((a,b)=>(b.last_at||0)-(a.last_at||0)).map(a=>{
        const at=a.last_at?` · ${hhmmss(a.last_at)}`:"";
        // R2.49：当前冷却/429 的账号标红并写明原因，与仍可用账号区分。
        // 后端在 cooldown_until>now 时给出该字段；文案取「冷却到 HH:MM」+ 简短原因。
        const off=a.cooldown_until&&a.cooldown_until>Date.now()/1000;
        let why="";
        if(off){
          const t=new Date(a.cooldown_until*1000);
          const hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
          const r=(a.unavailable_reason||"").includes("6004")?" · 429 额度用完":" · 冷却中";
          why=`<i class="sched-why" title="${esc(a.unavailable_reason||"")}">${r}到 ${hm}</i>`;
        }
        return `<span class="sched-acct${off?" off":""}"${off?' title="当前不可用：'+esc(a.unavailable_reason||"冷却中")+'"':""}><b>${esc(dispLabel(a.account_label))}</b><i> · ${label(a.count)}${at}</i>${why}</span>`;
      }).join("");
      const many=g.accts.length>1?`<span class="pill plain">${g.accts.length} 账号</span>`:"";
      return `<div class="row${tick?" active":""}"><div class="rmain">
        <div class="rtitle">${platBadge(g.platform)} ${esc(g.model)} ${pill}${many}${lastUsed}</div>
        <div class="sched-accts">${accts}</div>
      </div>${tick?`<div class="rright">${tick}</div>`:""}</div>`;
    }).join("");
    h+=`<div class="group"><div class="ghead">最近 ${win} 分钟 · 实际调度</div><div class="card">
      ${rowsHtml}
    </div></div>`;
  } else if(M.blocked){
    /* R2.44：调度器一个候选都给不出来。以前这里会画「当前选中 · Hy4 flash 免费」，
