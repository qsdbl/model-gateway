      <button type="button" data-swview="time" aria-pressed="${SW.view==="time"?"true":"false"}">时间轴回放</button>
    </div>
    <!-- R2.32：范围与池过滤合并成一行——范围在前、池在后，播放按钮行尾（仅时间轴用）。
         两者本就只在 flow/time 出现、recent 都隐藏，合并无功能影响。窄屏压缩边距 +
         overflow-x:auto 兜底，避免一行放不下把按钮挤没。 -->
    <div id="swBar" class="sw-bar" style="margin-bottom:10px;${SW.view==="recent"?"display:none":"display:flex"}">
      <span class="swrange-label">范围</span>
      <div class="hseg" id="swRange">
        <button type="button" data-swrange="300" aria-pressed="${SW.range===300?"true":"false"}">近5分钟</button>
        <button type="button" data-swrange="3600" aria-pressed="${SW.range===3600?"true":"false"}">近1小时</button>
        <button type="button" data-swrange="0" aria-pressed="${SW.range===0?"true":"false"}">全部</button>
      </div>
      <div class="hseg" id="swFilter">
        <button type="button" data-swfilter="free" aria-pressed="${SW.filter==="free"?"true":"false"}" title="免费池 ${tc.free} 段">免费池<span class="swcnt"> ${tc.free}</span></button>
        <button type="button" data-swfilter="paid" aria-pressed="${SW.filter==="paid"?"true":"false"}" title="付费池 ${tc.paid} 段">付费池<span class="swcnt"> ${tc.paid}</span></button>
        <button type="button" data-swfilter="all" aria-pressed="${SW.filter==="all"?"true":"false"}" title="共 ${segs.length} 段 · 免费池 ${tc.free}（${freePct}%）· 付费池 ${tc.paid}">全部<span class="swcnt"> ${segs.length}</span><span class="swmix" aria-hidden="true"><i style="width:${freePct}%"></i></span></button>
      </div>
      <button type="button" class="swPlayInline" id="swPlay" title="播放/暂停回放" aria-label="播放回放"
        style="${SW.view==="time"?"display:inline-flex":"display:none"}"></button>
    </div>
    <div id="swFoldHint" class="sw-fold-hint" style="display:none"></div>
    <div id="swRecentList" class="card scroll-list" style="${SW.view==="recent"?"display:block":"display:none"};margin-bottom:8px"></div>
    <div class="chart-box" id="swChartBox" style="${SW.view==="recent"?"display:none":"display:block"}">
      <div id="swChart" style="width:100%;height:100%"></div>
    </div>
    <div class="sw-controls" id="swControls" style="${SW.view==="time"?"display:flex":"display:none"}">
      <span id="swStep" style="font-size:13px;color:var(--label-2)"></span>
      <span id="swDesc" style="font-size:13px;color:var(--label-3)"></span>
    </div>
    <details style="margin-top:10px"><summary style="font-size:13px;color:var(--label-3);cursor:pointer">展开文字明细</summary>
      <div class="card scroll-list" style="margin-top:8px">${segs.slice(0,60).map(s=>{
        const src=s.switched_from?`← ${esc(swLabel(s.switched_from))}`:'起点';
        const bad=s.errors?` · <span style="color:var(--err)">${s.errors} 次失败</span>`:"";
        const reason=String(s.reason||"调度器选择").replace(/\d+\.\d{6,}/g,m=>num(Number(m)));
        return `<div class="swrow"><div class="swmain"><div class="swtitle">${src} <b>${esc(swLabel(s))}</b> <span class="swtier t-${swInFreePool(s)?"free":"paid"}">${swPoolText(s)}</span></div>
          <div class="swsub">${fmtShort(s.first_at)} · ${s.requests} 次${bad}${s.credit!=null&&s.credit>0?(" · 扣 "+num(s.credit)+" 积分"):""}</div>
          <div class="swreason">${esc(reason)}</div></div></div>`;
      }).join("")}</div>
    </details></div>`;
}

function swInitChart(){
  bindSwEvents();
  if(SW.view==="recent"){ swDrawRecent(); return; }
  if(!window.echarts||!SW.segs.length) return;
  const el=document.getElementById("swChart"); if(!el) return;
  // flow / time 两个视图共用同一个实例：切换时只换 option，不再 init 第二个实例抢同一个 DOM
  if(!SW.chart) SW.chart=echarts.init(el,swTheme().dark?"dark":null);
  SW.chart.resize();
  swDraw();
}
function bindSwEvents(){
  if(SW.bound) return; SW.bound=true;
  document.querySelectorAll("[data-swview]").forEach(b=>b.addEventListener("click",()=>{
    SW.view=b.dataset.swview;
    document.querySelectorAll("[data-swview]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    const recent=SW.view==="recent";
    const box=document.getElementById("swChartBox");
    const list=document.getElementById("swRecentList");
    if(box) box.style.display=recent?"none":"block";
    if(list) list.style.display=recent?"block":"none";
    const ctl=document.getElementById("swControls"); if(ctl) ctl.style.display=SW.view==="time"?"flex":"none";
    // R2.32：范围+池过滤合并为 swBar，recent 隐藏、flow/time 显示（整行一起切）
    const bar=document.getElementById("swBar"); if(bar) bar.style.display=recent?"none":"flex";
    // 播放按钮仍仅时间轴回放用
    const playBtn=document.getElementById("swPlay");
    if(playBtn){ playBtn.style.display=SW.view==="time"?"inline-flex":"none"; paintPlayBtn("play"); }
    stopReplay();
    SW.idx=0;
    if(recent){ swDrawRecent(); return; }
    // R1.7 修复：默认视图是「最近使用」，swInitChart() 首屏就因 recent 提前 return，
    // 从不 init ECharts。从 recent 切到 flow/time 时 SW.chart 仍为空，swDrawFlow()
    // 的 `if(!c) return` 让整图画空白。切非 recent 视图前按需补一次 init。
    if(!SW.chart && window.echarts && SW.segs.length){
      const el=document.getElementById("swChart");
      if(el) SW.chart=echarts.init(el,swTheme().dark?"dark":null);
    }
    if(SW.chart) SW.chart.resize();
    swDraw();
  }));
  document.querySelectorAll("[data-swfilter]").forEach(b=>b.addEventListener("click",()=>{
    SW.filter=b.dataset.swfilter;
    document.querySelectorAll("[data-swfilter]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    stopReplay();
    SW.idx=0;
    swDraw();
  }));
  // R2.28：时间范围切换——按 last_at 过滤最近 N 秒的段，近5分钟看实时变化
  document.querySelectorAll("[data-swrange]").forEach(b=>b.addEventListener("click",()=>{
    SW.range=Number(b.dataset.swrange)||0;
    document.querySelectorAll("[data-swrange]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    stopReplay();
    SW.idx=0;
    paintPlayBtn("play");
    swDraw();
  }));
  const play=document.getElementById("swPlay");
  if(play) play.addEventListener("click",()=>{
    if(SW.timer){ stopReplay(); paintPlayBtn("play"); return; }  // 播放中 → 暂停
    const n=swFilterSegs().length;
    if(!n) return;
    if(SW.idx>=n-1) SW.idx=0;
    paintPlayBtn("pause");
    SW.timer=setInterval(()=>{
      SW.idx++;
      if(SW.idx>=n){ stopReplay(); paintPlayBtn("replay"); return; }
      swDraw();
    },1300);
  });
}
/* R2.28：回放控制——按钮只放图内小圆钮，SVG 单色图标（无 emoji）。 */
function stopReplay(){ if(SW.timer){clearInterval(SW.timer);SW.timer=null;} }
function paintPlayBtn(mode){
  const b=document.getElementById("swPlay"); if(!b) return;
  const playing=mode==="pause";
  b.innerHTML=playing?SVG_PAUSE:SVG_PLAY;
  b.setAttribute("aria-pressed",String(playing));
  b.setAttribute("aria-label",playing?"暂停回放":(mode==="replay"?"重新播放":"播放回放"));
  b.title=playing?"暂停":(mode==="replay"?"重新播放":"播放");
}
function swDraw(){
  if(SW.view==="recent") swDrawRecent();
  else if(SW.view==="flow") swDrawFlow();
  else swDrawTime();
}
/* R2.5：图表尺寸按容器宽度自适应——手机端 342px 容器里，写死的
   sankey left/right=170（或 grid.left=130）会吃掉几乎全部宽度，节点/彩带
   被挤成中间一竖条。这里统一算「侧边标签宽度」：窄屏收紧、宽屏维持原值。 */
function swChartW(){
  const el=document.getElementById("swChart");
  return el?Math.round(el.getBoundingClientRect().width):600;
}
function swCompact(){ return swChartW()<500; }
/* R2.27：桑基每侧留白（容纳两行标签：账号行 + 模型行）。
   依据 ECharts option.html#series-sankey.left/right：留白是像素或百分比。
   要点：两侧留白总和必须明显小于容器宽，否则节点标签被裁到画布外。
   容器 <500(compact) 给 62；否则按容器 22% 算并夹在 [96,150]——
   580px 容器 → 128px，两侧 256 < 580，中间 324px 留给彩带。 */
function swLabelPad(){
  const w=swChartW();
  // R2.27 补丁：手机端 62 太窄（标签宽56 < 最长「hy4flash-free」70px），
  // breakAll 把模型名腰斩成 hy4flash-fr/ee。实测文本宽度后提到 80（标签宽74>70），
  // 两侧160 < 容器327，中间仍剩167px 画彩带。桌面 128 不变。
  return w<500?80:Math.max(96,Math.min(150,Math.round(w*0.22)));
}
/* R1.6 最近使用模型列表：按「平台 · 模型」聚合，只列名称，数据在右侧汇总。
   用户明确：不要弄成日志列表那样每条堆一堆字段——只要平台·模型名，
   调用次数 / low-high 分布 / 最近调用时间统一汇总在右边。按最近调用时间倒序。 */
function swDrawRecent(){
  const el=document.getElementById("swRecentList"); if(!el) return;
  const segs=SW.segs||[];
  if(!segs.length){ patchDOM(el,'<div class="empty" style="padding:14px">还没有调用记录</div>'); return; }
  // R2.19：按「平台 · 账号 · 模型」聚合——用户要看到「WB 明月 hy4flash-free」，
  // 之前按「平台·模型」合并把账号抹掉了。账号用 dispLabel 掩码，和账号页一致。
  const agg=new Map();
  for(const s of segs){
    const acct=s.account||"";
    const key=(s.platform||"?")+"\u0000"+acct+"\u0000"+(s.model||"—");
    if(!agg.has(key)) agg.set(key,{platform:s.platform,account:acct,model:s.model,
      requests:0,low:0,high:0,last_at:0,credit:0,errors:0});
    const a=agg.get(key);
    a.requests+=s.requests||0;
    a[s.public_mode==="high"?"high":"low"]+=s.requests||0;
    a.last_at=Math.max(a.last_at,s.last_at||s.first_at||0);
    a.credit+=(s.credit||0);
    a.errors+=(s.errors||0);
  }
  const rows=[...agg.values()].sort((a,b)=>b.last_at-a.last_at);
  const totalLow=rows.reduce((n,a)=>n+a.low,0);
  const totalHigh=rows.reduce((n,a)=>n+a.high,0);
  const head=`<div class="swrecent-head">
      <span>最近使用模型 · 按调用时间</span>
      <span class="sw-mode-pill m-low">low ${totalLow}</span>
      <span class="sw-mode-pill m-high">high ${totalHigh}</span>
    </div>`;
  const body=rows.map(a=>{
    const qd=(a.platform||"").toLowerCase()==="qoder";
    const plat=qd?"QD":"WB", platColor=qd?"#8944AB":"#0A62C4";
    // R2.24：去掉行内 low/high 徽章——顶部汇总已有标签色区分；改由模型名字体颜色区分。
    // 有扣费/失败才补一笔。
    /* R2.25：窄屏一行显示——积分用「N分」更短（红色数字语义已够），失败同理去空格。 */
    const extra=(a.errors?`<span style="color:var(--err)">${a.errors}失败</span>`:"")
      +(a.credit>0?`<span style="color:var(--err)">${num(a.credit)}分</span>`:"");
    // R2.25：今天只显「时:分」，跨天才带日期，省一大截宽度。
    const recent=a.last_at?fmtRecent(a.last_at):"—";
    const acctDisp=a.account?dispLabel(a.account):"";
    return `<div class="swrecent-row">
      <div class="swrecent-name">
        <span style="color:${platColor};font-weight:600;font-size:11px;flex:none">${plat}</span>
        ${acctDisp?`<span class="swrecent-acct" title="${esc(a.account)}">${esc(acctDisp)}</span>`:""}
        <b class="${a.high?"m-high":"m-low"}">${esc(a.model||"—")}</b>
      </div>
      <div class="swrecent-stat">
        <b>${a.requests} 次</b>
        ${extra}
        <span class="swrecent-time">${recent}</span>
      </div>
    </div>`;
  }).join("");
  patchDOM(el,head+body);
  fitRecentRows(el);
}

/* R2.26：最近使用行「账号名智能两态」——
   用户要求：账号名可缩略让内容尽量挤一行；实在塞不下才换行，且换行时不缩略账号名。
   做法（逐行测量，两态切换）：
     1) 先全部回基础态（账号名完整 + flex-wrap 允许换行），量每行 name/stat 顶部差；
     2) 基础态已单行 → 保持（账号名完整，最理想）；
     3) 基础态换行了 → 加 .rc-shrink（账号名省略号 + nowrap）再量；
        - 能塞回单行 → 保留 .rc-shrink（缩略单行）；
        - 仍塞不下 → 移除 .rc-shrink（换行，但账号名恢复完整不缩略）。
   测量引起的 reflow 只在 patchDOM 后跑一次，不在实时刷新高频路径里反复抖。 */
function fitRecentRows(el){
  if(!el) return;
  const rows=[...el.querySelectorAll(".swrecent-row")];
  rows.forEach(r=>r.classList.remove("rc-shrink"));
  const isOneLine=r=>{
    const n=r.querySelector(".swrecent-name"),s=r.querySelector(".swrecent-stat");
    if(!n||!s) return true;
    return Math.abs(n.getBoundingClientRect().top-s.getBoundingClientRect().top)<=2;
  };
  // 缩略态账号名的最小可读宽度：低于它说明被压得太狠（"深…""模…"都看不清），
  // 这种时候用户宁可换行也要看全名字——放弃单行，回基础态完整显示。
  const MIN_ACCT=44;
  const acctReadable=r=>{
    const a=r.querySelector(".swrecent-acct");
    if(!a) return true;
    return a.getBoundingClientRect().width>=MIN_ACCT;
  };
  for(const r of rows){
    if(isOneLine(r)) continue;         // 基础态就单行：账号名保持完整
    r.classList.add("rc-shrink");       // 试缩略态能否塞回一行
    // 塞回一行后还得保证账号名没被压到看不清；否则回基础态换行+完整名字
    if(!isOneLine(r)||!acctReadable(r)) r.classList.remove("rc-shrink");
  }
}
function swDrawFlow(){
  const c=SW.chart; if(!c) return; const th=swTheme();
  /* 双层桑基：左列 = 切走的账号·模型，右列 = 切进的账号·模型。
     语义就是用户要的「从这里切到那里」：左边一个节点代表"从这儿跳走"，
     右边一个节点代表"跳到这儿"，彩带粗细 = 跳转次数。

     为什么不用单层节点 + 合并边：账号轮转天然有回边（A→B→A），
     ECharts 桑基图要求 DAG，合并后必然抛 "Sankey is a DAG, the original
     data has cycle!"，整图空白（第一次验收就是这个坑）。
     拆成左右两列后，同一对账号之间的来回跳转会并成两条反向彩带
     （左A→右B 和 左B→右A），既无环又保留了跳转方向与次数。 */
  // R2.30：流向图也走范围过滤（与时间轴同口径），近5分钟看实时切换、窗口随时间滚动。
  const seq=[...swRangeSegs()].reverse();   // 时间正序
  /* R1.2：线上 260 段会展开 24 个节点 + 上百条彩带，密密麻麻看不清。
     做法：按「节点参与切换次数」排序，只保留 Top N 节点，其余跳转丢弃
     （不是塞进「其它」节点——那会造成假的 A→其它→B 跳转，误导用户）。
     默认显示 top 12；提示被折叠了多少节点，需要全量可在文字明细看。 */
  const NODE_LIMIT=12;
  const activity={};
  for(let i=1;i<seq.length;i++){
    const a=swLabel(seq[i-1]), b=swLabel(seq[i]);
    if(a===b) continue;
    activity[a]=(activity[a]||0)+1; activity[b]=(activity[b]||0)+1;
  }
  const keep=new Set(Object.keys(activity).sort((x,y)=>activity[y]-activity[x]).slice(0,NODE_LIMIT));
  const hiddenNodes=Object.keys(activity).length-keep.size;
  const pairs={};
  for(let i=1;i<seq.length;i++){
    const from=swLabel(seq[i-1]), to=swLabel(seq[i]);
    if(from===to||!keep.has(from)||!keep.has(to)) continue;
    const k=from+"\u0000"+to;
    if(!pairs[k]) pairs[k]={from,to,count:0,last:i};
    pairs[k].count++;
  }
  const edges=Object.values(pairs);
  SW._hiddenNodes=hiddenNodes;
  swFoldHint(hiddenNodes, keep.size, seq.length);
  if(!edges.length){
    const tip=SW.range>0?"该时间范围内没有切换段，试试「全部」":"没有符合条件的切换段";
    c.setOption({backgroundColor:"transparent",
      title:{text:tip,left:"center",top:"middle",
        textStyle:{color:th.sub,fontSize:13,fontWeight:"normal"}}},true);
    return;
  }
  const leftNames=[], rightNames=[];
  for(const e of edges){
    if(!leftNames.includes(e.from)) leftNames.push(e.from);
    if(!rightNames.includes(e.to)) rightNames.push(e.to);
  }
  /* 同一个「账号 · 模型」可能既是切走的起点、又是切进的终点（A→B→A）。
     ECharts 桑基按名字索引节点，同名出现两次会撞出
     "Cannot set properties of undefined (setting 'dataIndex')"。
     所以左右两侧各加一个角色后缀区分，标签里再把后缀去掉。 */
  const L=n=>"« "+n, R=n=>n+" »";
  const strip=n=>String(n).replace(/^« | »$/g,"");
  /* R1.3：节点名形如「WB <掩码> · <模型>」，一行放不下会被截成
     「hy4f...」。标签改成两行：账号一行、模型一行，各自都短，完整可读。 */
  const twoLine=n=>strip(n).replace(" · ","\n");
  /* R2.27：标签两行显示（账号/模型各一行）。关键教训——series 级 label 的
     width/align 会压制节点级 position，且 left/right 各 170 + width165 = 670
     远超容器宽（实测约580px），右侧标签必然被裁。改为：
     - 留白 swLabelPad() 按容器宽算，保证两侧留白总和 < 容器宽；
     - align/width 下沉到节点级，左列 align:right、右列 align:left（都向外延伸）。
     数值依据 ECharts 官方 option.html#series-sankey.label（position/overflow/align）
     与 #series-sankey.left/right。 */
  const pad=swLabelPad();
  // R2.27 补丁：overflow 用 truncate 而非 breakAll——超长时显示省略号，
  // 不把 hy4flash-free/deepseek-v4.1-flash 这种模型名从中间腰斩成两截。
  const labelBase={color:th.text,fontSize:swCompact()?10:11,lineHeight:swCompact()?13:14,
    overflow:"truncate",ellipsis:"…",width:pad-6};
  const nodes=[
    ...leftNames.map(n=>({name:L(n),itemStyle:{color:swColorOf(n)},
      label:{...labelBase,position:"left",align:"right",formatter:()=>twoLine(n)}})),
    ...rightNames.map(n=>({name:R(n),itemStyle:{color:swColorOf(n)},
      label:{...labelBase,position:"right",align:"left",formatter:()=>twoLine(n)}})),
  ];
  // 彩带宽度按 log 压缩：某对账号可能跳几百次，线性宽度会把别的跳转挤没。
  // 归一到 1..12 之间，保证最少 1、最多 12。
  const maxC=Math.max(...edges.map(e=>e.count));
  const links=edges.map(e=>({
    source:L(e.from), target:R(e.to),
    value:1+Math.round(11*Math.log1p(e.count)/Math.log1p(maxC||1)),
    count:e.count, from:e.from, to:e.to,
  }));
  c.setOption({
    backgroundColor:"transparent",
    tooltip:{trigger:"item",confine:true,
      formatter:p=>p.dataType==="edge"
        ? esc(p.data.from).replace(" · ","<br>")+" → "+esc(p.data.to).replace(" · ","<br>")+"<br>切换 "+p.data.count+" 次"
        : esc(strip(p.name)).replace(" · ","<br>")},
    series:[{
      type:"sankey",layout:"none",emphasis:{focus:"adjacency"},
      // R2.5：侧边留白按容器宽算。窄屏 left/right 收到 60、label.width 收到 62
      // （两行显示，模型名截断但能看到账号掩码）；宽屏维持 170/165 不截字。
      nodeWidth:8,nodeGap:8,draggable:false,top:14,bottom:14,
      left:pad,right:pad,
      data:nodes,links,
      // R2.27：label 配置已下沉到每个节点（左列 align:right / 右列 align:left），
      // 这里不再设全局 width/align——它们会压制节点级 position 导致右侧标签被裁。
      lineStyle:{color:"gradient",opacity:.55}
    }]
  },true);
}
/* R1.3：折叠提示写进 DOM（不是 ECharts title——canvas 内的文字用户看不清、
   自动化也读不到）。节点超过 12 个时明确说「折叠了几个、看下方明细」。 */
function swFoldHint(hidden, shown, total){
  const el=document.getElementById("swFoldHint");
  if(!el) return;
  if(hidden>0){
    el.style.display="block";
    el.textContent="图中只画出切换最频繁的 "+shown+" 个节点（另有 "+hidden+
      " 个较少节点已折叠）；本视图共 "+total+" 段，完整明细见下方「展开文字明细」";
  }else{
    el.style.display="none";
    el.textContent="";
  }
}
/* 按「账号 · 模型」名反查平台色：名字里含模型名，用段数据反查最准 */
function swColorOf(name){
  for(const s of SW.segs){
    if(swLabel(s)===name) return swColor(s);
  }
  return "#8E8E93";
}
function swDrawTime(){
  const c=SW.chart; if(!c) return; const th=swTheme();
  // 段是倒序（最新在前）。播放按 SW.idx 在**倒序**上推进（最新的先演），
  // 所以这里必须直接用 SW.segs，不能 reverse()——之前 reverse 后 idx 与
  // seq 对不上，出现「计数在走第 3 段、文案却还是第 1 段」的不一致。
  // R2.30：范围过滤走公共函数（流向图/时间轴同口径），Date.now() 实时滚动窗口。
  let seq=swRangeSegs();
  if(!seq.length){
    c.setOption({backgroundColor:"transparent",
      title:{text:"该时间范围内没有切换段",left:"center",top:"middle",
        textStyle:{color:th.sub,fontSize:13,fontWeight:"normal"}}},true);
    const st2=document.getElementById("swStep"); if(st2) st2.textContent="";
    const de2=document.getElementById("swDesc"); if(de2) de2.textContent="";
    swFoldHint(0,0,0);
    return;
  }
  const t0=Math.min(...seq.map(s=>s.first_at||0));
  const tEnd=Math.max(...seq.map(s=>s.last_at||s.first_at||0));
  /* R1.2：时间轴同样限流——线上 24 行挤在一起。按段数取 Top 12 活跃行，
     带 WB/QD 角标前缀，与流向图口径一致。 */
  const rowCount={};
  for(const s of seq){ const n=swLabel(s); rowCount[n]=(rowCount[n]||0)+1; }
  // R2.5：手机端只画 6 行（桌面 12），否则 12 行挤在 356px 里每条不到 30px 看不清。
  const compact=swCompact();
  const rows=[...new Set(seq.map(swLabel))]
    .sort((a,b)=>(rowCount[b]-rowCount[a])).slice(0,compact?6:12).reverse();
  const hiddenRows=[...new Set(seq.map(swLabel))].length-rows.length;
  const duration=Math.max(60,tEnd-t0);
  /* R2.28 补丁：X轴 max 向上取整到整分钟，刻度固定 5 等分落在整分钟上——
     原来 max=269.86s 时 ECharts 自动刻度经 Math.round(v/60) 会出现「3m 3m」重复。 */
  const axisMax=Math.ceil(duration/60)*60;
  const axisStep=Math.max(60,Math.ceil(axisMax/5/60)*60);  // 刻度间隔也为整分钟，杜绝重复标签
  const idx=Math.min(SW.idx,seq.length-1), cur=seq[idx];
  swFoldHint(hiddenRows, rows.length, seq.length);
  c.setOption({
    backgroundColor:"transparent",
    /* R2.29：左侧空白根因——grid.left=142 但两行标签实际只需 ~70px，右对齐后
       左边空出一大截。实测文本宽（WB 可叹飘零=65px、hy4flash-free=70px），
       axisLabel.width 收到 76/84 刚好容纳，grid.left=width+间距 → 绘图区左移变宽。 */
    grid:{left:compact?86:96,right:compact?12:16,top:18,bottom:28},
    xAxis:{type:"value",min:0,max:axisMax,interval:axisStep,
      axisLabel:{color:th.sub,formatter:v=>Math.round(v/60)+"m"},
      splitLine:{lineStyle:{color:th.grid}},axisLine:{lineStyle:{color:th.grid}}},
    /* R2.27：Y轴标签原来是「WB 可叹飘零 · hy4flash-free」单行被 truncate 成
       「WB 可叹飘 · hy4f...」。改为 formatter 分两行（账号/模型各一行），
       每行都短、完整可读。依据 ECharts option.html#xAxis.axisLabel（formatter/width/overflow）。
       R2.29：width 从 100/132 收紧到 76/84（实测两行各 ≤70px），overflow 由 breakAll
       改 truncate+「…」——breakAll 会把英文模型名腰斩（hy4flash-fr/ee）。 */
    yAxis:{type:"category",data:rows,axisLabel:{color:th.text,fontSize:compact?10:11,
      width:compact?76:84,overflow:"truncate",ellipsis:"…",lineHeight:compact?13:15,
      formatter:v=>String(v).replace(" · ","\n")},
      splitLine:{show:true,lineStyle:{color:th.grid}}},
    tooltip:{trigger:"item",confine:true,formatter:p=>{
      const s=seq[p.dataIndex];
      return esc(swLabel(s))+"<br>"+fmtShort(s.first_at)+" · "+s.requests+" 次";
    }},
    series:[{
      type:"custom",
      renderItem:(p,api)=>{
        const s=seq[p.dataIndex];
        const x0=api.coord([Math.max(0,s.first_at-t0),0])[0];
        const x1=api.coord([Math.max(1,s.last_at-t0),0])[0];
        const y=api.coord([0,rows.indexOf(swLabel(s))])[1];
        const h=Math.max(8,api.size([0,1])[1]*0.5);
        const isCur=p.dataIndex===idx;
        return {type:"rect",shape:{x:x0,y:y-h/2,width:Math.max(5,x1-x0),height:h,r:4},
          style:{fill:swColor(s),opacity:isCur?1:.8,stroke:isCur?th.text:"transparent",lineWidth:isCur?2:0}};
      },
      data:seq.map((_,i)=>i)
    }]
  },true);
  document.getElementById("swStep").textContent="第 "+(idx+1)+" / "+seq.length+" 段";
  const reason=String(cur?.reason||"起点").replace(/\d+\.\d{6,}/g,m=>num(Number(m)));
  document.getElementById("swDesc").textContent=cur?swLabel(cur)+" — "+reason:"";
}

/* R2.7：请求行抽成函数，实时刷新时只换这块，不动上面的切换图（保留 SW 交互态）。 */
function reqRowsHTML(items){
  let h="";
  for(const x of items){
    const st=x.status==="success"?"ok":(x.status==="error"?"err":"warn");
    const charge=x.actual_credit==null?"扣费未知":("扣费 "+num(x.actual_credit)+" 积分");
    h+=`<div class="row"><div class="rmain">
      <div class="rtitle"><span class="dotst ${st}"></span>${esc(x.model_name||"—")}${
        x.account_label?`${platBadge(x.platform)}<span class="pill plain">${esc(dispLabel(x.account_label))}</span>`:""}</div>
      <div class="rsub">${fmtShort(x.created_at)} · Token 估 ${esc(x.token_estimate)} · ${esc(charge)}</div>
      ${x.error?`<div class="rsub wrap" style="color:var(--err)">${esc(errText(x.error).slice(0,140))}</div>`:""}
      </div><div class="rright"><span class="mono">${
        /* 0 不是「很快」，是「没走到上游」：路由阶段就失败（没可用模型/无可用账号）
           的记录 latency_ms 落库就是 0，显示成 0 ms 会让人以为请求打过去又秒回了。 */
        (x.latency_ms==null||x.latency_ms===0)?"—":msText(x.latency_ms)}</span></div></div>`;

function renderRequests(items,sw){

/* ==================== 调度（P37） ==================== */
let SCH={data:null,
  // R2.5：low/high 列表折叠态（默认收起，只显示前 3 个）；重绘时保留。
  expand:{low:false,high:false}};
/* P41：预览用的请求长度。免费只在一段长度内，长度变了排序也变。 */
let SCH_TOKENS=200;

function schTgl(label,on,cls){ return `<button class="tgl ${cls||""}" data-sch="${label}" aria-pressed="${on?"true":"false"}">${on?"开启":"关闭"}</button>`; }

/* P41：上游按「请求输入 token」计费，免费只是一段长度区间。
   所以这里显示的是「跑这个长度的请求要花多少」，不是「这个模型免费吗」。 */
function schMeta(m){
  const bits=[];
  // R2.39b：免费就免费，不免费写清楚倍率（与用户拍板的口径一致，不再啰嗦）
  const inPool=!!m.is_free_pool;
  if(inPool) bits.push("免费");
  else if(m.price_factor!=null) bits.push("付费 · "+num(m.price_factor)+"x");
  else bits.push("未标价");
  if(m.flat_credit!=null) bits.push("按次 "+num(m.flat_credit));
  if(m.points) bits.push(m.points+" 个实测点");
  return bits.join(" · ");
}
/* R2.6：真免费角标。用后端 always_free（官方标 free / 倍率 0）判定，不硬编码 model id。
   hy4flash-free 与 hy4flash 的 display_name 都叫「Hy4 flash」，靠这个角标区分。 */
function freePill(m){ return m.always_free ? '<span class="pill free">FREE</span>' : ""; }

function renderSchedule(d){
  SCH.data=d;
  const body=document.getElementById("body");
  const models=d.models||[];
  const disabled=new Set(d.disabled_models||[]);
  const hidden=new Set((d.hidden_models||[]).map(x=>String(x).toLowerCase()));
  // R1 Q3：笼统别名（auto/default/快速…）不进候选池，页面也不展示。
  // 用户要的是「只留真正的模型名」，所以这里连模型列表都过滤掉。
  const visModels=models.filter(m=>!hidden.has(String(m.model||"").toLowerCase())&&!hidden.has(String(m.model_name||"").toLowerCase()));
  // R2.39：同一模型在两个平台各有一条（如 WB 的 glm-5.3-flash 与 Qoder 的
  // GLM-5.3-Flash，显示名相同、id 仅大小写不同），列表里不该列两遍。
  // 按小写 model 名合并成一行，平台角标并列展示；variants 保留各平台原始 id，
  // 供启用/停用/排序时写回配置（配置里仍是原始 model id 数组）。
  function mergeByModel(list){
    const map=new Map();
    for(const m of list){
      const k=String(m.model||"").toLowerCase();
      const key=k||("__raw_"+map.size);
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(m);
    }
    return [...map.entries()].map(([key,variants])=>{
      const plats=[...new Set(variants.map(x=>String(x.platform||"workbuddy").toLowerCase()))];
      const primary=variants.find(x=>x.always_free)||variants[0];
      return {...primary, mergeKey:key, platforms:plats, variants};
    });
  }
  const mergedModels=mergeByModel(visModels);
  // high 平台开关：d.high_enabled_platforms 为空 = 不过滤 = 两个平台都算启用。
  const ALL_PLATS=["workbuddy","qoder"];
  const rawHp=(d.high_enabled_platforms||[]).map(x=>String(x).toLowerCase());
  const hpSet=new Set(rawHp.length?rawHp:ALL_PLATS);
  // 合并行的「代表 model id」随启用平台选取：只勾 Qoder 时用 Qoder 的 id
  // （与 high.model_order 里现存的大写 id 风格一致），全平台时用第一个 variant。
  // 这样启用/排序写入的始终是「当前真正会参与调度的那个平台」的 model id。
  function repId(m,set){
    const v=m.variants||[m];
    if(set){ const hit=v.find(x=>set.has(String(x.platform||"workbuddy").toLowerCase())); if(hit) return hit.model; }
    return v[0].model;
  }
  const cooldowns=d.cooldowns||[];
  const log=d.log||[];
  const accounts=d.accounts||[];
  const profiles=d.profiles||{};
  // R2.5：按近 7 天实际调用次数排序，让 low/high 列表顺序 = 真实调用情况。
  const calls=d.model_calls||{};
  const callsOf=(m,mode)=>((calls[m]||{})[mode]||0);
  // R2.6：默认按调用次数；一旦用户拖拽过（ui_low_order 非空），就以用户手动
  // 顺序为准并锁定，不再被调用数覆盖。点「恢复自动排序」清掉它回到默认。
  // 关键：ui_low_order 是纯 UI 展示顺序，和调度策略 strategy/model_order 解耦——
  // 拖拽 low 列表绝不能改变「免费优先自动调度」，否则付费模型被拖前面就开始扣费。
  const lowManual=(d.ui_low_order||[]).length>0;
  // 排名按「合并行里任一 variant 命中配置」判定，兼容合并前写入的任一 id。
  const lowRank=new Map([...(d.ui_low_order||[])].map((m,i)=>[m.toLowerCase(),i]));
  const rankOf=(m,rank)=>{
    let best=Infinity;
    for(const v of (m.variants||[m])){
      const r=rank.get(String(v.model||"").toLowerCase());
      if(r!=null&&r<best) best=r;
    }
    return best===Infinity?-1:best;
  };
  const lowModels=[...mergedModels].sort((a,b)=>{
    if(lowManual){
      const ia=rankOf(a,lowRank), ib=rankOf(b,lowRank);
      if((ia<0)!==(ib<0)) return ia<0?1:-1;           // 拖过的排前
      if(ia>=0&&ib>=0) return ia-ib;
    }
    const ca=callsOf(a.model,"low"), cb=callsOf(b.model,"low");
    if(ca!==cb) return cb-ca;
    return (b.free_upto||0)-(a.free_upto||0);
  });
  // high：启用的排前（按 high model_order 内的先后），再按调用次数。
  const highRank=new Map([...((profiles.high?.model_order)||[])].map((m,i)=>[String(m).toLowerCase(),i]));
  const highModels=[...mergedModels].sort((a,b)=>{
    const ia=rankOf(a,highRank), ib=rankOf(b,highRank);
    if((ia<0)!==(ib<0)) return ia<0?1:-1;             // 启用的在前
    if(ia>=0&&ib>=0) return ia-ib;                     // 启用项按配置序
    return callsOf(b.model,"high")-callsOf(a.model,"high");          // 未启用按调用数
  });

  let h="";

  /* --- P15 遗留手动锁：必须显眼地提示并可一键清除 --- */
  if(d.legacy_lock){
    h+=`<div class="group"><div class="ghead">遗留手动锁</div><div class="card">
      <div class="row"><div class="rmain">
        <div class="rtitle">锁在 ${esc(d.legacy_lock)}</div>
        <div class="rsub">旧版手动锁会让自动调度失效。</div>
      </div><div class="rright"><button class="btn" id="clearlockbtn">清除</button></div></div>
    </div></div>`;
  }

  /* --- P49：后台任务状态。自动签到 / 凭据续期全靠后台线程，
         它要是没起来，页面却什么都不显示，用户只会以为「今天没邮件」。 --- */
  const bg=d.background||{};
  if(bg.enabled!==undefined){
    const sLog=(log||[]).find(l=>l.event==="signin");
    const bLog=(log||[]).find(l=>l.event==="background");
    /* 调度日志的 detail 形如「每日签到：9 个账号，7 成功 / 0 失败，邮件已发送」，
       拆成「时间 + 邮件状态徽章 + 摘要」三段，窄屏才不会挤成一行。 */
    const sDetail=sLog?(sLog.detail||""):"";
    const sTime=sLog?fmtShort(sLog.created_at):"";
    const sMail=/邮件已发送/.test(sDetail)?"邮件已发送"
                :(/邮件未发送/.test(sDetail)?"邮件未发送":"");
    const sBody=sDetail.replace(/^每日签到：/,"").replace(/，邮件(已|未)发送$/,"");
    const renewH=Math.round((bg.renew_interval||21600)/3600);
    h+=`<div class="group"><div class="ghead">后台任务</div><div class="card">
      <div class="srow"><div class="sk">维护线程<small>账号同步、探针刷新、自动签到、凭据续期都靠它</small></div>
        <div class="sv">${bg.running?pill("运行中","ok"):pill("未运行","err")}</div></div>
      <div class="srow"><div class="sk">每日签到<small>到点后在窗口内跑一次；服务重启不会漏签</small></div>
        <div class="sv">每天 ${esc(bg.signin_at||"—")} 自动执行</div></div>
      <div class="srow"><div class="sk">凭据续期<small>授权快到期时用 refresh token 自动续</small></div>
        <div class="sv">每 ${renewH} 小时检查一次</div></div>
      <div class="srow"><div class="sk">上次签到<small>${sBody?esc(sBody):"签到结果和邮件发送情况"}</small></div>
        <div class="sv">${sTime?`${esc(sTime)}${sMail?pill(sMail,sMail==="邮件已发送"?"ok":"warn"):""}`:"还没有记录"}</div></div>
      ${bg.last_error?`<div class="srow"><div class="sk">后台错误<small>线程启动或运行时的异常</small></div>
        <div class="sv" style="color:var(--err)">${esc(bg.last_error)}</div></div>`:""}
      ${bLog?`<div class="srow"><div class="sk">最近一次后台报错</div>
        <div class="sv" style="color:var(--err)">${esc(fmtShort(bLog.created_at))} · ${esc(bLog.detail||"")}</div></div>`:""}
    </div></div>`;
  }

  /* --- 策略 --- */
  h+=`<div class="group"><div class="ghead">策略</div><div class="card">
    <div class="srow"><div class="sk">调用顺序<small>自动＝按本次预计扣费从低到高；按顺序＝严格用下面的拖拽顺序</small></div>
      <div class="sv selgrp" id="strategy">
        <button data-strategy="auto" aria-pressed="${d.strategy!=="ordered"?"true":"false"}">自动</button>
        <button data-strategy="ordered" aria-pressed="${d.strategy==="ordered"?"true":"false"}">按顺序</button>
      </div></div>
    <div class="srow"><div class="sk">手动指定<small>选中的模型排最前；它限流了仍自动换下一个</small></div>
      <div class="sv"><select id="manualsel" class="inp">
        <option value="">不指定（自动）</option>
        ${visModels.map(m=>`<option value="${esc(m.model)}"${d.manual_model_low===m.model?" selected":""}>${esc(m.display_name||m.model)}</option>`).join("")}
      </select></div></div>
    <div class="srow"><div class="sk">预览请求长度<small>免费只在一段长度内；换个长度，排序会变</small></div>
      <div class="sv"><select id="lenSel" class="inp">
        ${[100,200,500,1000,2000,5000,10000].map(n=>`<option value="${n}"${Number(d.est_tokens||200)===n?" selected":""}>${n} token</option>`).join("")}
      </select></div></div>
    <div class="srow"><div class="sk">免费用完切付费<small>low 模式：本次没有不扣钱的模型时，用最便宜的付费模型兜底（首次扣费会发邮件）</small></div>
      <div class="sv">${schTgl("allow_paid",d.allow_paid,"warn")}</div></div>
    <div class="srow"><div class="sk">high 积分预警<small>账号余额低于「近 ${esc(String((d.low_balance_alert||{}).window_days||7))} 日峰值 × ${esc(String(Math.round(((d.low_balance_alert||{}).ratio||0.1)*100)))}%」时发邮件</small></div>
      <div class="sv">${schTgl("low_balance_alert",(d.low_balance_alert||{}).enabled!==false)}</div></div>
    <div class="srow"><div class="sk">模型自述<small>把当前模型与计费写进提示词；只在被问到时才展开全量</small></div>
      <div class="sv">${schTgl("fact_preamble",d.fact_preamble)}</div></div>
    <div class="srow"><div class="sk">轮转公平窗口<small>按「最近 N 分钟用了几次」摊平账号，避免只有几个号被轮询到；0=旧累计口径</small></div>
      <div class="sv"><input id="rotWindow" class="inp" type="number" min="0" max="1440" step="5"
        style="width:88px" value="${Number(d.rotation_window_minutes??30)}" aria-label="轮转窗口（分钟）"> <span style="color:var(--label-2);font-size:12px">分钟</span></div></div>
    <div class="srow"><div class="sk">价格标定探针<small>新模型出现时用少量积分测一次；后续价格变化在真实使用中自动更新</small></div>
      <div class="sv"><select id="probeMode" class="inp" aria-label="价格标定模式">
        <option value="coldstart"${d.probe.mode==="coldstart"?" selected":""}>仅新模型冷启动（推荐）</option>
        <option value="all"${d.probe.mode==="all"?" selected":""}>全部模型定期重测（旧行为）</option>
      </select> ${schTgl("probe_enabled",d.probe.enabled,"warn")}</div></div>
    <div class="srow"><div class="sk">免费链路探测<small>用 hy4flash-free 探一次上游是否通，不花积分</small></div>
      <div class="sv"><button id="healthProbeBtn" class="probe-btn" type="button">立即探测</button></div></div>
  </div></div>`;

  /* --- 模型顺序（可拖拽 + 可停用）---
     R2.6：low 区拖拽只改列表显示顺序（ui_low_order，纯 UI，不动免费优先调度）；
     high 区是强模型清单（profiles.high.model_order），标出每个模型在 high 里的优先级。 */
  h+=`<div class="group"><div class="ghead">模型顺序 · low 模式</div>
    <div class="card"><div class="orderlist${SCH.expand.low?" scroll-list":""}" id="orderlist">`;
  if(!lowModels.length){
    h+=`<div class="empty">没有可用的模型目录</div>`;
  }else{
    lowModels.forEach((m,i)=>{
      const nc=callsOf(m.model,"low");
      // 停用状态按任一侧 variant 命中（合并后一个模型可能有多个原始 id）
      const isOff=(m.variants||[m]).some(x=>disabled.has(x.model));
      const isManual=(m.variants||[m]).some(x=>d.manual_model_low===x.model);
      const rep=(m.variants||[m])[0].model;  // low 排序与 high 平台开关无关，固定取首个 variant
      h+=`<div class="orderrow${isOff?" off":""}${isManual?" manual":""}${!SCH.expand.low&&i>=3?" folded":""}" data-model="${esc(rep)}" data-variants="${esc((m.variants||[m]).map(x=>x.model).join(","))}">
        <span class="handle" title="拖动排序">⣿</span>
        <span class="omodel">${(m.platforms||[]).map(p=>platBadge(p)).join("")}${freePill(m)}<span class="mname">${esc(m.display_name||m.model)}</span>${isManual?'<span class="pill info">指定</span>':""}${nc?`<span class="pill plain">${nc} 次</span>`:""}</span>
        <span class="ometa">${esc(schMeta(m))}</span>
        <span class="oact">
          <button class="mv" data-mv="up" title="上移">↑</button>
          <button class="mv" data-mv="down" title="下移">↓</button>
          <button data-ban="1" aria-pressed="${isOff?"true":"false"}">${isOff?"已停用":"停用"}</button>
        </span></div>`;
    });
  }
  h+=`</div>${lowModels.length>3?`<button type="button" class="orderexpand" data-expand="low">${
    SCH.expand.low?"收起 ▲":"展开全部 "+lowModels.length+" 个 ▼"}</button>`:""}${
    lowManual?`<button type="button" class="orderexpand" id="resetLowOrder">恢复自动排序</button>`:""}</div></div>`;

  /* --- high 强模型清单（R1 Q3）：勾选 + 排序，账号耗尽自动切下一账号/下一模型 ---
     R2.39：同模型跨平台合并成一行 + 平台角标；未勾选平台的专属模型隐藏；
     底部两行说明收进标题后的问号弹窗。 */
  h+=`<div class="group"><div class="ghead">high 强模型清单 · 勾选启用 · 按优先级排序
      <button type="button" class="ghelp" id="highHelp" title="说明" aria-label="说明">${SVG_HELP}</button></div>
    <div class="card">
    <div class="srow"><div class="sk">启用平台<small>只勾一个平台时，high 严格只用该平台，不可用直接报错不回落</small></div>
      <div class="sv selgrp" id="highPlats">${
        ALL_PLATS.map(p=>`<button type="button" data-hplat="${p}" aria-pressed="${hpSet.has(p)?"true":"false"}">${esc(PLAT_FULL[p]||p)}</button>`).join("")
      }</div></div>
    <div class="orderlist${SCH.expand.high?" scroll-list":""}" id="highlist">`;
  if(!highModels.length){
    h+=`<div class="empty">没有可用的模型目录</div>`;
  }else{
    highModels.forEach((m,i)=>{
      const rep=repId(m,hpSet);
      const nc=callsOf(rep,"high");
      // R2.39：合并行的启用态只由「任一 variant 在 model_order 里」决定，与平台开关无关。
      // 两平台都有的模型，取消其中一个平台后仍能通过另一个平台使用，绝不能打删除线。
      const r=rankOf(m,highRank);
      const inHigh=r>=0;
      const rank=inHigh?r+1:0;
      // R2.54：high 区也要显示 high 档置顶徽标（与 low 区 isManual 对称）。
      const isManualHigh=(m.variants||[m]).some(x=>String(d.manual_model_high||"").toLowerCase()===String(x.model||"").toLowerCase());
      // 平台角标：合并行列出它存在于哪些平台；未启用平台的角标淡化。
      const badges=(m.platforms||[m.platform||"workbuddy"]).map(p=>
        `<span class="ptag${hpSet.has(String(p).toLowerCase())?"":" dim"}" data-plat="${esc(String(p).toLowerCase())}" title="${esc(PLAT_FULL[p]||p)}">${esc(PLAT_SHORT[p]||p)}</span>`).join("");
      // 该合并行是否有「属于已启用平台」的 variant；没有则整行隐藏（联动）。
      const shown=(m.variants||[m]).some(x=>hpSet.has(String(x.platform||"workbuddy").toLowerCase()));
      h+=`<div class="orderrow${inHigh?"":" off"}${!shown?" hidden-plat":""}${!SCH.expand.high&&i>=3?" folded":""}" data-hmodel="${esc(rep)}" data-plats="${esc((m.platforms||[]).join(","))}">
        <span class="handle" style="cursor:${inHigh?"grab":"default"};opacity:${inHigh?1:.3}">⣿</span>
        <span class="omodel">${badges}${freePill(m)}<span class="mname">${esc(m.display_name||m.model)}</span>${inHigh?`<span class="pill info">high #${rank}</span>`:""}${isManualHigh?'<span class="pill info">high 指定</span>':""}${nc?`<span class="pill plain hminor">${nc} 次</span>`:""}</span>
        <span class="ometa">${esc(schMeta(m))}</span>
        <span class="oact"><button data-high="1" aria-pressed="${inHigh?"true":"false"}">${inHigh?"已启用":"启用"}</button></span></div>`;
    });
  }
  h+=`</div>${highModels.length>3?`<button type="button" class="orderexpand" data-expand="high">${
    SCH.expand.high?"收起 ▲":"展开全部 "+highModels.length+" 个 ▼"}</button>`:""}
  </div></div>`;

  /* --- 账号池 --- */
  h+=`<div class="group"><div class="ghead">账号池</div><div class="card scroll-list">`;
  if(!accounts.length){
    h+=`<div class="empty">还没有账号</div>`;
  }else{
    for(const a of accounts){
      const cd=cooldowns.find(c=>c.account_label===a.label);
      // totalUsagePercentage 是小数（0.3 = 30%），显示时乘 100
      const usedPct=a.quota!=null?Math.round(a.quota*100):null;
      h+=`<div class="row"><div class="rmain">
        <div class="rtitle">${esc(dispLabel(a.label))}${a.platform==="qoder"?'<span class="pill plain">仅签到</span>':""}</div>
        <div class="rsub">${a.balance!=null?("余额 "+a.balance+" 积分"):"余额未知"}${
          usedPct!=null?(" · 已用 "+usedPct+"%"):""}${
          a.last_sync_at?(" · 同步于 "+fmtShort(a.last_sync_at)):""
        }${cd?(" · 冷却到 "+fmtShort(cd.until_at)):""}${a.note?(" · "+esc(a.note)):""}</div>
      </div><div class="rright">${a.enabled===0?pill("停用","warn"):pill("参与","ok")}</div></div>`;
    }
  }
  h+=`</div>
    <div class="card" style="margin-top:10px;display:flex;gap:8px;padding:12px">
      <button class="btn" id="probebtn" style="flex:1;background:var(--surface-2,#eee);color:var(--label-1)">跑一轮探针</button>
      <button class="btn" id="calibbtn" style="flex:1;background:var(--surface-2,#eee);color:var(--label-1)">标定价格曲线</button>
    </div>
    <div class="rsub" style="margin:8px 2px 0">对前 8 个模型实测 5 种长度的扣费，约耗 1~2 积分。</div>
    </div></div>`;

  /* --- 调度日志 --- */
  h+=`<div class="group"><div class="ghead">调度日志</div><div class="card scroll-list">`;
  if(!log.length){
    h+=`<div class="empty">还没有换号记录</div>`;
  }else{
    for(const l of log){
      h+=`<div class="row"><div class="rmain"><div class="rtitle" style="font-size:12px">${esc(l.event)}</div>
        <div class="rsub wrap">${esc(l.detail||"")}</div></div>
        <div class="rright"><span class="mono">${fmtShort(l.created_at)}</span></div></div>`;
    }
  }
  h+=`</div></div>`;

  body.innerHTML=h;
  bindSchedule();
}

async function saveSchedule(payload){
  try{
    await postJSON("schedule",payload);
    await load("routes");
  }catch(err){ toast("保存失败："+err.message); }
}
/* R2.5：只保存、不重绘页面（供 high 启用按钮 ajax 局部刷新用）。返回是否成功。 */
async function saveScheduleQuiet(payload){
  try{ await postJSON("schedule",payload); return true; }
  catch(err){ toast("保存失败："+err.message); return false; }
}
/* R2.7：low 拖拽/上移下移后，quiet 保存不重绘，手动同步本地状态 +
   「恢复自动排序」按钮（拖过才显示），避免整页跳动/刷新。 */
function syncLowManualUi(order){
  SCH.data=SCH.data||{};
  SCH.data.ui_low_order=order;
  const card=document.getElementById("orderlist")?.parentElement;
  if(!card) return;
  let btn=document.getElementById("resetLowOrder");
  if(order.length && !btn){
    btn=document.createElement("button");
    btn.type="button"; btn.className="orderexpand"; btn.id="resetLowOrder";
    btn.textContent="恢复自动排序";
    btn.addEventListener("click",()=>resetLowOrderQuiet());
    card.appendChild(btn);
  }else if(!order.length && btn){
    btn.remove();
  }
}
/* R2.8：恢复自动排序——quiet 保存（不重绘）+ 按调用数重排 DOM + 移除按钮。
   和拖拽/上移下移一样走局部更新，杜绝整页跳动。 */
async function resetLowOrderQuiet(){
  const ok=await saveScheduleQuiet({ui_low_order:[]});
  if(!ok) return;
  syncLowManualUi([]);
  const list=document.getElementById("orderlist");
  if(!list) return;
  const calls=(SCH.data&&SCH.data.model_calls)||{};
  const callsOf=(m)=>((calls[m]||{})["low"]||0);
  // 按 low 调用数降序重排现有行；free_upto 作并列 tie-break
  const rows=[...list.querySelectorAll(".orderrow")];
  const freeUpto=(m)=>{
    const model=(SCH.data&&SCH.data.models||[]).find(x=>x.model===m);
    return model?(model.free_upto||0):0;
  };
  rows.sort((a,b)=>{
    const ca=callsOf(a.dataset.model), cb=callsOf(b.dataset.model);
    if(ca!==cb) return cb-ca;
    return freeUpto(b.dataset.model)-freeUpto(a.dataset.model);
  });
  rows.forEach(r=>list.appendChild(r));
}

/* P41：轮询标定进度。一次标定 = N 模型 × 5 档长度 = 5N 次真实请求，
   实测每次约 7 秒，所以要几分钟。页面要持续给出「跑到第几个了」。 */
async function pollCalibrate(btn){
  for(;;){
    await new Promise(r=>setTimeout(r,1500));
    let s;
    try{ s=await getJSON("pricing/calibrate"); }catch{ continue; }
    if(!s.running){
      btn.disabled=false; btn.textContent="标定价格曲线";
      if(s.error) toast("标定失败："+s.error);
      else toast("标定完成："+(s.done||0)+" 个模型");
      await load("routes");
      return;
    }
    btn.textContent="标定中 "+(s.done||0)+"/"+(s.total||"?")+(s.current?" · "+s.current:"");
  }
}

function bindSchedule(){
  const d=SCH.data||{};
  const highHelp=document.getElementById("highHelp");
  if(highHelp) highHelp.addEventListener("click",()=>{
    infoDialog({title:"high 强模型清单",lines:[
      "按列表顺序选模型，余额耗尽自动换下一个账号。",
      "客户端填 high 即走这份清单。",
      "启用平台只作用于 high：只勾一个平台时严格独占，限流、余额 0 或带工具调用会直接报错，不回落其他平台。",
      "同一模型在两个平台都有的，合并成一行并列显示平台角标；未勾选平台的专属模型会隐藏。"
    ]});
  });
  document.querySelectorAll("[data-strategy]").forEach(b=>b.addEventListener("click",async()=>{
    await saveSchedule({strategy:b.dataset.strategy});
  }));
  document.querySelectorAll("[data-sch]").forEach(b=>b.addEventListener("click",async()=>{
    const key=b.dataset.sch;
    if(key==="low_balance_alert"){
      const cur=(SCH.data&&SCH.data.low_balance_alert)||{};
      await saveSchedule({low_balance_alert:{...cur,enabled:!cur.enabled}});
      return;
    }
    const cur=!!(SCH.data&&SCH.data[key]);
    await saveSchedule({[key]:!cur});
  }));

  /* R2.35/36：轮转窗口 + 探针模式 + 免费健康探测 */
  const rotW=document.getElementById("rotWindow");
  if(rotW) rotW.addEventListener("change",async()=>{
    await saveSchedule({rotation_window_minutes:Math.max(0,Math.min(1440,Number(rotW.value)||0))});
  });
  const pm=document.getElementById("probeMode");
  if(pm) pm.addEventListener("change",async()=>{ await saveSchedule({probe_mode:pm.value}); });
  const hb=document.getElementById("healthProbeBtn");
  if(hb) hb.addEventListener("click",async()=>{
    hb.disabled=true;
    const old=hb.textContent; hb.textContent="探测中…";
    try{
      const r=await postJSON("/admin/api/probe/health",{});
      toast(r&&r.ok?`链路正常（${r.model}，扣费 ${r.credit??"未知"}）`:`探测失败：${r&&r.error||"未知"}`);
    }catch(e){ toast("探测请求失败："+(e.message||e),"err"); }
    finally{ hb.disabled=false; hb.textContent=old; }
  });

  /* R2.5：low/high 列表展开/收起（不重新拉接口，只切 DOM class） */
  document.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",()=>{
    const which=b.dataset.expand;
    SCH.expand[which]=!SCH.expand[which];
    const list=document.getElementById(which==="low"?"orderlist":"highlist");
    if(list){
      list.classList.toggle("scroll-list",SCH.expand[which]);
      list.querySelectorAll(".orderrow").forEach((row,i)=>row.classList.toggle("folded",!SCH.expand[which]&&i>=3));
    }
    const n=list?list.querySelectorAll(".orderrow").length:0;
    b.textContent=SCH.expand[which]?"收起 ▲":("展开全部 "+n+" 个 ▼");
  }));

  /* R2.6：恢复自动排序。low 清 ui_low_order（纯 UI，不碰调度）。
     high 不加此按钮——那份清单是用户配置的强模型本身，不是可恢复的默认值。 */
  const resetLow=document.getElementById("resetLowOrder");
  if(resetLow) resetLow.addEventListener("click",()=>resetLowOrderQuiet());

  /* R2.37：high 启用平台开关（写 profiles.high.enabled_platforms）。
     空数组=不过滤=两个平台都勾；只勾一个时严格独占（不可用报错、不回落）。 */
  const HP_PLATS=["workbuddy","qoder"];
  document.querySelectorAll("#highPlats [data-hplat]").forEach(btn=>{
    btn.addEventListener("click",async e=>{
      e.stopPropagation();
      const p=btn.dataset.hplat;
      const cur=new Set((SCH.data?.high_enabled_platforms||[]).map(x=>String(x).toLowerCase()));
      if(!cur.size){ HP_PLATS.forEach(x=>cur.add(x)); } // 空=全勾，展开成全选
      if(cur.has(p)) cur.delete(p); else cur.add(p);
      const next=HP_PLATS.filter(x=>cur.has(x));  // 固定顺序，去掉重复
      btn.disabled=true;
      const ok=await saveScheduleQuiet({profiles:{high:{enabled_platforms:next}}});
      btn.disabled=false;
      if(!ok) return;
      SCH.data.high_enabled_platforms=next;
      const effective=next.length?next:HP_PLATS;
      document.querySelectorAll("#highPlats [data-hplat]").forEach(b=>
        b.setAttribute("aria-pressed",effective.includes(b.dataset.hplat)?"true":"false"));
      // R2.39 联动：隐藏「只有未启用平台」的合并行，淡化未启用平台角标。
      // 每行 data-plats 存该模型出现的所有平台（逗号分隔）。
      document.querySelectorAll("#highlist .orderrow").forEach(row=>{
        const plats=(row.dataset.plats||"").split(",").filter(Boolean);
        const visible=plats.some(x=>effective.includes(x));
        row.classList.toggle("hidden-plat",!visible);
        row.querySelectorAll(".ptag").forEach(tag=>
          tag.classList.toggle("dim",!effective.includes((tag.dataset.plat||"").toLowerCase())));
      });
    });
  });

  /* high 强模型清单：勾选启用 / 停用（写 profiles.high.model_order）。
     R2.5：改 ajax 局部刷新——只更新按钮状态和高亮，不再 load("routes") 整页重绘。 */
  document.querySelectorAll("[data-hmodel]").forEach(row=>{
    const btn=row.querySelector("[data-high]"); if(!btn) return;
    btn.addEventListener("click",async e=>{
      e.stopPropagation();
      const model=row.dataset.hmodel;
      const order=[...(SCH.data?.profiles?.high?.model_order||[])];
      // 兼容合并前写入的仅大小写不同的旧 id（如 GLM-5.3-Flash vs glm-5.3-flash）
      const i=order.findIndex(x=>String(x).toLowerCase()===String(model).toLowerCase());
      const enable=i<0;
      if(i>=0) order.splice(i,1); else order.push(model);
      btn.disabled=true;
      const ok=await saveScheduleQuiet({profiles:{high:{model_order:order}}});
      btn.disabled=false;
      if(!ok) return;
      // 同步本地配置（下次整页加载按新顺序排启用项）
      SCH.data.profiles=SCH.data.profiles||{};
      SCH.data.profiles.high=SCH.data.profiles.high||{};
      SCH.data.profiles.high.model_order=order;
      // 局部刷新按钮与模型名上的 high #N 徽标，不重排 DOM
      const omodel=row.querySelector(".omodel");
      btn.setAttribute("aria-pressed",enable?"true":"false");
      btn.textContent=enable?"已启用":"启用";
      row.classList.toggle("off",!enable);
      const oldPill=omodel.querySelector(".pill.info"); if(oldPill) oldPill.remove();
      if(enable){
        const rank=order.findIndex(x=>String(x).toLowerCase()===String(model).toLowerCase())+1;
        const pill=document.createElement("span"); pill.className="pill info";
        pill.textContent="high #"+rank;
        const nameEl=omodel.querySelector(".mname");
        if(nameEl) omodel.insertBefore(pill,nameEl); else omodel.appendChild(pill);
      }
    });
  });

  /* 手动指定模型（下拉） */
  const msel=document.getElementById("manualsel");
  if(msel) msel.addEventListener("change",async()=>{
    await saveSchedule({manual_model_low:msel.value||null});
  });

  /* 清除 P15 遗留手动锁 */
  const clb=document.getElementById("clearlockbtn");
  if(clb) clb.addEventListener("click",async()=>{
    try{
      await postJSON("schedule",{clear_legacy_lock:true});
      toast("已清除手动锁，恢复自动调度");
      await load("routes");
    }catch(err){ toast("清除失败："+err.message); }
  });

  /* 停用 / 启用模型 */
  document.querySelectorAll("[data-ban]").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();
    const row=b.closest(".orderrow");
    const variants=(row.dataset.variants||row.dataset.model||"").split(",").filter(Boolean);
    const list=new Set(d.disabled_models||[]);
    // 合并行按「当前是否已停用」决定整体开/关，同模型的全部 variant 一起写，
    // 避免只停用一侧、另一侧仍参与调度。
    const isOff=variants.some(x=>list.has(x));
    variants.forEach(x=>{ if(isOff) list.delete(x); else list.add(x); });
    await saveSchedule({disabled_models:[...list]});
  }));

  /* 上移 / 下移：DOM 已移动，只 quiet 保存，不整页重绘 */
  document.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click",async e=>{
    e.stopPropagation();
    const row=b.closest(".orderrow");
    if(b.dataset.mv==="up") row.previousElementSibling&&row.previousElementSibling.before(row);
    else row.nextElementSibling&&row.nextElementSibling.after(row);
    // R2.7：上移/下移 quiet 保存 + 手动同步按钮，不再整页重绘（消除跳动）。
    const order=[...document.querySelectorAll("#orderlist .orderrow")].map(r=>r.dataset.model);
    if(await saveScheduleQuiet({ui_low_order:order})) syncLowManualUi(order);
  }));

  bindOrderDnD("orderlist",saveOrder);
  // high 列表拖拽：只调整「已启用」模型的先后顺序（写 profiles.high.model_order）
  bindOrderDnD("highlist",saveHighOrder);

  const pb=document.getElementById("probebtn");
  if(pb) pb.addEventListener("click",async()=>{
    pb.disabled=true; pb.textContent="探测中…";
    try{
      const r=await postJSON("probe",{});
      toast(r.skipped?("没探："+(r.reason||"")):("探了 "+(r.probed||0)+" 次"));
      await load("routes");
    }catch(err){ toast("探针失败："+err.message); }
    finally{ pb.disabled=false; pb.textContent="跑一轮探针"; }
  });

  /* P41：预览请求长度（免费只在一段长度内，长度变了排序也变） */
  const lenSel=document.getElementById("lenSel");
  if(lenSel) lenSel.addEventListener("change",async()=>{
    SCH_TOKENS=Number(lenSel.value)||200;
    await load("routes");
  });

  /* P41：标定价格曲线（后台跑 + 轮询进度；一次 5N 次请求要几分钟） */
  const cb=document.getElementById("calibbtn");
  if(cb) cb.addEventListener("click",async()=>{
    cb.disabled=true; cb.textContent="启动中…";
    try{
      const r=await postJSON("pricing/calibrate",{limit:8});
      if(!r.started){ toast("标定已在跑："+(r.current||"")); return; }
      toast("标定已启动，正在后台跑");
      await pollCalibrate(cb);
    }catch(err){ toast("启动失败："+err.message); cb.disabled=false; cb.textContent="标定价格曲线"; }
  });
}

/* R2.5：模型列表拖拽排序——改用 Pointer Events，手机端触摸也能拖。
   只在 .handle 上启动拖拽（handle 有 touch-action:none），这样列表其余区域
   仍可正常纵向滚动，不会和拖拽冲突；鼠标/触摸走同一套逻辑。 */
function bindOrderDnD(listId,onSave){
  const list=document.getElementById(listId);
  if(!list) return;
  let dragEl=null, startY=0, moved=false, pid=null;
  /* R2.6：pointermove/pointerup 挂在 document，不挂 handle，也不用 setPointerCapture。
     原因：pointermove 里 target.before(dragEl) 会把 DOM 节点搬走，浏览器因此释放
     pointer capture，后续事件不再发给 handle —— 真机实测 pointerup 收不到、
     touchdrag class 清不掉、onSave 不触发（表现为"拖了没反应"）。
     挂 document 后，无论节点怎么搬，move/up 都能收到。 */
  const onMove=e=>{
    if(!dragEl) return;
    if(pid!=null && e.pointerId!==pid) return;
    if(Math.abs(e.clientY-startY)<4 && !moved) return;
    moved=true;
    e.preventDefault();
    const y=e.clientY;
    const siblings=[...list.querySelectorAll(".orderrow")].filter(r=>r!==dragEl&&!r.classList.contains("folded"));
    let target=null;
    for(const s of siblings){
      const r=s.getBoundingClientRect();
      if(y>=r.top&&y<=r.bottom){ target=s; break; }
    }
    if(target){
      const rect=target.getBoundingClientRect();
      if(y<rect.top+rect.height/2) target.before(dragEl);
      else target.after(dragEl);
    }
  };
  const end=e=>{
    if(!dragEl) return;
    if(pid!=null && e && e.pointerId!=null && e.pointerId!==pid) return;
    dragEl.classList.remove("touchdrag");
    dragEl=null; pid=null;
    if(moved) onSave();
    moved=false;
  };
  list.querySelectorAll(".orderrow").forEach(row=>{
    const handle=row.querySelector(".handle");
    if(!handle) return;
    handle.addEventListener("pointerdown",e=>{
      // 未启用的 high 项不允许拖（handle 已置灰），low 项都可拖
      if(row.classList.contains("off") && listId==="highlist") return;
      e.preventDefault();
      dragEl=row; startY=e.clientY; moved=false; pid=e.pointerId;
      row.classList.add("touchdrag");
    });
  });
  document.addEventListener("pointermove",onMove,{passive:false});
  document.addEventListener("pointerup",end);
  document.addEventListener("pointercancel",end);
}

    <div class="kvrow"><span class="k">模型名</span><span class="v">${esc(c.public_model||"low")}</span>
      ${c.active_model&&c.active_model!==c.public_model?`<span class="aside">当前上游 ${esc(c.active_model)}</span>`:""}
      <button class="mini" data-copy-url="${esc(c.public_model||"low")}">复制</button></div>

  <div class="group"><div class="ghead">验证连通</div><div class="card">
    <div class="step"><div class="num">✓</div><div>
      <h3>让网关真的发一次消息</h3>

function maskKey(k){ return k.length<=8? "••••" : k.slice(0,4)+"••••••"+k.slice(-4); }

function bindCopy(){
  document.querySelectorAll(".copy").forEach(btn=>btn.addEventListener("click",async()=>{
    const target=document.getElementById("blk-"+btn.dataset.copy);
    const code=target?target.textContent:"";
    const ok=await copyText(code);
    btn.textContent=ok?"已复制 ✓":"请长按选择复制";
    btn.classList.toggle("done",ok);
    setTimeout(()=>{btn.textContent="复制这份配置";btn.classList.remove("done");},1600);
  }));
  document.querySelectorAll("[data-copy-url]").forEach(btn=>btn.addEventListener("click",async()=>{
    const v=btn.dataset.copyUrl||"";
    if(!v){ toast("没有可复制的内容"); return; }
    const ok=await copyText(v);
    const old=btn.textContent; btn.textContent=ok?"已复制":"失败";
    setTimeout(()=>btn.textContent=old,1400);
  }));
  document.querySelectorAll("[data-toggle]").forEach(btn=>btn.addEventListener("click",()=>{
    const pre=document.getElementById("pre-"+btn.dataset.toggle);
    const hidden=pre.hasAttribute("hidden");
    if(hidden) pre.removeAttribute("hidden"); else pre.setAttribute("hidden","");
    btn.textContent=hidden?"收起":"展开";
  }));
  const tg=document.getElementById("keytoggle");
  if(tg){
    tg.addEventListener("click",()=>{
      const c=CONFIG||{};
      const el=document.getElementById("keyv");
      const shown=tg.dataset.shown==="1";
      el.textContent=shown?maskKey(c.api_key||"未配置"):(c.api_key||"未配置");
      tg.dataset.shown=shown?"0":"1";
      tg.textContent=shown?"显示":"隐藏";
    });
  }
}

function bindTest(){
  const btn=document.getElementById("testbtn");

  btn.addEventListener("click",async()=>{
    const out=document.getElementById("testout");
    btn.disabled=true; btn.textContent="请求中…";

async function refreshChip(){

/* ==================== 实时刷新（R2.7） ====================
   用户诉求：用量汇总的请求次数/请求明细、以及各 tab 的视图数据要自动刷新，
   方便在页面上实时监控、排查问题。

   设计原则：**只刷数据、不重置交互状态**。整页 load(p) 会把 M.open/SW.idx
   等交互态重置（展开的分组收起、时间轴回放到头），所以这里按 tab 做数据级刷新：
   - accounts：清今天的数据缓存 → 重绘汇总区 + 所有展开账号，保留
     US.day/metric/chart/mode/hour（选中的日期/维度/图形/模式/展开的小时）。
   - requests：重拉列表 + 切换历史，保留 SW.view/idx/筛选/播放态。
   - models/routes/security：能保留状态的保留，其余重新取数。
   页面切到后台时暂停（visibilitychange），省电省流量。 */
const LIVE={
  enabled:true,
  interval:5000,          // 5 秒；测试排查够实时，又不至于把上游打爆
  tab:"models",
  timer:null,
  busy:false,             // 防止上一轮没结束又来一轮
  lastAt:0,
};
/* 刷新状态条已按用户要求移除，保留空函数以兼容现有调用点；5 秒刷新逻辑本身不变。 */
function liveStatus(text,on){}
async function liveRefresh(){
  if(!LIVE.enabled||LIVE.busy||document.hidden) return;
  const p=LIVE.tab;
  if(p==="guide") return;              // 接入页是配置/测试表单，不自动刷
  LIVE.busy=true;
  const when=new Date();
  liveStatus("正在刷新 "+pad2(when.getHours())+":"+pad2(when.getMinutes())+":"+pad2(when.getSeconds()),true);
  try{
    if(p==="accounts"){
      // R2.7：后台取数到缓存（失败保留旧 DOM），全部就绪后一次性重绘，避免空白帧。
      // 保留 US.day/metric/chart/mode/hour 交互状态；展开小时明细同步重拉。
      const labels=["__all__",...[...ACC.open].filter(lb=>lb!=="__all__")];
      await Promise.all(labels.map(lb=>refreshAccountData(lb)));
      labels.forEach(repaintHours);
      try{ await loadForecast(true); paintFreeBar(); paintFreeBadges(); }catch{}  // 健康度 + FREE 角标（强制拉新）
    }else if(p==="requests"){
      // 数据级刷新：重拉列表与切换历史，保留 SW 交互态，只重绘不 bind 重复事件。
      let d=null,sw=null;
      try{ d=await getJSON("requests"); }catch{}
      try{ sw=(await getJSON("switch-history?days=7")).items||[]; }catch{}
      if(d){
        const items=d.items||d;
        const box=document.getElementById("reqList");
        if(box) patchDOM(box,reqRowsHTML(items));
      }
      if(sw){ SW.segs=sw; swDraw(); }
    }else if(p==="models"){
      let d;
      // R2.54：必须带当前档位——否则 5 秒刷新走后端默认 low，把 high 的
      // items 覆盖成 low 全量目录（连 hy4flash-free 都冒出来），这正是
      // 「high 和 low 一样」的核心根因。首屏 load() 已带 mode，这里补齐。
      try{ d=await getJSON("models?mode="+encodeURIComponent(M.mode)); }catch{ d=null; }
      if(d){
        M.items=d.items||[]; M.activeAcc=d.active_account||null;
        M.blocked=d.blocked||null;
        M.recentSchedule=d.recent_schedule||null;
        M.manualModel=d.manual_model||null;
        M.active=M.items.find(x=>x.active)||null;
        paintModels();
      }
      if(M.mode!=="high"){
        try{ await loadForecast(true); }catch{}   // 免费池强制拉新（含新扫码账号）
        paintFreeBar();
      }
    }else if(p==="routes"){
      // 配置页（拖拽/下拉/开关），不自动刷，避免打断操作
      return;
    }else if(p==="security"){
      let d; try{ d=await getJSON("security"); }catch{ d=null; }
      if(d) renderSecurity(d);
    }
    LIVE.lastAt=Date.now();
    liveStatus("已刷新 "+hhmm(Math.floor(LIVE.lastAt/1000)),true);
  }catch(e){
    liveStatus("刷新失败："+(e.message||"error").slice(0,30),false);
  }finally{ LIVE.busy=false; }
}
function armLive(){
  if(LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer=null; }
  if(!LIVE.enabled||document.hidden||LIVE.tab==="guide"||LIVE.tab==="routes") return;
  LIVE.timer=setInterval(liveRefresh,LIVE.interval);
}
(async function init(){
  await loadConfig();
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ if(LIVE.timer){clearInterval(LIVE.timer);LIVE.timer=null;} }
    else armLive();
  });
  selectTab(QS.get("tab")||"models");
  refreshChip();
  // R2.5：横竖屏/窗口缩放后按新宽度重算流向图/时间轴侧边留白，避免又挤成一竖条。
  let rsTimer=null;
  window.addEventListener("resize",()=>{
    if(SW.view==="recent"||!SW.chart) return;
    clearTimeout(rsTimer);
    rsTimer=setTimeout(()=>{ try{ SW.chart.resize(); swDraw(); }catch(_e){} },150);
  });
})();
</script>
</body>
</html>
