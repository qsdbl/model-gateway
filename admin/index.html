       因为 preview 为空时后端回退成默认模型 —— 用户看到「在用免费模型」，
       实际每个请求都 503。现在如实报错，并给出下一步该点哪里。 */
    h+=`<div class="group"><div class="ghead">当前不可用</div><div class="card">
      <div class="row"><div class="rmain">
        <div class="rtitle">没有可用账号<span class="pill err">全部剔除</span></div>
        <div class="rsub">${esc(M.blocked)}</div>
        <div class="rsub" style="margin-top:4px;color:var(--label-3)">去「账号」页重新扫码授权，或点「恢复自动调度」换其他账号。</div>
      </div></div>
    </div></div>`;
  } else if(M.active){
    // 无最近请求时才退回调度预览（口径与调度器一致，只认真免费池）
    const a=M.active;
    const acc=M.activeAcc||(CONFIG&&CONFIG.account?CONFIG.account:null);
    const inFreePool=!!a.is_free_pool;
    const activePrice = inFreePool ? "免费"
      : (a.est_cost!=null && a.est_cost>0
          ? "付费 · "+num(a.est_cost)+" 积分/次"
          : (a.price_factor!=null ? "付费 · "+num(a.price_factor)+"x" : "付费"));
    const priceCls = inFreePool?"free":"info";
    h+=`<div class="group"><div class="ghead">当前选中 · 自动调度预览</div><div class="card">
      <div class="row active"><div class="rmain">
        <div class="rtitle">${esc(a.display_name||a.model_name)}<span class="pill ${priceCls}">${esc(activePrice)}</span></div>
        <div class="rsub">${esc(a.model_name)} · 对外名 ${esc(a.public_name||"")}${acc?(" · 账号 "+platBadge(acc.platform,dispLabel(acc.label))+" "+esc(dispLabel(acc.label))):""} · 调度预览</div>
        <div class="rsub" style="margin-top:4px;color:var(--label-3)">最近没有请求；这是短请求的调度预览，免费只认官方免费池，付费按倍率计。</div>
      </div><div class="rright"><span class="tick">✓</span></div></div>
    </div></div>`;
  }
  for(const [g,label] of GROUPS){
    const rows=visible.filter(x=>groupOf(x)===g);
    if(!rows.length) continue;
    rows.sort((a,b)=>{
      const fa=a.price_factor==null?999:a.price_factor, fb=b.price_factor==null?999:b.price_factor;
      return fa-fb||String(a.display_name||a.model_name).localeCompare(String(b.display_name||b.model_name),"zh");
    });
    const open=M.open.has(g);
    h+=`<div class="group"><div class="card">
      <div class="gh" data-g="${g}" aria-expanded="${open}">
        <span class="t">${label}</span><span class="c">${rows.length}${g==="high"?" · 谨慎":"个"}</span>
        <span class="cv">▶</span>
      </div>
      ${open&&GHINT[g]?`<div class="ghint">${GHINT[g]}</div>`:""}
      ${open?`<div class="scroll-list">${rows.map(modelRow).join("")}</div>`:""}
    </div></div>`;
  }
  const tops=new Map();
  box.querySelectorAll(".scroll-list").forEach(sl=>tops.set(sl.parentElement.querySelector(".gh")?.dataset.g||"",sl.scrollTop));
  patchDOM(box,h);
  box.querySelectorAll(".scroll-list").forEach(sl=>{
    const g=sl.parentElement.querySelector(".gh")?.dataset.g||"";
    if(tops.has(g)) sl.scrollTop=tops.get(g);
  });
  box.querySelectorAll(".gh").forEach(el=>el.onclick=()=>{
    const g=el.dataset.g;
    if(M.open.has(g)) M.open.delete(g); else M.open.add(g);
    paintModels();
  });
  box.querySelectorAll("[data-model]").forEach(el=>el.onclick=async()=>{
    const x=M.items.find(i=>i.model_name===el.dataset.model);
    if(!x||x.active){ toast("已经是当前模型"); return; }
    const g=groupOf(x);
    /* R2.51：切换只影响当前档位（low 或 high），另一档不受影响。
       置顶优先、仍可自动兜底。弹窗说明影响，确认后才写对应档位的键。 */
    const modeName=M.mode.toUpperCase();
    const rows=[
      ["模型 ID",x.model_name],
      ["倍率",priceText(x)],
      ["平台",x.platform==="qoder"?"Qoder":"WorkBuddy"],
      ["上下文",x.context_window?ctxText(x.context_window):"未知"],
      ["影响",`仅 ${modeName} 的实际调用模型置顶为「${x.display_name||x.model_name}」（该模型不可用时自动回落，不锁死；${M.mode==="high"?"LOW":"HIGH"} 不受影响）`],
    ];
    const ok=await dialog({
      title:x.display_name||x.model_name,
      rows, confirmText:"切换", danger:g==="high",
      warn:g==="high"?"倍率 ≥1×，消耗快。":
           (g==="unpriced"?"未标价，切换后验证一次。":""),
    });
    if(ok) switchModel(x);
  });
}

async function switchModel(x){
  try{
    // R2.51：写当前档位的置顶键（manual_model_low / manual_model_high），另一档不动。
    // 并顺手清掉 P15 旧锁——旧锁完全绕过自动调度，且调度页看不见也清不掉。
    const key=M.mode==="high"?"manual_model_high":"manual_model_low";
    await postJSON("schedule",{[key]:x.model_name, clear_legacy_lock:true});
    toast("已置顶 "+(x.display_name||x.model_name)+"（仅 "+M.mode.toUpperCase()+" 生效，不可用时自动回落）");
    await refreshChip();
    // 重绘带上账号/最近调度/不可用原因，否则「没有可用账号」卡片会消失。
    try{
      const d=await getJSON("models?mode="+encodeURIComponent(M.mode));
      if(d){
        M.items=d.items||[]; M.activeAcc=d.active_account||null;
        M.blocked=d.blocked||null; M.recentSchedule=d.recent_schedule||null;
        M.active=M.items.find(i=>i.active)||null;
        M.manualModel=d.manual_model||null;
        paintModels();
      }
    }catch(e){}
    // R2.51：置顶后补出「恢复默认」按钮（只清本档位，不改 DOM 结构就地加）
    const filters=document.getElementById("filters");
    if(filters && !document.getElementById("resetModelPin")){
      const btn=document.createElement("button");
      btn.className="fchip"; btn.id="resetModelPin";
      btn.title="清除本档位置顶，恢复自动调度";
      btn.textContent="↺ 恢复默认";
      filters.appendChild(btn);
      btn.onclick=async()=>{
        try{
          await postJSON("schedule",{[key]:null});
          toast("已恢复默认（"+M.mode.toUpperCase()+"）");
          M.manualModel=null; btn.remove();
          await refreshChip();
          const d=await getJSON("models?mode="+encodeURIComponent(M.mode));
          if(d){
            M.items=d.items||[]; M.activeAcc=d.active_account||null;
            M.blocked=d.blocked||null; M.recentSchedule=d.recent_schedule||null;
            M.active=M.items.find(i=>i.active)||null; paintModels();
          }
        }catch(e){ toast("恢复失败："+e.message); }
      };
    }
  }catch(e){ toast("切换失败："+e.message); }
}

/* ==================== 账号 ==================== */
const ACC={open:new Set(),items:[],platform:"all",platforms:[],platOpen:false};

const creditText=v=>{
  if(v==null) return "未知";
  const n=Number(v);
  return n.toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2});
};
/* R2.1：token 用中文数量级显示，不甩一长串数字、不加英文 tok。
   用户举例「3 千万 / 3 亿 / 3 千 2 百万」——按中文习惯分档：
     ≥1 亿   → X.X 亿（1.34 亿）
     ≥1 千万 → X.X 千万（3.1 千万 = 3107 万；3.2 千万 = 3200 万）
     ≥1 万   → X 万
     <1 万   → 整数
   小数去掉无意义的尾零（3.0→3），保证读起来干净。 */
const tokText=v=>{
  if(v==null) return "未知";
  const n=Number(v)||0, a=Math.abs(n);
  const trim=x=>x.toFixed(1).replace(/\.0$/, "");
  if(a>=1e8)  return trim(n/1e8)+" 亿";
  if(a>=1e7)  return trim(n/1e7)+" 千万";
  if(a>=1e4)  return trim(n/1e4)+" 万";
  return String(Math.round(n));
};
const pctText=r=>r==null?"—":(r*100).toFixed(r<0.1?1:0)+"%";

function daysLeftText(ts){
  if(!ts) return "未标注";
  const days=(ts*1000-Date.now())/86400000;
  if(days<=0) return "已过期";
  if(days<1) return "剩 "+Math.max(1,Math.round(days*24))+" 小时";
  return "剩 "+Math.round(days)+" 天";
}

/* ---------- P27 用量视图 ----------
   用户反馈：「积分消耗看起来不直观，看不到今天消耗的数量，点击没反应」。
   两个口径必须分开，否则数字永远和平台 App 对不上：
     · 平台账单（used 快照差值）→ 「今日消耗」大字，含手机 App/网页版的消耗
     · 网关请求（requests 表）  → 24 小时分布，能看出几点、用什么模型、多少次、多慢
   24 小时数据按 label+日期 缓存，切日期/切小时不重复打接口。 */
const US={day:new Map(),cache:new Map(),hour:new Map(),hourCache:new Map(),bill:new Map(),
  metric:new Map(),chart:new Map(),
  /* R2.53：小时下钻状态。第一次点柱选中小时，第二次点同一柱进入「分钟分桶」视图。
     drill: Map<label, bool>；bucket: Map<label, 6|10>（分桶粒度，默认 10 分钟）。 */
  /* R2.55：下钻固定 10 分钟粒度，图形改柱状/折线切换（drillChart，默认 bar）。
     旧 bucket Map 保留仅为兼容已有状态，不再给用户选 6/10。 */
  drill:new Map(), bucket:new Map(), drillChart:new Map(),
  mode:new Map(),  /* R1.1：每个账号（含 __all__ 汇总）独立的 low/high/全部 选择 */
  /* R2.19/R2.23：小时明细展开条数（key=label|day|hour，默认 10，刷新页面自动重置）。
     R2.23 删掉 liveHour——默认就是实时跟踪最新小时，不需要额外开关。 */
  hourLimit:new Map(),
  health:null};    /* R1.1：免费池健康度 + 预测（模型 tab 顶部进度条） */
const sid=s=>"x"+[...String(s??"")].reduce((a,c)=>((a*31+c.charCodeAt(0))>>>0),7).toString(36);
const pad2=n=>String(n).padStart(2,"0");
const todayKey=()=>{const d=new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());};
const hhmm=ts=>{const d=new Date(ts*1000);return pad2(d.getHours())+":"+pad2(d.getMinutes());};
const hhmmss=ts=>hhmm(ts)+":"+pad2(new Date(ts*1000).getSeconds());

function todayNote(bt){
  if(!bt||bt.delta==null) return (bt&&bt.note)||"今天还没有读到账单";
  // R2.12：这两个口径必须说清，否则会被误读成网关扣费：
  //   ① 这是平台账单数，含官方客户端/网页版，不等于经过网关的请求；
  //   ② 无昨夜基线（whole_day=false）时从账号首条快照算起，不是完整自然日。
  // R2.18：主视图已改用「累计已用」，这里只解释今日读数的口径，不再重复累计数字。
  return bt.whole_day ? "平台账单 · 含官方客户端/网页版"
                      : "平台账单 · 自加入起 · 含官方客户端";
}

/* 两个口径为什么对不上（P29）。用户问的原话：
   「也有可能会登录 workbuddy 软件使用积分，所以会和你统计的积分消耗会对不上是吧？
     这种情况是不是要加一个说明，就是日消耗和图表展示里的日消耗对不上的差额部分」
   对。而且差额**不能**硬算成一个数：上游只在少数响应里回传扣费（今天 60 次成功请求里
   只有 18 次带金额），所以「账单 − 网关」剩下的那截里既有官方客户端/网页版的消耗，
   也有网关见过但拿不到金额的请求。这里只解释成分，不给假精度。 */
function gapNote(label,d){
  const bt=US.bill.get(label);
  if(!bt||bt.delta==null||d.day!==todayKey()) return "";
  const total=d.requests||0;
  if(!total) return "";
  const known=d.credit_requests||0;
  const unknown=Math.max(0,total-known);
  const gw=known?(creditText(d.credit)+" 积分"):"—";
  return `<div class="sub2">口径对比</div>
    <div class="kv"><span>平台账单（今日）</span><b>−${creditText(bt.delta)} 积分</b></div>
    <div class="kv"><span>经过本网关</span><b>${total} 次请求</b></div>
    <div class="kv"><span>上游回传扣费</span><b>${known} 次 · ${gw}</b></div>
    ${unknown>0?`<div class="gapnote">${unknown} 次未回传金额，差额无法精确拆分。</div>`:""}`;
}

/* 日期控件：左箭头(前一天) + 日期(点开日历) + 右箭头(后一天)。默认今天；
   今天时右箭头置灰不可点。数据最多保留 90 天，日历不让它选更早或未来。 */
const keyOf=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parseKey=k=>{const[a,b,c]=String(k).split("-").map(Number);return new Date(a,b-1,c);};
const shiftKey=(k,delta)=>{const d=parseKey(k);d.setDate(d.getDate()+delta);return keyOf(d);};
const dayLabel=k=>{
  const t=todayKey(); if(k===t) return "今天";
  if(k===shiftKey(t,-1)) return "昨天";
  const d=parseKey(k), now=new Date();
  return (d.getFullYear()===now.getFullYear()?"":d.getFullYear()+"年")+(d.getMonth()+1)+"月"+d.getDate()+"日";
};
function dayChips(label){
  const sel=US.day.get(label)||todayKey(), t=todayKey();
  const canNext=sel<t;   // 字符串 YYYY-MM-DD 字典序即时间序
  // 柱状/折线切换与日期控件同一行（一左一右）；窄屏 .udtop 自动换行。
  const chart=US.chart.get(label)||"bar";
  const chartSeg=`<div class="hseg">${[["bar","柱状"],["line","折线"]].map(([k,n])=>
    `<button type="button" data-chart="${k}" aria-pressed="${chart===k}">${n}</button>`).join("")}</div>`;
  return `<div class="udtop">
    <div class="udays">
      <button type="button" class="ud-nav" data-day-step="-1" aria-label="前一天" title="前一天">${SVG_CHEVRON_L}</button>
      <button type="button" class="ud-date" data-day-pick title="选择日期">${esc(dayLabel(sel))}</button>
      <button type="button" class="ud-nav" data-day-step="1" aria-label="后一天" title="后一天" ${canNext?"":"disabled"}>${SVG_CHEVRON_R}</button>
    </div>
    ${chartSeg}
  </div>`;
}

/* 自定义日历弹层：返回选中的 YYYY-MM-DD，取消返回 null。
   风格沿用后台 overlay/alert，7 列网格；只能选 [今天-90天, 今天]。 */
function datePicker(current){
  return new Promise(resolve=>{
    const ov=document.getElementById("overlay"), box=document.getElementById("alert");
    const today=todayKey(), min=shiftKey(today,-90);
    let sel=current>today?today:current, view=new Date(parseKey(sel).getFullYear(),parseKey(sel).getMonth(),1);
    const dow=["日","一","二","三","四","五","六"];
    const close=val=>{ ov.classList.remove("show"); ov.onclick=null; box.innerHTML=""; box.classList.remove("cal-dialog"); resolve(val); };
    function paint(){
      const y=view.getFullYear(), m=view.getMonth();
      const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
      const atMin=y*12+m <= (+min.slice(0,4))*12+(+min.slice(5,7)-1);
      const atMax=y*12+m >= (+today.slice(0,4))*12+(+today.slice(5,7)-1);
      let g=dow.map(w=>`<div class="cw">${w}</div>`).join("");
      for(let i=0;i<first;i++) g+='<div class="cd empty"></div>';
      for(let d=1;d<=days;d++){
        const k=keyOf(new Date(y,m,d));
        const disabled=k<min||k>today;
        g+=`<button type="button" class="cd${k===today?" today":""}" data-pick-day="${k}"
             aria-pressed="${k===sel}" ${disabled?"disabled":""}>${d}</button>`;
      }
      box.innerHTML=`<div class="cal"><div class="calhead">
          <button type="button" class="calnav" data-mon="-1" aria-label="上个月" ${atMin?"disabled":""}>${SVG_CHEVRON_L}</button>
          <span class="caltitle">${y}年${m+1}月</span>
          <button type="button" class="calnav" data-mon="1" aria-label="下个月" ${atMax?"disabled":""}>${SVG_CHEVRON_R}</button>
        </div><div class="calgrid">${g}</div>
        <div class="calfoot">可选范围：最近 90 天</div></div>`;
      box.querySelectorAll("[data-mon]").forEach(b=>b.onclick=()=>{
        view.setMonth(view.getMonth()+(+b.dataset.mon)); paint();
      });
      box.querySelectorAll("[data-pick-day]").forEach(b=>b.onclick=()=>close(b.dataset.pickDay));
    }
    paint();
    box.classList.add("cal-dialog");
    ov.classList.add("show");
    ov.onclick=e=>{ if(e.target===ov) close(null); };
  });
}

function modelRows(d,mode,metric){
  // R2.19：pending（请求中）的记录还没有模型名，后端标成 "unknown"。
  // 这种「还没确定」的行不该出现在模型分布里，容易让人以为真有个 unknown 模型在跑。
  // 请求数仍计入小时总量（后端口径不变），只是这里不单列这一行。
  const list=(d.models||[]).filter(m=>
    m.name!=="unknown" && (!mode||mode==="all"||m.public_mode===mode));
  if(!list.length) return "";
  /* R2.53：模型分布跟上方图表同指标——切到积分显示各模型消耗积分、切到 token
     显示各模型 token，占比也按同一口径算。后端 usage_day 的 models 已带 credit/tokens。 */
  const val=m=>metric==="credit"?(m.credit||0):metric==="tokens"?(m.tokens||0):(m.requests||0);
  const met=METRICS.find(x=>x.k===metric)||METRICS[0];
  const total=list.reduce((a,m)=>a+val(m),0)||1;
  return list.map(m=>{
    const v=val(m);
    const pct=Math.max(2,Math.round((v/total)*100));
    const tag=m.public_mode==="high"?'<span class="mtag high">high</span>'
      :(m.public_mode==="low"&&mode==="all"?'<span class="mtag low">low</span>':"");
    /* 积分视图下没拿到上游扣费的模型（credit=0）不硬凑「0 分」误导，显示 —。
       模型分布的积分带「分」单位（区别于请求数/token），峰值标注则按用户要求只显数值。 */
    const txt=metric==="credit"?(v?creditText(v)+" 分":"—"):met.fmt(v);
    return `<div class="mdl"><span class="nm">${tag}${esc(m.name)}</span>
      <span class="ct">${txt}</span>
      <span class="bw"><i style="width:${pct}%"></i></span></div>`;
  }).join("");
}

/* R2.53：小时下钻——把一小时的明细按 N 分钟分桶，画迷你柱状图。
   数据直接用已缓存的小时明细（usage/hour 返回的 created_at / credit / tokens），
   按当前指标（请求/积分/token）本地聚合，不额外打接口。第一次点柱选中小时、
   第二次点同一柱进入本视图；明细列表仍保留在下方，方便逐条追踪。 */
function drillHTML(label,d,hour,metric,mode){
  const key=label+"|"+d.day+"|"+hour;
  const items=US.hourCache.get(key);
  if(!Array.isArray(items)||!items.length) return "";
  /* R2.55：固定 10 分钟粒度（6 桶），不再让用户选 6/10；图形改柱状/折线切换。 */
  const bucket=10, nBucket=6;
  const dchart=US.drillChart.get(label)||"bar";
  const met=METRICS.find(x=>x.k===metric)||METRICS[0];
  const modeVal=it=>{
    if(mode==="low"||mode==="high") return (it.public_model||"low")===mode;
    return true;
  };
  const val=it=>metric==="credit"?(it.credit||0):metric==="tokens"?(it.tokens||0):1;
  const buckets=Array.from({length:nBucket},()=>0);
  for(const it of items){
    if(!modeVal(it)) continue;
    const mm=new Date(it.at*1000).getMinutes();
    const bi=Math.min(nBucket-1,Math.floor(mm/bucket));
    buckets[bi]+=val(it);
  }
  const peak=Math.max(1,...buckets);
  /* R2.55：峰值前三点（降序前 3 个非零桶）直接标数值，与主图一致。 */
  const topIdx=new Set(buckets.map((v,i)=>({v,i})).filter(x=>x.v>0)
    .sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.i));
  let graphic;
  if(dchart==="line"){
    /* 折线：内联 SVG，点可悬停看具体分桶；峰值三点旁标数值。 */
    const W=600,H=54,PAD=3,N=nBucket-1;
    const pts=buckets.map((v,i)=>({x:PAD+(i/N)*(W-2*PAD),
      y:H-PAD-(v/peak)*(H-2*PAD),v,i}));
    const poly=pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
    const dots=pts.map(p=>p.v?`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}"
      r="${topIdx.has(p.i)?3.2:2.4}" class="dlinepk"><title>${pad2(p.i*bucket)} 分 · ${met.fmt(p.v)}</title></circle>`:"").join("");
    const labels=pts.filter(p=>topIdx.has(p.i)).map(p=>{
      const left=Math.min(92,Math.max(8,p.x/W*100));
      const top=Math.max(2,Math.min(96,p.y/H*100));
      return `<span class="hlinepk" style="left:${left.toFixed(1)}%;top:${top.toFixed(1)}%">${met.fmt(p.v)}</span>`;
    }).join("");
    graphic=`<div class="dline"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${poly}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${dots}</svg>${labels}</div>`;
  }else{
    const bars=buckets.map((v,i)=>{
      const start=i*bucket, end=Math.min(60,start+bucket);
      /* R2.55：非零柱最小 8px，数据少时贴底看不见的问题缓解。 */
      const hgt=v?Math.max(8,Math.round((v/peak)*44)):1;
      /* R2.57：标签挂到柱 <i> 内部（CSS bottom:calc(100%+3px) 贴柱顶），
         不再按 .dbucket 高度定位——后者没算下方时刻标签高度导致重叠。 */
      return `<div class="dbucket" title="${pad2(start)}-${pad2(end)} 分 · ${met.fmt(v)}">
        <i style="height:${hgt}px">${topIdx.has(i)?`<span class="dbpk">${met.fmt(v)}</span>`:""}</i>
        <span class="dtick">${pad2(start)}</span></div>`;
    }).join("");
    graphic=`<div class="dbars">${bars}</div>`;
  }
  const seg=[["bar","柱状"],["line","折线"]].map(([k,n])=>
    `<button type="button" data-drill-chart="${k}" aria-pressed="${dchart===k}">${n}</button>`).join("");
  return `<div class="drill">
    <div class="drillhead"><span>${hour}:00 内分布 · 10 分钟/格 · ${met.n}</span>
      <span class="hseg dbseg">${seg}</span></div>
    ${graphic}</div>`;
}

function hourBody(label,d,hour,isLatest){
  const h=(d.hours||[]).find(x=>x.hour===hour);
  if(!h) return "";
  const key=label+"|"+d.day+"|"+hour;
  const items=US.hourCache.get(key);
  /* R2.23：去掉独立的「最新 / 08:00 明细 / 实时跟踪」标题行。
     「最新」标签改成内联在下面这行文案前（仅默认最新小时显示）。 */
  const latest=isLatest?'<span class="latest-tag">最新</span>':"";
  const head0=`${hour}:00 · ${h.requests} 次请求${
    h.latency?` · 最慢 ${(h.latency/1000).toFixed(1)}s`:""}${
    h.errors?` · ${h.errors} 次失败`:""}`;
  const head=`<div class="hsum">${latest}${head0}</div>`;
  if(items==="loading"||items==null)
    return head+'<div class="uload">读取明细…</div>';
  /* R2.22：进行中的请求也要保留——它是一条真实请求。模型名在路由确定后由后端
     attach_route() 回填；极少数回填前的瞬间/历史旧数据可能为空，用对外模型
     low/high 占位（而不是误导性的 unknown/「未知」）。这里不再整行过滤。 */
  if(!items.length) return head+'<div class="uload">这个时段没有明细</div>';
  /* R2.19：加载更多——默认 10 条，点一次 +10，刷新页面自动重置（US.hourLimit 不持久）。 */
  const limit=US.hourLimit.get(key)||10;
  const shown=items.slice(0,limit);
  /* R2.3：状态不再写文本，改色点（绿=成功/红=失败或取消/橙=进行中）；
     明细补平台角标 WB/QD + 账号掩码，口径与账号页/流向图一致。 */
  const rows=shown.map(it=>{
    const st=it.status||"unknown";
    const badge=platBadge(it.platform);
    const acct=dispLabel(it.account||"");
    /* R2.22：实际模型名为空/未知（回填前的瞬间或历史数据）时，用对外模型
       low/high 占位，绝不显示 unknown/「未知」；正常行照常显示真实模型名。 */
    const model=(it.model && it.model!=="unknown")
      ? it.model : (it.public_model||"");
    return `<div class="hitem" data-st="${esc(st)}"><i class="sdot"></i>
      <span class="t">${hhmm(it.at)}</span>
      <span class="meta">${badge}${acct?`<span class="acct">${esc(acct)}</span>`:""}
        <span class="m">${esc(model||"—")}</span></span>
      <span class="n">${
        /* R2.53：每条明细显示本次实际扣费积分——用户要追踪「哪次任务消耗了
           六七百积分」。actual_credit 为 null（上游没回传）不显示，0（免费）
           也不刷屏，只有真扣费才用醒目色标出。 */
        it.credit!=null&&it.credit>0?`<b class="cost">${creditText(it.credit)} 分</b> · `:""}${
        it.latency_ms?((it.latency_ms/1000).toFixed(1)+"s"):"—"}${
        it.tokens?" · "+tokText(it.tokens)+"":""}</span></div>`;
  }).join("");
  /* R2.24：展开/收起控件挪到底部图例行（和「成功 失败/取消 进行中」同行），
     不再放顶部文案行。点一次 +10，全部展开后显示「收起」回到 10 条。 */
  let expand="";
  if(items.length>10){
    const limit=US.hourLimit.get(key)||10;
    const expanded=limit>=items.length;
    expand=`<button type="button" class="hmore" data-hour-more="${hour}" `
      +`data-total="${items.length}" aria-expanded="${expanded}">${
        expanded?'收起':`已显示 ${Math.min(limit,items.length)} / ${items.length} 条`}`
      /* R2.37：图标方向只由 CSS 的 aria-expanded 旋转控制，这里固定输出 ▼。
         旧写法在 JS 里按展开态切换三角字符，会和 CSS 的 rotate(180deg) 叠加 ——
         展开时字符已翻上、CSS 又转 180° 翻回朝下，文案说「收起」图标却仍朝下。 */
      +`<span class="caret">▼</span></button>`;
  }
  const legend=`<div class="hlegend-st"><span><i style="background:var(--ok)"></i>成功</span>`+
    `<span><i style="background:var(--err)"></i>失败/取消</span>`+
    `<span><i style="background:var(--warn)"></i>进行中</span>${expand}</div>`;
  return head+`<div class="hlist">${rows}</div>${legend}`;
}

/* P48：24 小时图表——维度（请求数/积分/Token）+ 图形（柱状/折线）可切换。
   免费模型 credit=0，积分图可能全空，但 Token 图仍有数据 —— 这正是用户要的：
   「一直用免费模型没积分数据，想看 token 消耗」。
   数据全部来自 usage/day 已返回的 hours[].requests/credit/tokens，无需改后端。 */
/* R2.53：读数/tooltip 格式按用户口径统一——
   · 请求数：整数、不带「次」（用户吐槽「966.4931 次」——那是旧代码把 credit
     浮点总和塞进请求视图；这里 Math.round 兜底，任何浮点都显示成整数）；
   · 积分：两位小数（元角分口径）；
   · Token：tokText 中文数量级（1.3 千万 / 1.2 亿 / 几百万），不甩长串数字。 */
const METRICS=[
  {k:"requests",n:"请求数",fmt:v=>String(Math.round(Number(v)||0))},
  {k:"credit",n:"积分",fmt:v=>v==null?"—":creditText(v)},
  {k:"tokens",n:"Token",fmt:v=>v?tokText(v):"0"},
];
/* R1.1：模式过滤后的取值。mode="all" 用小时总量；low/high 用 by_mode 分量。 */
function hourVal(h,metric,mode){
  if(mode==="low"||mode==="high"){
    const bm=(h.by_mode&&h.by_mode[mode])||{};
    return metric==="credit"?(bm.credit||0):(metric==="tokens"?(bm.tokens||0):(bm.requests||0));
  }
  return metric==="credit"?(h.credit||0):(metric==="tokens"?(h.tokens||0):(h.requests||0));
}
const MODES=[["all","全部"],["low","low"],["high","high"]];

function hoursHTML(label,d){
  const sel=US.hour.get(label)||null;
  const metric=US.metric.get(label)||"requests";
  const chart=US.chart.get(label)||"bar";
  const mode=US.mode.get(label)||"all";
  const hrs=d.hours||[];
  const val=h=>hourVal(h,metric,mode);
  /* R2.0 + R2.53：时间轴收敛到「有数据」的小时，左右空白段都不画。
     - 右边界：今天到当前小时、历史到最后有数据的小时（R2.0 已有）；
     - 左边界（R2.53 新增）：从第一个有数据的小时开始。用户现场「0–13 点没数据
       却全占着，数据在 13–23 点，左侧一大片空白」——现在直接裁掉。
     两端各留 1 小时缓冲，让柱子不贴边、峰值标签有空间；无数据时不裁，保留完整区间。 */
  const dataHours=hrs.filter(h=>hourVal(h,"requests","all")>0).map(h=>+h.hour);
  const firstData=dataHours.length?Math.min(...dataHours):-1;
  const lastDataHour=dataHours.length?Math.max(...dataHours):-1;
  const isToday=d.day===todayKey();
  const nowHour=new Date().getHours();
  let limit=isToday?Math.max(nowHour,lastDataHour):lastDataHour;
  if(limit<0) limit=isToday?nowHour:5;   // 无数据也留个可见区间，别全空
  // 左边界：有数据时从首个数据小时前 1 格开始；至少留到当前小时避免今天只画一两格
  let start=0;
  if(firstData>=0){
    start=Math.max(0,firstData-1);
    // 今天若首个数据在很晚（如 20 点），仍给至少 3 格宽度，别挤成一根
    if(isToday) start=Math.min(start,Math.max(0,nowHour-3));
  }
  const shownHrs=hrs.filter(h=>+h.hour>=start && +h.hour<=limit);
  /* X 轴刻度按实际渲染区间动态取点（首 / ¼ / ½ / ¾ / 末），去重后升序。 */
  const axisTicks=()=>{
    if(!shownHrs.length) return [];
    const first=+shownHrs[0].hour, last=+shownHrs[shownHrs.length-1].hour;
    const span=last-first;
    const cand=[first,Math.round(first+span/4),Math.round(first+span/2),
      Math.round(first+span*3/4),last].filter(n=>n>=first&&n<=last);
    return [...new Set(cand)].sort((a,b)=>a-b);
  };
  /* 真实峰值（可为 0）用于标注；绘图归一用 max(1,...) 避免除零。 */
  const peakVal=Math.max(0,...hrs.map(val));
  const peak=Math.max(1,peakVal);
  /* R2.53：标注数值的点从「仅最高 1 个」扩到「前三」。用户要在手机上直接看到
     第一/第二高各消耗多少，不必一个个点。取按当前指标值降序的前 3 个小时
     （并列也各占一个位置；值为 0 的不标）。 */
  const topHours=new Set([...hrs]
    .filter(h=>val(h)>0)
    .sort((a,b)=>val(b)-val(a))
    .slice(0,3)
    .map(h=>h.hour));
  const total=mode==="all"?(d.requests||0):hrs.reduce((a,h)=>a+val(h),0);
  const met=METRICS.find(m=>m.k===metric)||METRICS[0];
  /* R2.2：顶部读数行是「当前读数」，不是固定峰值——
     默认显示全天合计；点柱/点折线点后跟着显示那一小时的数值（sel 变化时重绘）。
     峰值数值改标在峰值柱顶 / 折线峰值点旁（见下方 hbarpk / hlinepk），
     避免和本行重复——上次两个「277.17 分」糊一起就是把峰值塞进本行导致的。 */
  const sumVal=hrs.reduce((a,h)=>a+val(h),0);
  const selH=sel!=null?hrs.find(h=>h.hour===sel):null;
  const readout=selH
    ? `<div class="hpeak"><b>${esc(sel)}:00</b> · ${met.fmt(val(selH))}</div>`
    : `<div class="hpeak">合计 <b>${met.fmt(sumVal)}</b> · 全天</div>`;

  // 柱状/折线切换已挪到日期控件同一行（dayChips 里），这里只留维度与模式。
  const controls=`<div class="hctl">
    <div class="hseg">${METRICS.map(m=>`<button type="button" data-metric="${m.k}" aria-pressed="${metric===m.k}">${m.n}</button>`).join("")}</div>
    <div class="hseg">${MODES.map(([k,n])=>`<button type="button" data-mode="${k}" aria-pressed="${mode===k}">${n}</button>`).join("")}</div>
  </div>`;

  let graph;
  /* R1.1：全部模式 = low + high 两条线/两段柱；单模式 = 一条/一段。 */
  const showBoth=mode==="all";
  const mval=(h,m)=>hourVal(h,metric,m);
  const bothPeak=Math.max(1,...hrs.flatMap(h=>showBoth?[mval(h,"low"),mval(h,"high")]:[val(h)]));
  if(chart==="line"){
    /* 折线用内联 SVG：宽 600 / 高 54 的 viewBox 自适应，点可点开明细。
       polyline 必须 fill=none（规范），实心点用 circle 单独画。 */
    const W=600,H=54,PAD=3,N=Math.max(1,shownHrs.length-1);
    // R2.2 + R2.53：标数值的点从 1 个扩到前 3 个（跨 low/high 按当前指标）。
    // 收集成 pv[]，画点时判断该点是否在前三，最后统一用 HTML overlay 摆标签。
    const peakDots=[];
    const mkSeries=m=>{
      const pts=shownHrs.map((h,i)=>({
        x:PAD+(i/N)*(W-2*PAD),
        y:H-PAD-(mval(h,m)/bothPeak)*(H-2*PAD), h, m,
      }));
      const poly=pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
      const dots=pts.map(p=>{
        const v=mval(p.h,p.m);
        if(!v) return "";
        // R2.53：前三的小时+档位才画大点并记标签（用 topHours 统一口径）。
        const isPk=topHours.has(p.h.hour) && v>0;
        if(isPk) peakDots.push({x:p.x,y:p.y,v,m});
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isPk?3.2:2.4}" class="m-${p.m}${isPk?" pk":""}"><title>${p.h.hour}:00 · ${p.m} · ${met.fmt(v)}</title></circle>`;
      }).join("");
      const color=m==="low"?"var(--accent)":"var(--purple,#8944AB)";
      return `<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${dots}`;
    };
    const series=showBoth?mkSeries("low")+mkSeries("high"):mkSeries(mode);
    const legend=showBoth?`<div class="hlegend"><span><i style="background:var(--accent)"></i>low</span><span><i style="background:var(--purple,#8944AB)"></i>high</span></div>`:"";
    // 峰值点数值用 HTML overlay 定位（SVG preserveAspectRatio=none 文字会变形）。
    // 前三标签按 x 夹在 8%~92% 防溢出；同一 x（stacked 两档）错开 top 避免重叠。
    const pkLabel=peakDots.map((d,i)=>{
      const left=Math.min(92,Math.max(8,d.x/W*100));
      const top=Math.max(2,Math.min(96,d.y/H*100)) - (i%2?7:0);
      return `<span class="hlinepk" style="left:${left.toFixed(1)}%;top:${top.toFixed(1)}%">${met.fmt(d.v)}</span>`;
    }).join("");
    graph=`<div class="hline"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="24 小时 ${met.n} 折线图">
      ${series}</svg>
      ${pkLabel}
      <div class="hlinehit">${shownHrs.map(h=>`<button type="button" data-hour="${h.hour}" class="${h.errors?"haserr":""}" aria-pressed="${sel===h.hour}" aria-label="${h.hour} 点 ${met.fmt(val(h))}"></button>`).join("")}</div></div>${legend}`;
  }else{
    const bars=shownHrs.map(h=>{
      const v=val(h);
      /* R2.55：非零柱最小 8px（原来 4px）——数据量少、数值小时柱子贴底几乎看不见，
         适当拉高更直观；零值仍 2px 表示无数据，不虚报。 */
      const hgt=v?Math.max(8,Math.round((v/peak)*54)):2;
      const isPeak=topHours.has(h.hour);
      /* 全部模式：一根柱分两段——low 在下（主色），high 在上（紫）。 */
      let inner;
      if(showBoth){
        const lv=mval(h,"low"), hv=mval(h,"high"), tot=lv+hv;
        const lh=tot?Math.round((lv/tot)*hgt):0;
        const hh2=hgt-lh;
        inner=`<i class="seg-low" style="height:${lh}px"></i><i class="seg-high" style="height:${hh2}px"></i>`;
      }else{
        /* R2.3：峰值柱不再常亮「选中态」，只保留柱顶数值标签；
           真正的选中态由 aria-pressed 控制（点哪根亮哪根）。 */
        inner=`<i style="height:${hgt}px"></i>`;
      }
      const tip=showBoth?`${h.hour}:00 · low ${met.fmt(mval(h,"low"))} / high ${met.fmt(mval(h,"high"))}`:`${h.hour}:00 · ${met.fmt(v)}`;
      return `<button type="button" data-hour="${h.hour}" class="${h.errors?"haserr":""} ${showBoth?"stacked":""}"
        aria-pressed="${sel===h.hour}" aria-label="${h.hour} 点 ${met.fmt(v)}"
        title="${tip}">${inner}${
          /* R2.55：标签贴各自柱顶，而不是统一贴在 button 顶部（原来三根柱
             高低不同、标签却挤在同一行）。bottom 用柱高 hgt，按钮是 relative。 */
          isPeak?`<span class="hbarpk" style="bottom:${hgt}px">${met.fmt(v)}</span>`:""}</button>`;
    }).join("");
    const legend=showBoth?`<div class="hlegend"><span><i style="background:var(--accent)"></i>low</span><span><i style="background:var(--purple,#8944AB)"></i>high</span></div>`:"";
    graph=`<div class="hbars">${bars}</div>${legend}`;
  }

  /* R2.53：这一行必须跟当前指标同口径。旧代码无论切到哪个视图都写死「N 次请求」，
     但 total=mode==="all"?d.requests:Σval(h) —— 切到积分时 val 是浮点，于是显示
     「966.4931 次请求」（用户现场）。现在按 metric 显示：请求数整数不带单位、
     积分/token 显示对应量；真实请求数（d.requests）单独给出，不再混淆。 */
  const sumMetric=metric==="requests"?`${Math.round(d.requests||0)} 次请求`
    :metric==="credit"?`消耗 ${met.fmt(sumVal)}`
    :`用量 ${met.fmt(sumVal)}`;
  const sum=`<div class="hsum">${esc(d.day)} · ${sumMetric}${
      d.errors?` · <span style="color:var(--err)">${d.errors} 次失败</span>`:""}${
      metric==="credit"&&d.credit_requests===0?`<br><span class="hwarn">上游今天还没回传过扣费金额，积分图会全空；切到 Token 看实际用量。</span>`:""}</div>`;
  /* R2.19/R2.23：未点选时默认显示「最新有数据小时」的明细，而不是「点图看…」
     提示——用户要一进页面就看到实时数据。点柱/点后再切到那一小时；未点选时
     refreshAccountData 每轮刷新都跟随最新小时（默认实时跟踪，无需开关）。 */
  const withData=shownHrs.filter(h=>hourVal(h,"requests","all")>0);
  const latestHour=withData.length?withData[withData.length-1].hour:null;
  const shownHour=sel!=null?sel:latestHour;
  /* R2.23：删掉「最新 / 08:00 明细 / 实时跟踪」独立标题行——默认就是实时跟踪，
     按钮多余；「最新」标签内联到明细文案行（sel==null 即默认最新时显示）。 */
  /* R2.53：二次点同一柱进入下钻——在明细上方插入分钟分桶分布图。 */
  const drilled=US.drill.get(label)&&sel!=null;
  const hourPanel=shownHour!=null
    ? (drilled?drillHTML(label,d,shownHour,metric,mode):"")
      + hourBody(label,d,shownHour,sel==null&&!drilled)
    : '<div class="uload">点图看那一小时的明细</div>';
  const body=total
    ? `${controls}${readout}${graph}<div class="hx">${axisTicks().map(t=>`<span>${t}</span>`).join("")}</div>${sum}
       ${gapNote(label,d)}
       ${hourPanel}
       <div class="sub2">模型分布</div>${modelRows(d,mode,metric)}`
    : `${controls}<div class="uload">这天没有网关请求。<br>官方客户端的消耗只计在「今日消耗」里。</div>`;
  return dayChips(label)+body;
}

async function loadHour(label,day,hour){
  const key=label+"|"+day+"|"+hour;
  if(US.hourCache.has(key)) return;
  US.hourCache.set(key,"loading");
  try{
    const r=await getJSON(`usage/hour?label=${encodeURIComponent(label)}&date=${day}&hour=${hour}`);
    US.hourCache.set(key,r.items||[]);
  }catch(e){ US.hourCache.set(key,[]); }
}

async function paintHours(label){
  const host=document.getElementById("uh-"+sid(label));
  if(!host) return;
  const day=US.day.get(label)||todayKey();
  const key=label+"|"+day;
  let d=US.cache.get(key);
  if(!d){
    host.innerHTML=dayChips(label)+'<div class="uload">加载中…</div>';
    try{
      d=await getJSON(`usage/day?label=${encodeURIComponent(label)}&date=${day}`);
      US.cache.set(key,d);
    }catch(e){
      host.innerHTML=dayChips(label)+'<div class="uload">读取失败：'+esc(e.message)+'</div>';
      return;
    }
  }
  // R2.19：未手动选中时也要预拉「最新有数据小时」的明细，
  // 否则默认视图会一直卡在「读取明细…」。实时跟踪开启同理。
  if(US.hour.get(label)==null){
    const lh=latestDataHour(d,day);
    if(lh!=null) await loadHour(label,day,lh);
  }
  const now=document.getElementById("uh-"+sid(label));
  if(!now) return;
  patchDOM(now,hoursHTML(label,d));
  bindUsage(now,label,day);
}

/* R2.19：某天「最新有数据小时」。今天按已发生小时收敛，历史按最后有数据的小时。
   与 hoursHTML 里 shownHrs 的口径一致（isToday→nowHour, 否则 lastDataHour）。 */
function latestDataHour(d,day){
  const hrs=d.hours||[];
  const lastData=hrs.reduce((mx,h)=>(h.requests||0)>0?Math.max(mx,+h.hour):mx,-1);
  const isToday=day===todayKey();
  let limit=isToday?Math.max(new Date().getHours(),lastData):lastData;
  if(limit<0) return null;
  const cand=hrs.filter(h=>+h.hour<=limit && (h.requests||0)>0);
  return cand.length?String(cand[cand.length-1].hour):null;
}

/* R2.7 实时刷新：先在后台把数据取到缓存（失败则保留旧数据、绝不动 DOM），
   全部就绪后再一次性重绘——这样刷新瞬间不会出现「清空成加载中」的空白帧。
   用户点开的小时明细也要同步重拉，否则清了 hourCache 后会一直卡在「读取明细…」。 */
async function refreshAccountData(label){
  const day=US.day.get(label)||todayKey();
  const key=label+"|"+day;
  try{
    const d=await getJSON("usage/day?label="+encodeURIComponent(label)+"&date="+day);
    US.cache.set(key,d);
  }catch(e){ return false; }        // 取数失败：保留旧缓存与旧 DOM，下次刷新再试
  let hr=US.hour.get(label);
  /* R2.23：默认就是实时跟踪——未手动选中时每次刷新都跟随最新有数据小时。
     只有用户点了某根柱子（US.hour 有值）才锁定那一小时。 */
  if(hr==null) hr=latestDataHour(US.cache.get(label+"|"+day),day);
  if(hr!=null){
    const hkey=label+"|"+day+"|"+hr;
    US.hourCache.delete(hkey);
    await loadHour(label,day,hr);
  }
  return true;
}
function repaintHours(label){
  const host=document.getElementById("uh-"+sid(label));
  if(!host) return;                // 期间被收起/重绘了
  const day=US.day.get(label)||todayKey();
  const d=US.cache.get(label+"|"+day);
  if(!d) return;
  const st=host.querySelector(".scroll-list"); const top=st?st.scrollTop:0;
  patchDOM(host,hoursHTML(label,d));
  const st2=host.querySelector(".scroll-list"); if(st2) st2.scrollTop=top;
  bindUsage(host,label,day);
}

function bindUsage(host,label,day){
  host.onclick=async e=>{
    const step=e.target.closest("[data-day-step]");
    if(step){
      const t=todayKey(), next=shiftKey(US.day.get(label)||t,+step.dataset.dayStep);
      if(next>t || next<shiftKey(t,-90)) return;   // 不允许未来 / 早于 90 天
      US.day.set(label,next); US.hour.delete(label); US.drill.delete(label); paintHours(label); return;
    }
    const dp=e.target.closest("[data-day-pick]");
    if(dp){
      const picked=await datePicker(US.day.get(label)||todayKey());
      if(picked && picked!==US.day.get(label)){
        US.day.set(label,picked); US.hour.delete(label); US.drill.delete(label); paintHours(label);
      }
      return;
    }
    const mb=e.target.closest("[data-metric]");
    if(mb){ US.metric.set(label,mb.dataset.metric); paintHours(label); return; }
    const cb=e.target.closest("[data-chart]");
    if(cb){ US.chart.set(label,cb.dataset.chart); paintHours(label); return; }
    const mob=e.target.closest("[data-mode]");
    if(mob){ US.mode.set(label,mob.dataset.mode); paintHours(label); return; }
    const hb=e.target.closest("[data-hour]");
    if(hb){
      const hour=hb.dataset.hour;
      /* R2.53：第一次点选中小时并联动明细；第二次点同一柱进入分钟分布下钻；
         第三次点同一柱收起回默认实时视图。切到别的柱重置下钻态。 */
      if(US.hour.get(label)===hour){
        if(!US.drill.get(label)){ US.drill.set(label,true); }   // 第二击：下钻
        else { US.hour.delete(label); US.drill.delete(label); } // 第三击：收起
      }else{
        US.hour.set(label,hour); US.drill.delete(label);
        await loadHour(label,day,hour);
      }
      paintHours(label);
      return;
    }
    /* R2.55：下钻区图形切换（柱状/折线）；固定 10 分钟，不再有 6/10 与收起按钮。 */
    const dc=e.target.closest("[data-drill-chart]");
    if(dc){ US.drillChart.set(label,dc.dataset.drillChart); paintHours(label); return; }
    const more=e.target.closest("[data-hour-more]");
    if(more){
      const hour=more.dataset.hourMore;
      const k=label+"|"+day+"|"+hour;
      const cur=US.hourLimit.get(k)||10;
      // R2.23：展开/收起循环——10 → 20 → … → 全部 → 收起回 10。
      US.hourLimit.set(k, cur>=(more.dataset.total?+more.dataset.total:1e9) ? 10 : cur+10);
      paintHours(label);
      return;
    }
  };
}

/* P41：内部唯一键带平台前缀（qoder:<掩码>），显示时去掉——
   左侧平台标签已经能区分，页面上再带前缀反而看不懂。 */
/* 显示名映射：底层 label（凭据文件名/DB 唯一键/快照 key）保持不变，
   只在展示层把 CLI username 换回旧日报里的手机号掩码，和签到系统
   /opt/qoder-signin/daily_report.py 的 DISPLAY_NAME 同一套值。
   账号 tab / 切换历史 / 请求列表都走这个函数，口径统一。 */
/* R1.2：账号显示名唯一口径 —— 与 gateway/display.py 的 DISPLAY_ALIAS 保持同一张表。
   内部昵称必须显示手机号掩码，不能露出内部标签。
   改这里必须同步 gateway/display.py（README §14 有约定）。 */
/* 脱敏：开源版不硬编码任何真实账号掩码/昵称，留空表；
   手机号由下方正则自动掩码，昵称映射可通过后端 GATEWAY_DISPLAY_ALIAS 配置。 */
const DISP_ALIAS={};
function dispLabel(l){
  const s=String(l||"").replace(/^qoder:/,"");
  if(DISP_ALIAS[s]) return DISP_ALIAS[s];
  // 11 位手机号自动掩码（新增账号零登记）
  if(/^1\d{10}$/.test(s)) return s.slice(0,3)+"****"+s.slice(-4);
  return s;
}
/* R2.46：凭据**文件名**的 stem 也是内部 label（<昵称>.info / <昵称>.qoder.json）。
   账号行标题早过了 dispLabel，但展开区「凭据→文件」直接显示 filename，
   把内部 label 原样漏了出来——这是全项目最后一处可见的内部昵称。
   只映射第一个点之前的主干，扩展名（.info / .qoder.json）原样保留。 */
function dispFile(name){
  const s=String(name||"");
  const i=s.indexOf(".");
  return i<0 ? dispLabel(s) : dispLabel(s.slice(0,i))+s.slice(i);
}
/* 平台角标：账号 tab / 调度切换 / 请求列表共用同一实现，保证颜色一致。
   R1 Q5：显示缩写（WorkBuddy→WB / Qoder→QD），title 保留全称（hover 可见）。
   平台是品牌标识，颜色固定不随主题变（见 .ptag CSS 的 data-plat 选择器）。 */
const PLAT_SHORT={workbuddy:"WB",qoder:"QD",mock:"模拟"};
const PLAT_FULL={workbuddy:"WorkBuddy",qoder:"Qoder",mock:"本地模拟"};
function platBadge(platform,label){
  const p=(platform||"").toLowerCase()||"unknown";
  const full=label||PLAT_FULL[p]||platform||"未知";
  const short=PLAT_SHORT[p]||full;
  return `<span class="ptag" data-plat="${esc(p)}" title="${esc(full)}">${esc(short)}</span>`;
}

/* R1.1：哪些账号当前有可用免费模型 —— 从 /free-forecast 拿 free_accounts，
   在账号行标题后加 FREE 角标。
   R2.47：force=true 时强制重拉。以前无条件命中缓存（if(US.health) return），
   导致 5 秒实时刷新永远拿到第一次的快照——扫码加了新账号后免费池仍显示「1 个可用」，
   要手动刷新页面才更新。实时刷新路径必须强制拉新数据。 */
async function loadForecast(force){
  if(US.health && !force) return US.health;
  try{ US.health=await getJSON("free-forecast"); }
  catch(e){ if(!US.health) US.health={health:{free_accounts:{}}}; }
  return US.health;
}
function paintFreeBadges(){
  const fa=((US.health||{}).health||{}).free_accounts||{};
  document.querySelectorAll(".row[data-acc]").forEach(row=>{
    const label=row.dataset.acc;
    const title=row.querySelector(".rtitle");
    if(!title) return;
    title.querySelectorAll(".freebadge").forEach(el=>el.remove());
    const models=fa[label];
    if(models&&models.length){
      const badge=document.createElement("span");
      badge.className="freebadge";
      badge.textContent="FREE";
      badge.title="当前可用免费模型："+models.join("、");
      title.appendChild(badge);
    }
  });
  // 异步回来后再补一次（首次进入时 forecast 可能还没加载）
  if(!US.health) loadForecast().then(paintFreeBadges);
}

function accountRow(x){
  const open=ACC.open.has(x.label);
  x.disp=dispLabel(x.label);
  const c=x.credits||{}, u=x.usage||{}, bt=u.bill_today||{};
  // 24 小时块是异步渲染的（paintHours 拿不到这里的闭包），账单口径先存进 US.bill，
  // 「两个口径差在哪」那块才能拿到同一个数。
  if(bt&&bt.delta!=null) US.bill.set(x.label,bt); else US.bill.delete(x.label);
  const used=c.used, cap=c.capacity, ratio=c.ratio;
  // Qoder 的授权状态（P44）：能不能推理取决于官方 CLI 的本地登录态在不在，
  // 不取决于凭据文件在不在——这是两件分开的事，页面上要分开说。
  const isQ=x.platform==="qoder", q=x.qoder||{};
  // R2.18：账号行副标题只讲「累计已用」，和右侧余额同一口径——
  //   累计已用 + 余额 = 总额，一眼对得上（1.8 + 1998.2 = 2000）。
  // 之前这里放「账单 −N」(今日 delta) 是错的：跨零点就归零，跟余额的累计口径天生对不上，
  // 才闹出「账单 −0 却少了 1.8」的困惑。今日消耗挪到展开区（那里本来就有大字读数）。
  const head=[
    (used!=null) ? `已用 ${creditText(used)}` : null,
  ].filter(Boolean).join(" · ");
  // R2.1：只有真正不参与调度的账号才标注（Qoder 未授权）。
  // 余额 0 不算——官方免费模型不消耗付费积分，余额 0 照样能用（服务器实调验证），
  // 所以 WorkBuddy 余额 0 的账号仍参与调度，不在这里标「不参与」。
  const noRoute = x.in_routing===false;
  const routeNote = noRoute && isQ ? "未授权 · 不参与调度" : "";
  let sub = head || (isQ
      // 小字不再重复账号名（标题已经显示了）——之前是「已授权 · <掩码>」，
      // 同一行出现两次名字，把真正有用的信息挤到右边去了。
      ? (q.authorized ? "已授权" : "未授权 · 点右侧「授权」")
      : (x.balance!=null ? "余额已读取" : "余额暂不可用"));
  if(routeNote) sub = sub ? `${sub} · ${routeNote}` : routeNote;
  // R2.42：红色「重新授权」只认后端 renew.needs_reauth（续期失败/凭据已过期）。
  // 不能再用 balance==null 推断「需重新授权」——账单接口 401 与签到接口鉴权口径不同，
  // 实测有账号账单读不到但签到照样领 100 积分（token 有效），标红是误报。
  // 账单读不到只显示中性「余额暂不可用」，不弹告警按钮。
  // R2.44：但「上游明确回 401」是另一回事——实测这种 token 连聊天接口一起 401，
  // 只能重新扫码。后端把 401 单独走 auth_error / auth_status="expired" 传上来，
  // 这里据此显示红色「重新授权」；429/超时/5xx 仍然只算「余额暂不可用」。
  const rn=x.renew||{};
  const authDead = x.auth_status==="expired"
    || /401|凭据已失效/.test(String(x.auth_error||""));
  const needsReauth = !!rn.needs_reauth || authDead;
  const reauthHint = authDead ? "凭据已失效（上游 401）· 需重新扫码授权"
    : rn.fail_streak>=2 ? "凭据续期失败 · 需重新授权"
    : (rn.days_left!=null && rn.days_left<=0) ? "凭据已过期 · 需重新授权" : "";
  // R2.44：凭据被作废要在行内小字就说清楚；只说「余额暂不可用」用户根本不知道该干嘛。
  if(authDead) sub = "凭据已失效 · 点右侧「重新授权」";
  const right = x.balance!=null
    ? `<span class="bal">${creditText(x.balance)}<i>积分</i></span>`
    : pill("余额未知","warn");
  // Qoder 行的授权入口：未授权时是主操作，已授权时变成次要的「检查」。
  let qbtn = isQ
    ? (q.authorized
        ? `<button type="button" class="qbtn" data-qcheck="${esc(x.label)}">检查</button>`
        : `<button type="button" class="qbtn pri" data-qauth="${esc(x.label)}">授权</button>`)
    : "";
  // 需要重新授权时，红色按钮覆盖/追加到行尾（Qoder 已有授权按钮就不再重复，
  // 直接把它升级成红色主操作；WorkBuddy 则新增一个）。
  if(needsReauth){
    qbtn = `<button type="button" class="qbtn danger" data-reauth="${esc(x.label)}" `
      + `title="${esc(reauthHint)}">重新授权</button>`;
  }
  const groups=(c.groups||[]).filter(g=>g.capacity>0||g.remain>0).map(g=>
    `<div class="kv"><span>${esc(g.label)}</span><b>${creditText(g.remain)} / ${creditText(g.capacity)}</b></div>`
  ).join("");
  const delta=bt.delta;
  // Qoder 展开后的授权区块（P44）
  const qdetail = isQ ? `
      <div class="sub2">Qoder 授权</div>
      <div class="kv"><span>状态</span><b>${q.authorized?"已授权":"未授权"}</b></div>
      <div class="kv"><span>账号</span><b>${esc(q.username||"—")}</b></div>
      ${q.reason?`<div class="kv"><span>说明</span><b>${esc(q.reason)}</b></div>`:""}
      <div class="kv"><span>登录态</span><b>${esc(q.auth_state||"—")}</b></div>
      <button type="button" class="btn ${q.authorized?"secondary":""}" data-qauth="${esc(x.label)}"
        style="margin-top:10px">${q.authorized?"重新授权":"授权"}</button>
      <button type="button" class="btn secondary" data-qcheck="${esc(x.label)}"
        style="margin-top:8px">检查授权并刷新余额</button>` : "";
  const detail=`
    <div class="detail">
      <div class="sub2" style="margin-top:0">今日消耗</div>
      <div class="ustat">
        <div class="u1"><b class="${delta>0?"":"zero"}">${
          delta!=null ? (delta>0?"−":"")+creditText(delta) : "—"}</b><em>积分</em></div>
        <div class="u2">${esc(todayNote(bt))}</div>
      </div>
      <div class="sub2">24 小时 · 网关请求</div>
      <div id="uh-${sid(x.label)}"><div class="uload">加载中…</div></div>
      <div class="sub2">账单</div>
      <div class="bar" aria-label="已用比例"><i style="width:${Math.min(100,Math.max(0,(ratio||0)*100)).toFixed(1)}%"></i></div>
      <div class="barx"><span>已用 ${creditText(used)}</span><span>总量 ${creditText(cap)}</span></div>
      <div class="kv"><span>剩余</span><b>${creditText(x.balance)} 积分${c.plan?" · "+esc(c.plan):""}</b></div>
      ${groups}
      ${qdetail}
      <div class="sub2">凭据</div>
      <div class="kv"><span>有效期</span><b>${esc(daysLeftText((x.credential||{}).expires_at))}</b></div>
      <div class="kv"><span>文件</span><b>${esc(dispFile((x.credential||{}).file||"—"))}</b></div>
      ${x.active?"":(x.inference===false?"":`<button class="btn secondary" data-switch="${esc(x.label)}" style="margin-top:10px">锁定此账号</button>`)}
      <button class="btn secondary danger" data-remove="${esc(x.label)}" data-platform="${esc(x.platform||"workbuddy")}" style="margin-top:10px">从网关剔除此账号</button>
    </div>`;
  return `<div class="row tap${x.active?" active":""}" data-acc="${esc(x.label)}">
    <div class="rmain">
      <div class="rtitle">${platBadge(x.platform,x.platform_label||x.platform)}${esc(x.disp||dispLabel(x.label))}</div>
      <div class="rsub">${needsReauth?`<span class="reauth-hint">${esc(reauthHint)}</span>`:""}${esc(sub)}</div>
    </div>
    <div class="rright">${right}${qbtn}${x.active?'<span class="tick">✓</span>':""}
      <span class="cv${open?" open":""}">▶</span></div>
  </div>${open?detail:""}`;
}

function addAccountCard(){
  return `<div class="group"><div class="card">
    <div class="row tap" id="addacc">
      <div class="rmain"><div class="rtitle">添加账号</div>
        <div class="rsub">扫码或粘贴 .info</div></div>
      <div class="rright"><span class="plus">＋</span></div>
    </div>
  </div></div>`;
}

function renderAccounts(d){
  const body=document.getElementById("body");
  ACC.items=(d&&d.items)||[];
  // P43：重绘（展开/折叠）时只传了 items，platforms 会丢 → 「平台」区块整块消失。
  // 把上次拿到的 platforms 留在 ACC 里，重绘时继续用。
  if(d&&d.platforms) ACC.platforms=d.platforms;
  const plats=ACC.platforms||[];
  if(!ACC.items.length){
    body.innerHTML='<div class="empty">还没有账号</div>'+addAccountCard();
    bindAccountActions(); return;
  }
  // 按剩余积分降序（用户要求）；余额未知的沉底，但保留在列表里
  ACC.items=[...ACC.items].sort((a,b)=>{
    const av=a.balance==null?-Infinity:a.balance, bv=b.balance==null?-Infinity:b.balance;
    return bv-av;
  });
  let h="";
  // R2.39：账号被手动锁定（点过「锁定此账号」）时，给一个显眼的恢复入口。
  // 以前只有锁定没有解锁入口，用户切完就回不到自动调度了。
  const locked=ACC.items.find(x=>x.active);
  if(locked){
    h+=`<div class="group"><div class="card" style="padding:12px 14px">
      <div class="row" style="min-height:0">
        <div class="rmain"><div class="rtitle">已锁定到 ${esc(dispLabel(locked.label))}</div>
          <div class="rsub">后续模型请求只走这一个账号。</div></div>
        <div class="rright"><button type="button" class="qbtn" id="resetAccountLock">恢复自动调度</button></div>
      </div></div></div>`;
  }
  if(plats.length){
    // 平台区块默认收起：只在需要核对各平台账号分布时展开，避免占掉首屏。
    h+=`<div class="group"><div class="ghead">平台
      <button type="button" class="gcaret" id="platCaret" aria-expanded="${ACC.platOpen?"true":"false"}" aria-label="${ACC.platOpen?"收起":"展开"}平台">${SVG_CHEVRON_R}</button>
      </div><div class="card" id="platCard"${ACC.platOpen?"":" hidden"}>`
      + plats.map(p=>`<div class="row"><div class="rmain"><div class="rtitle">
        ${platBadge(p.platform,p.label)}${p.count} 个账号</div>
        <div class="rsub">${p.routing>0
          ? `${p.routing} 个可参与调度${p.active?" · 有当前账号":""}`
          : "未参与调度（需要先授权）"}</div></div>
        <div class="rright">${p.routing>0?pill(p.routing+" 个可用","ok"):pill("未参与","plain")}</div></div>`).join("")
      + '</div></div>';
  }
  // R1.1：全账号汇总图表（low/high 叠加 + 维度/图形/模式切换）
  // R1.6：汇总卡片内部加 padding——之前内容（日期/维度按钮、图表、模型分布）
  // 紧贴 card 圆角边框，手机上像贴屏幕。单账号展开区有自己的 padding，不受影响。
  h+='<div class="group"><div class="ghead">用量汇总</div>'
    +`<div class="card uh-summary-card"><div id="uh-${sid("__all__")}"><div class="uload">加载中…</div></div></div></div>`;
  h+='<div class="group"><div class="ghead">账号</div>';
  h+='<div class="card">'+ACC.items.map(accountRow).join("")+'</div></div>';
  h+=addAccountCard();
  h+='<div class="note">今日消耗含官方客户端；24 小时仅本网关；余额不跨平台相加。</div>';
  body.innerHTML=h;
  bindAccountActions();
  // 展开状态在重绘后要恢复：24 小时数据是异步拉的，单独填充到已经渲染好的容器里
  for(const lb of ACC.open) paintHours(lb);
  // R1.1：全账号汇总图表（独立于展开状态，每次进入账号页都加载）
  paintHours("__all__");
  // R1.1：账号行 FREE 角标（哪些账号当前有可用免费模型）
  paintFreeBadges();
}

function bindAccountActions(){
  // 平台区块展开/收起：只切 DOM（hidden + aria），不重绘整页，避免跳动。
  const pc=document.getElementById("platCaret");
  if(pc) pc.addEventListener("click",()=>{
    ACC.platOpen=!ACC.platOpen;
    pc.setAttribute("aria-expanded",ACC.platOpen?"true":"false");
    pc.setAttribute("aria-label",ACC.platOpen?"收起平台":"展开平台");
    const card=document.getElementById("platCard");
    if(card) card.hidden=!ACC.platOpen;
  });
  document.querySelectorAll("[data-acc]").forEach(el=>el.addEventListener("click",e=>{
    // 行内的操作按钮自己处理，不要顺带把行展开/折叠
    if(e.target.closest("[data-switch],[data-qauth],[data-qcheck],[data-reauth]")) return;
    const label=el.dataset.acc;
    if(ACC.open.has(label)) ACC.open.delete(label); else ACC.open.add(label);
    renderAccounts({items:ACC.items});
  }));
  document.querySelectorAll("[data-switch]").forEach(btn=>btn.addEventListener("click",async e=>{
    e.stopPropagation();
    const label=btn.dataset.switch;
    const ok=await dialog({
      title:"锁定这个账号？",
      message:"锁定后所有模型请求都只走这个账号，不再自动轮转。系统会先检查这个账号能否正常使用，不可用则不会锁定。",
      rows:[["账号",dispLabel(label)]],
      confirmText:"锁定",
    });
    if(!ok) return;
    try{
      await postJSON("account",{account:label});
      toast("已锁定到 "+dispLabel(label));
      await refreshChip();
      // R2.39：账号锁会影响「当前选中预览」，切完立即重拉 models 数据，
      // 让用户去模型 tab 时能看到切换后的账号，不用等 5 秒自动刷新。
      try{
        const md=await getJSON("models");
        if(md){ M.items=md.items||[]; M.activeAcc=md.active_account||null;
          M.active=M.items.find(x=>x.active)||null; }
      }catch{}
      ACC.items=ACC.items.map(i=>({...i,active:i.label===label}));
      renderAccounts({items:ACC.items});
    }catch(err){ toast("锁定失败："+err.message); }
  }));
  const add=document.getElementById("addacc");
  if(add) add.addEventListener("click",()=>importDialog());
  /* R2.39：恢复自动调度（清除账号锁 account=null） */
  const resetLock=document.getElementById("resetAccountLock");
  if(resetLock) resetLock.addEventListener("click",async()=>{
    resetLock.disabled=true;
    try{
      await postJSON("account",{account:null});
      toast("已恢复自动调度");
      await refreshChip();
      const md=await getJSON("models");
      if(md){ M.items=md.items||[]; M.activeAcc=md.active_account||null;
        M.active=M.items.find(x=>x.active)||null; }
      await load("accounts");
    }catch(err){ toast("恢复失败："+err.message); resetLock.disabled=false; }
  });
  /* ---- Qoder 授权（P44）----
     行内「授权」= 起一次设备码登录（弹二维码）；「检查」= 只查状态 + 刷余额。 */
  document.querySelectorAll("[data-qauth]").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();
    qoderAuthDialog(btn.dataset.qauth);
  }));
  /* R2.39：凭据续期失败/过期的红色「重新授权」按钮。
     WorkBuddy → 复用扫码弹窗重新登录（同 uid 覆盖凭据 + 清告警）；
     Qoder → 复用设备码 reauth 流程（核对 uid 一致 + 覆盖凭据）。 */
  document.querySelectorAll("[data-reauth]").forEach(btn=>btn.addEventListener("click",async e=>{
    e.stopPropagation();
    const label=btn.dataset.reauth;
    const item=ACC.items.find(i=>i.label===label)||{};
    const plat=item.platform||"workbuddy";
    const ok=await dialog({
      title:"重新授权",
      rows:[["账号",label],["原因",(item.renew&&item.renew.fail_streak>=2)?"凭据续期失败":"凭据已过期"],
            ["操作","重新扫码登录同一个账号，更新登录状态"]],
      confirmText:"去重新授权",
    });
    if(!ok) return;
    if(plat==="qoder") qoderAuthDialog(label);
    else importDialog({reauth:true});
  }));
  document.querySelectorAll("[data-qcheck]").forEach(btn=>btn.addEventListener("click",async e=>{
    e.stopPropagation();
    const label=btn.dataset.qcheck;
    const old=btn.textContent;
    btn.disabled=true; btn.textContent="检查中…";
    try{
      const r=await postJSON("qoder/probe?label="+encodeURIComponent(label),{});
      const p=r.probe||{};
      toast(p.authorized
        ? `授权正常（${p.username||label}）${p.balance!=null?" · 余额 "+p.balance:""}`
        : "还没授权："+(p.auth_reason||"登录态无效"));
      await load("accounts");
    }catch(err){
      toast("检查失败："+err.message);
      btn.disabled=false; btn.textContent=old;
    }
  }));
  /* R2.41：从网关彻底剔除账号（删凭据文件 + 登记 + 告警），不可撤销，二次确认。 */
  document.querySelectorAll("[data-remove]").forEach(btn=>btn.addEventListener("click",async e=>{
    e.stopPropagation();
    const label=btn.dataset.remove, plat=btn.dataset.platform||"workbuddy";
    const ok=await dialog({title:"从网关剔除账号？",danger:true,confirmText:"确认剔除",
      rows:[["账号",dispLabel(label)],["说明","删除凭据文件与登记，该账号立即停用且不可恢复"]]});
    if(!ok) return;
    const old=btn.textContent; btn.disabled=true; btn.textContent="剔除中…";
    try{
      const r=await postJSON("accounts/remove",{label,platform:plat});
      toast("已剔除 "+dispLabel(label)+(r.removed_files&&r.removed_files.length?("（"+r.removed_files.join("、")+"）"):""));
      await load("accounts");
    }catch(err){ toast("剔除失败："+err.message); btn.disabled=false; btn.textContent=old; }
  }));
}

/* 添加账号弹窗：默认「扫码登录」，第二个 tab 才是粘贴 .info。
   用户原话：「为啥我点击添加按钮只有一个输入框」——扫码本来就是官方唯一入口
   （CLI 登录链接 + 轮询拿凭据），只是之前没做成页面。 */
function importDialog(opts){
  const ov=document.getElementById("overlay");
  const box=document.getElementById("alert");
  // R2.39：账号行「重新授权」入口复用本弹窗——重新扫同一个号即可刷新登录态。
  const reauth=!!(opts&&opts.reauth);
  box.classList.add("wide");
  box.innerHTML=`
    <div class="head"><h2>${reauth?"重新授权":"添加账号"}</h2>
      ${reauth?'<div class="msg">请重新扫码登录<b>同一个账号</b>，完成后会更新它的登录状态并清除告警。</div>':""}</div>
    <div class="plattabs" role="tablist" id="platTabs">
      <button role="tab" aria-selected="true" data-plat="wb">WorkBuddy</button>
      <button role="tab" aria-selected="false" data-plat="qoder">Qoder</button>
    </div>
    <div id="paneWb">
    <div class="platinfo">
      <div class="pi-row"><span class="pi-k">接入</span><span>微信扫码登录 + 手机号验证，网关自动读取官方 CLI 凭据入库。到期前可自动续期，无需重扫。</span></div>
      <div class="pi-row" style="margin-top:5px"><span class="pi-k">额度</span><span>扫码接入后<b>自带积分</b>（新号通常 <span class="pi-hot">2000</span>，部分 <span class="pi-hot">500</span>），直接可用于付费模型；免费模型另按请求长度免扣、不花积分。<b class="pi-ok">不用像 Qoder 那样换设备领试用</b>——这是两个平台最大的区别。</span></div>
    </div>
    <div class="imptabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="qr">扫码登录</button>
      <button role="tab" aria-selected="false" data-tab="paste">粘贴 .info</button>
    </div>
    <div id="paneQr">
      <div class="qrbox" id="qrBox"><div class="uload">正在向平台申请登录二维码…</div></div>
      <div class="err" id="qrErr" style="padding:0 16px 12px"></div>
    </div>
    <div id="panePaste" hidden>
      <div class="imp">
        <textarea id="impText" placeholder='粘贴 .info 内容（以 {"account": 开头）' spellcheck="false"></textarea>
        <div class="improw">
          <label class="filebtn">选择 .info 文件<input id="impFile" type="file" accept=".info,.json,application/json" hidden></label>
          <span id="impName" class="impname"></span>
        </div>
        <div id="impErr" class="err"></div>
      </div>
      <div class="acts" style="border-top:0;padding-top:0">
        <button type="button" data-act="ok" class="primary">校验并添加</button>
      </div>
    </div>
    <div class="acts" id="qrActs">
      <button type="button" data-act="cancel">取消</button>
    </div>
    </div>

    <div id="paneQoder" hidden>
      <div class="platinfo">
        <div class="pi-row"><span class="pi-k">接入</span><span>微信扫码 + 页面确认授权，网关自动建登录态、凭据、入库，扫完即可推理，不用再回账号页点「授权」。</span></div>
        <div class="pi-row" style="margin-top:5px"><span class="pi-k">额度</span><span><b class="pi-warn">和 WorkBuddy 不同</b>：扫码后新号通常是 <b><span class="pi-hot">0 积分</span> / personal_standard</b>，因为<b>该账号尚未激活官方 Pro 试用</b>——需账号本人在<b>另一台设备</b>的 Qoder 客户端（IDE/CLI，非虚拟机）首次登录领取 <span class="pi-hot">300 Credits</span>，再来这里点账号行的「检查」刷新余额；同一设备/身份试用仅发一次。<b>扫码成功只代表接入成功，不代表有额度。</b></span></div>
      </div>
      <div class="qrbox" id="qBox"><div class="uload">正在向 Qoder 申请登录二维码…</div></div>
      <div class="err" id="qErr" style="padding:0 16px 12px"></div>
      <div class="acts">
        <button type="button" data-act="cancelQ">关闭</button>
      </div>
    </div>`;

  let timer=null, stopped=false, plat="wb";
  let qTimer=null, qKey=null, qDrawn=null, qStarted=false;
  const kill=async()=>{ try{ await postJSON("accounts/qr/cancel",{}); }catch(e){} };
  const stopPoll=()=>{ clearInterval(timer); timer=null; };
  const startPoll=()=>{ stopPoll(); if(!stopped) timer=setInterval(poll,1500); };
  const stopQPoll=()=>{ clearInterval(qTimer); qTimer=null; };
  const close=async ()=>{
    stopped=true; stopPoll(); stopQPoll();
    ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
    await kill();
    if(qKey){ try{ await postJSON("qoder/authorize/cancel?key="+encodeURIComponent(qKey),{}); }catch(e){} }
  };
  const qrBox=()=>document.getElementById("qrBox");
  const qrErr=()=>document.getElementById("qrErr");
  const qBox=()=>document.getElementById("qBox");
  const qErr=()=>document.getElementById("qErr");

  /* 收起时把服务端的 pty 一起收掉，别留一个等登录的进程 */
  box.querySelector('[data-act="cancel"]').onclick=close;
  box.querySelector('[data-act="cancelQ"]').onclick=close;

  /* ---------- 平台切换 ---------- */
  /* WorkBuddy 和 Qoder 的二维码**不是一回事**（用户原话：「你是把二维码搞混了吗」）：
     WorkBuddy 扫的是 CLI 登录链接（扫完导出 .info），
     Qoder 扫的是设备码链接（扫完后端直接拿到 dt- 并落库）。
     所以平台是**独立的一层**，不能塞进同一个 tab 组。 */
  function switchPlat(p){
    plat=p;
    box.querySelectorAll("#platTabs [data-plat]").forEach(x=>
      x.setAttribute("aria-selected",String(x.dataset.plat===p)));
    document.getElementById("paneWb").hidden=(p!=="wb");
    document.getElementById("paneQoder").hidden=(p!=="qoder");
    if(p==="wb"){
      // 切走了就把 Qoder 那边的登录进程收掉：每个 CLI 常驻 ~250MB，
      // 服务器总共才 1.87GB，两个平台同时挂着会把内存吃穿。
      stopQPoll();
      if(qKey){ try{ postJSON("qoder/authorize/cancel?key="+encodeURIComponent(qKey),{}); }catch(e){} qKey=null; }
      resume();
    }else{
      // 同理：WorkBuddy 的 pty 也没用了，收掉。
      stopPoll(); kill();
      if(!qStarted) beginQ();
    }
  }
  box.querySelectorAll("#platTabs [data-plat]").forEach(t=>t.onclick=()=>switchPlat(t.dataset.plat));

  /* ---------- Qoder：新增账号一条龙 ---------- */
  /* 后端在 enroll 模式下会自己造凭据、建登录态、落库 —— 扫完就是可用账号，
     不需要再去账号 tab 点「授权」。 */
  function renderQ(s){
    if(!s.url||s.url===qDrawn) return;
    qDrawn=s.url;
    qBox().innerHTML=`
      ${s.qr?`<div class="qr" role="img" aria-label="Qoder 登录二维码">${s.qr}</div>`:""}
      <div class="qrtip" id="qTip"></div>
      <button type="button" class="btn secondary" id="qCopy">复制登录链接</button>
      ${s.qr?`<button type="button" class="btn secondary" id="qShare">生成扫码分享卡片</button>`:""}`;
    const cp=document.getElementById("qCopy");
    if(cp) cp.onclick=async ()=>{
      const ok=await copyText(s.url);
      cp.textContent=ok?"已复制 ✓":"复制失败，可长按二维码";
    };
    const sh=document.getElementById("qShare");
    if(sh) sh.onclick=()=>{
      const svgEl=qBox().querySelector(".qr svg");
      if(svgEl) showQrShareCard(svgEl.outerHTML,"qoder");
    };
  }

  async function pollQ(){
    if(stopped||plat!=="qoder"||!qKey) return;
    let s;
    try{ s=await getJSON("qoder/authorize/status?key="+encodeURIComponent(qKey)); }
    catch(e){ return; }
    if(stopped) return;
    if(s.state==="done"){
      stopQPoll();
      qBox().innerHTML=`<div class="uload" style="color:var(--ok)">${esc(s.message||"账号已添加")}</div>`;
      toast(s.message||"账号已添加");
      setTimeout(async ()=>{
        ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
        try{ await refreshChip(); }catch(e){}
        load("accounts");
      },1400);
      return;
    }
    if(s.state==="error"||s.state==="expired"||s.state==="cancelled"){
      stopQPoll();
      qBox().innerHTML=`<div class="uload" style="color:var(--err)">${esc(s.message||"扫码没成功")}</div>
        <button type="button" class="btn secondary" id="qRetry">重新获取二维码</button>`;
      const rb=document.getElementById("qRetry");
      if(rb) rb.onclick=()=>{ qStarted=false; qKey=null; beginQ(); };
      return;
    }
    if(s.state==="idle"){ beginQ(); return; }
    if(s.url) renderQ(s);
    const t=document.getElementById("qTip");
    if(t) t.textContent = s.expires_in
      ? `还有 ${Math.floor(s.expires_in/60)} 分 ${s.expires_in%60} 秒失效`
      : (s.message||"请扫码确认授权");
  }

  async function beginQ(){
    qStarted=true;
    qErr().textContent="";
    qDrawn=null;
    qBox().innerHTML='<div class="uload">正在向 Qoder 申请登录二维码…（约 5 秒）</div>';
    let s;
    try{
      s=await postJSON("qoder/authorize?mode=enroll",{});
    }catch(e){
      qErr().textContent="申请失败："+e.message;
      qStarted=false;
      return;
    }
    if(stopped) return;
    if(s.state==="error"){ qErr().textContent=s.message||"申请失败"; qStarted=false; return; }
    qKey=s.key||null;
    if(s.url) renderQ(s);
    stopQPoll(); qTimer=setInterval(pollQ,1500);
    pollQ();
  }

  /* tab 切换：只停/恢复轮询，不取消会话。
     踩过的坑：切到「粘贴 .info」就 cancel，再切回来界面上还挂着那张二维码，
     倒计时冻住、扫了完全没反应（服务端会话已经 idle）。用户根本不知道废了。 */
  box.querySelectorAll(".imptabs [data-tab]").forEach(t=>t.onclick=()=>{
    const qr=t.dataset.tab==="qr";
    box.querySelectorAll(".imptabs [data-tab]").forEach(x=>
      x.setAttribute("aria-selected",String((x.dataset.tab==="qr")===qr)));
    document.getElementById("paneQr").hidden=!qr;
    document.getElementById("panePaste").hidden=qr;
    document.getElementById("qrActs").hidden=!qr;
    if(qr) resume(); else stopPoll();
  });

  /* 切回扫码页：会话还在就接着轮询，真没了（超时/被取消/进程退出）就重新申请一张 */
  async function resume(){
    let s=null;
    try{ s=await getJSON("accounts/qr/status"); }catch(e){ s=null; }
    if(stopped) return;
    if(s && (s.state==="starting"||s.state==="waiting"||s.state==="done")){
      if(s.url) renderQr(s);
      startPoll(); poll();
      return;
    }
    begin();
  }

  /* 记「已经画过哪个链接」，而不是画过没有：会话重开/链接换新时要能重画，
     同一个链接重复 poll 时不能白重排 DOM（否则二维码每 1.5 秒闪一次）。 */
  let qrDrawn=null;
  function renderQr(s){
    if(!s.url||s.url===qrDrawn) return;
    qrDrawn=s.url;
    qrBox().innerHTML=`
      ${s.qr?`<div class="qr" role="img" aria-label="登录二维码">${s.qr}</div>`:""}
      <div class="qrtip" id="qrLeft">${s.expires_in?`还有 ${Math.floor(s.expires_in/60)} 分 ${s.expires_in%60} 秒失效`:""}</div>
      <button type="button" class="btn secondary" id="qrCopy">复制登录链接</button>
      ${s.qr?`<button type="button" class="btn secondary" id="qrShare">生成扫码分享卡片</button>`:""}`;
    const cp=document.getElementById("qrCopy");
    if(cp) cp.onclick=async ()=>{
      try{ await navigator.clipboard.writeText(s.url); cp.textContent="已复制 ✓"; }
      catch(e){ cp.textContent="复制失败，可长按二维码"; }
    };
    const sh=document.getElementById("qrShare");
    if(sh) sh.onclick=()=>{
      const svgEl=qrBox().querySelector(".qr svg");
      if(svgEl) showQrShareCard(svgEl.outerHTML,"workbuddy");
    };
  }

  function qrDead(msg){
    stopPoll();
    qrDrawn=null;
    qrBox().innerHTML=`<div class="uload" style="color:var(--err)">${esc(msg)}</div>
      <button type="button" class="btn secondary" id="qrRetry">重新获取二维码</button>`;
    const rb=document.getElementById("qrRetry");
    if(rb) rb.onclick=begin;
  }

  async function poll(){
    if(stopped) return;
    let s;
    try{ s=await getJSON("accounts/qr/status"); }catch(e){ return; }  // 轮询失败静默重试
    if(stopped) return;
    if(s.state==="done"&&s.content){
      stopPoll();
      qrBox().innerHTML='<div class="uload">已登录，正在导入账号…</div>';
      try{
        const r=await postJSON("accounts/import",{content:s.content});
        await kill();
        stopped=true;
        ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
        // R2.39：扫的是已存在账号 → 提示「已更新登录状态」而非「已添加」。
        const acc=r.account||{};
        // 账号名一律过 dispLabel：底层 label（内部昵称）是内部标签，
        // 展示必须是手机号掩码，别把内部昵称露出去。
        const shown=dispLabel(acc.label||"账号");
        // R2.41：导入后端会实测 token。没通过就别再说「已更新登录状态」——
        // 那会让用户以为修好了（假阳性），实际 token 还是旧的。
        if(r.verified===false){
          toast(`扫码完成，但凭据未通过验证：${shown}。请确认扫的是该账号本人，必要时用官方 CLI 重新登录。`);
        }else{
          toast(acc.replaced
            ? `该账号已存在，已更新登录状态：${shown}`
            : `已添加：${shown}`);
        }
        await refreshChip();
        load("accounts");
      }catch(e){
        qrErr().textContent="导入失败："+e.message;
      }
      return;
    }
    if(s.state==="expired"||s.state==="error"){
      qrDead(s.message||"二维码已失效");
      return;
    }
    if(s.state==="idle"){
      // 服务端会话没了（被人 cancel、被重启、或超过 5 分钟自己收摊）。
      // 这时候界面上那张码是死的，必须说清楚，不能让用户对着废码干等。
      qrDead("会话已结束，重新获取二维码");
      return;
    }
    if(s.url) renderQr(s);
    const t=document.getElementById("qrLeft");
    if(t&&s.expires_in) t.textContent="还有 "+Math.floor(s.expires_in/60)+" 分 "+(s.expires_in%60)+" 秒失效";
  }

  async function begin(){
    qrErr().textContent="";
    qrDrawn=null;
    qrBox().innerHTML='<div class="uload">正在向平台申请登录二维码…（约 10 秒）</div>';
    let s;
    try{
      s=await postJSON("accounts/qr/start",{});
    }catch(e){
      qrErr().textContent="申请失败："+e.message;
      return;
    }
    if(stopped) return;
    if(s.state==="error"){
      qrDead(s.message||"申请失败");
      return;
    }
    if(s.url) renderQr(s);
    startPoll();
    poll();
  }

  /* 粘贴方式 */
  document.getElementById("impFile").onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    document.getElementById("impName").textContent=f.name;
    const rd=new FileReader();
    rd.onload=()=>{ document.getElementById("impText").value=String(rd.result||""); };
    rd.readAsText(f);
  };
  box.querySelector('[data-act="ok"]').onclick=async ()=>{
    const content=document.getElementById("impText").value.trim();
    const err=document.getElementById("impErr");
    if(!content){ err.textContent="先把凭据内容贴进来"; return; }
    const btn=box.querySelector('[data-act="ok"]');
    btn.disabled=true; btn.textContent="校验中…";
    try{
      const r=await postJSON("accounts/import",{content});
      stopped=true; clearInterval(timer);
      ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
      // R2.39：区分「覆盖已有账号」与「新增」，避免用户误以为加了重复账号。
      // R2.41：后端实测 token 没通过就明确提示，别报「已更新登录状态」的假阳性。
      const acc=r.account||{};
      const shown=dispLabel(acc.label||"账号");
      if(r.verified===false){
        toast(`已导入，但凭据未通过验证：${shown}。token 可能已失效，账号行会显示红色「重新授权」。`);
      }else{
        toast(acc.replaced
          ? `该账号已存在，已更新登录状态：${shown}`
          : `已添加：${shown}`);
      }
      await refreshChip();
      load("accounts");
    }catch(e){
      err.textContent=e.message;
      btn.disabled=false; btn.textContent="校验并添加";
    }
  };

  ov.classList.add("show");
  begin();
}


/* ==================== Qoder 授权（P44）====================
   官方 CLI 的设备码登录。跟 WorkBuddy 那套扫码同构，但有两个差别：
   1. 设备码只有 5 分钟有效期 —— 过期后**后端会自动换一个新的**，
      所以前端只要盯着「URL 变了就重画」，不用管过期这件事。
   2. 授权成功后**不需要再点一次确认** —— 后端自己校验身份、刷余额、落库。 */
function qoderAuthDialog(label){
  const ov=document.getElementById("overlay");
  const box=document.getElementById("alert");
  box.classList.add("wide");
  box.innerHTML=`
    <div class="head"><h2>授权 Qoder 账号</h2>
      <div class="msg">${esc(dispLabel(label))} · 在 Qoder 网页上确认授权</div></div>
    <div class="qrbox" id="qBox"><div class="uload">正在向 Qoder 申请授权链接…</div></div>
    <div class="err" id="qErr" style="padding:0 16px 12px"></div>
    <div class="acts">
      <button type="button" data-act="cancel">关闭</button>
    </div>`;

  let timer=null, stopped=false, qrDrawn=null, key=label;
  const qBox=()=>document.getElementById("qBox");
  const qErr=()=>document.getElementById("qErr");
  const stopPoll=()=>{ clearInterval(timer); timer=null; };
  const close=()=>{
    stopped=true; stopPoll();
    ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
    // 顺手把服务器上等着的登录进程收掉，别留一堆 250MB 的 CLI 挂在那儿
    try{ postJSON("qoder/authorize/cancel?key="+encodeURIComponent(key),{}); }catch(e){}
  };
  box.querySelector('[data-act="cancel"]').onclick=close;

  function renderQr(s){
    if(!s.url||s.url===qrDrawn) return;
    qrDrawn=s.url;
    qBox().innerHTML=`
      ${s.qr?`<div class="qr" role="img" aria-label="Qoder 授权二维码">${s.qr}</div>`:""}
      <div class="qrtip" id="qTip"></div>
      <button type="button" class="btn secondary" id="qCopy">复制授权链接</button>
      ${s.qr?`<button type="button" class="btn secondary" id="qShare">生成扫码分享卡片</button>`:""}`;
    const cp=document.getElementById("qCopy");
    if(cp) cp.onclick=async ()=>{
      const ok=await copyText(s.url);
      cp.textContent=ok?"已复制 ✓":"复制失败，可长按二维码";
    };
    const sh=document.getElementById("qShare");
    if(sh) sh.onclick=()=>{
      const svgEl=qBox().querySelector(".qr svg");
      if(svgEl) showQrShareCard(svgEl.outerHTML,"qoder");
    };
  }

  async function poll(){
    if(stopped) return;
    let s;
    try{ s=await getJSON("qoder/authorize/status?key="+encodeURIComponent(key)); }
    catch(e){ return; }                       // 轮询失败静默重试
    if(stopped) return;
    if(s.state==="done"){
      stopPoll();
      qBox().innerHTML=`<div class="uload" style="color:var(--ok)">${esc(s.message||"授权成功")}</div>`;
      toast("授权成功");
      setTimeout(async ()=>{
        ov.classList.remove("show"); box.classList.remove("wide"); box.innerHTML="";
        try{ await refreshChip(); }catch(e){}
        load("accounts");
      },1200);
      return;
    }
    if(s.state==="error"||s.state==="expired"||s.state==="cancelled"){
      stopPoll();
      qBox().innerHTML=`<div class="uload" style="color:var(--err)">${esc(s.message||"授权没成功")}</div>
        <button type="button" class="btn secondary" id="qRetry">重新获取</button>`;
      const rb=document.getElementById("qRetry");
      if(rb) rb.onclick=begin;
      return;
    }
    if(s.state==="idle"){
      // 服务端会话没了（服务重启过、或被人 cancel）。
      // 直接自己重开一轮 —— 用户不该为了一次重启再点一次按钮。
      begin();
      return;
    }
    if(s.url) renderQr(s);
    const t=document.getElementById("qTip");
    if(t) t.textContent = s.expires_in
      ? `还有 ${Math.floor(s.expires_in/60)} 分 ${s.expires_in%60} 秒失效`
      : (s.message||"正在等待授权…");
  }

  async function begin(){
    qErr().textContent="";
    qrDrawn=null;
    qBox().innerHTML='<div class="uload">正在向 Qoder 申请授权链接…（约 5 秒）</div>';
    let s;
    try{
      s=await postJSON("qoder/authorize?label="+encodeURIComponent(label),{});
    }catch(e){
      qErr().textContent="申请失败："+e.message;
      return;
    }
    if(stopped) return;
    if(s.state==="error"){ qErr().textContent=s.message||"申请失败"; return; }
    // 后端可能把会话换成新的 key（新增账号模式下账号名还不知道，
    // 用的是 new:<uuid> 这种临时 key）—— 后续轮询必须跟着换。
    key=s.key||key;
    if(s.url) renderQr(s);
    stopPoll(); timer=setInterval(poll,1500);
    poll();
  }

  ov.classList.add("show");
  begin();
}


/* ==================== 安全 ==================== */
let SEC=null;   /* 最近一次的 /security 快照（改邮箱时要用当前值） */
/* 同一台设备反复打开会刷出一排一模一样的记录，按「IP + 原因 + 小时」折叠成一条 */
function dedupeEvents(list){
  const seen=new Map();
  for(const e of list){
    const hour=Math.floor((e.created_at||0)/3600);
    const key=`${e.ip}|${e.reason}|${hour}`;
    const cur=seen.get(key);
    if(cur) cur.n=(cur.n||1)+1;
    else seen.set(key,{...e,n:1});
  }
  return [...seen.values()].slice(0,6);
}
function renderSecurity(d){
  SEC=d;
  const body=document.getElementById("body");
  if(!d||!d.session){ patchDOM(body,'<div class="empty">暂时取不到会话信息</div>'); return; }
  const s=d.session, p=d.policy||{};
  const hrs=n=>n>=86400?(n/86400)+" 天":(n>=3600?(n/3600)+" 小时":Math.round(n/60)+" 分钟");
  let h='<div class="group"><div class="ghead">本设备会话</div><div class="card">';
  h+=`<div class="row"><div class="rmain"><div class="rtitle">已登录</div>
    <div class="rsub">IP ${esc(s.ip||"—")} · 登录于 ${esc(fmtMD(s.created_at))}</div></div>
    <div class="rright">${pill("有效","ok")}</div></div>`;
  h+=`<div class="row"><div class="rmain"><div class="rtitle">有效至 ${esc(fmtMD(s.expires_at))}</div>
    <div class="rsub">${hrs(p.idle_ttl)}不活跃失效 · 最长 ${hrs(p.max_ttl)}</div>
    </div></div>`;
  h+=`<div class="row tap" id="logout"><div class="rmain"><div class="rtitle" style="color:var(--err)">退出这台设备</div>
    <div class="rsub">只作废本浏览器</div></div></div>`;
  h+='</div></div>';

  /* P20：邮件找回 —— 换了设备/清了 Cookie 也能进来，不用翻 .env 找口令 */
  const em=d.email||{}, ml=d.mail||{};
  h+='<div class="group"><div class="ghead">邮件找回</div><div class="card">';
  h+=`<div class="row tap" id="emailEdit"><div class="rmain">
    <div class="rtitle">收件邮箱</div>
    <div class="rsub">${em.value?esc(em.masked):"还没设置 —— 点这里填一个"}</div></div>
    <div class="rright">${pill(em.value?"修改":"设置",em.value?"ok":"warn")}</div></div>`;
  h+=`<div class="row tap" id="smtpEdit"><div class="rmain"><div class="rtitle">发件邮箱</div>
    <div class="rsub">${ml.configured
      ? esc(ml.from||ml.user||"还没填发件地址")
      : "还没设置 —— 点这里填一个"}</div></div>
    <div class="rright">${pill(ml.configured?"已配置":"设置",ml.configured?"ok":"warn")}</div></div>`;
  h+=`<div class="row tap" id="emailTest"><div class="rmain"><div class="rtitle">发一封测试邮件</div>
    <div class="rsub">${em.ready ? "" : "先填邮箱并配置 SMTP"}</div></div>
    <div class="rright"><span class="mono">→</span></div></div>`;
  h+=`<div class="row tap" id="signinRun"><div class="rmain"><div class="rtitle">跑一轮签到并发日报</div></div>
    <div class="rright"><span class="mono">→</span></div></div>`;
  h+='</div></div>';

  const logins=dedupeEvents(d.logins||[]);
  h+='<div class="group"><div class="ghead">最近登录</div><div class="card scroll-list">';
  if(!logins.length) h+='<div class="empty">没有记录</div>';
  for(const e of logins) h+=`<div class="row"><div class="rmain">
    <div class="rtitle">${esc(e.ip||"—")}${e.n>1?`<span class="pill plain">${e.n} 次</span>`:""}</div>
    <div class="rsub">${esc(fmtMD(e.created_at))} · ${esc((e.path||"").slice(0,28))}</div>
    </div><div class="rright">${pill("成功","ok")}</div></div>`;
  h+='</div></div>';

  const fails=dedupeEvents(d.failures||[]);
  h+='<div class="group"><div class="ghead">失败尝试</div><div class="card scroll-list">';
  if(!fails.length) h+='<div class="empty">没有失败记录</div>';
  for(const e of fails) h+=`<div class="row"><div class="rmain">
    <div class="rtitle">${esc(e.ip||"—")}${e.n>1?`<span class="pill plain">${e.n} 次</span>`:""}</div>
    <div class="rsub">${esc(fmtMD(e.created_at))} · ${esc(e.reason||"")}</div>
    </div><div class="rright">${pill("拒绝","err")}</div></div>`;
  h+='</div></div>';

  const blocked=(d.blocked||[]);
  if(blocked.length){
    h+='<div class="group"><div class="ghead">封禁中</div><div class="card scroll-list">';
    for(const b of blocked) h+=`<div class="row"><div class="rmain">
      <div class="rtitle">${esc(b.ip)}</div>
      <div class="rsub">失败 ${b.n} 次 · 解封时间 ${esc(fmtMD(b.until))}</div></div>
      <div class="rright"><button class="mini" data-unban="${esc(b.ip)}">解除</button></div></div>`;
    h+='</div></div>';
  }
  patchDOM(body,h);
  bindSecurity();
}

function bindSecurity(){
  const out=document.getElementById("logout");  if(out) out.onclick=async ()=>{
    const ok=await dialog({title:"退出登录？",message:"需要重新输口令才能进来。",
      confirmText:"退出",danger:true});
    if(!ok) return;
    const f=document.createElement("form");
    f.method="post"; f.action=PREFIX+"/admin/logout";
    document.body.appendChild(f); f.submit();
  };
  document.querySelectorAll("[data-unban]").forEach(btn=>btn.onclick=async ()=>{
    const ip=btn.dataset.unban;
    const ok=await dialog({title:"解除封禁？",message:"解除后该 IP 可以重新尝试登录。",
      rows:[["IP",ip]],confirmText:"解除"});
    if(!ok) return;
    try{ await postJSON("security/unban",{ip}); toast("已解除 "+ip); load("security"); }
    catch(e){ toast("解除失败："+e.message); }
  });

  /* P20：改收件邮箱 / 发测试邮件 */
  const edit=document.getElementById("emailEdit");
  if(edit) edit.onclick=async ()=>{
    const cur=(SEC&&SEC.email&&SEC.email.value)||"";
    const addr=await inputDialog({
      title:"收件邮箱",
      label:"邮箱地址", value:cur, placeholder:"you@example.com", type:"email"});
    if(addr===null) return;
    try{
      const r=await postJSON("security/email",{email:addr});
      toast(r.email?("已设为 "+r.masked):"已清空收件邮箱");
      load("security");
    }catch(e){ toast("保存失败："+e.message); }
  };
  const t=document.getElementById("emailTest");
  if(t) t.onclick=async ()=>{
    toast("正在发…");
    try{
      const r=await postJSON("security/email/test",{});
      toast(r.ok ? ("已发到 "+r.to+"，去收件箱看看") : ("没发出去："+r.message));
    }catch(e){ toast("发信失败："+e.message); }
  };
  /* R2.41：手动触发一轮签到+日报（走网关定时任务同一套 daily_report.run） */
  const sr=document.getElementById("signinRun");
  if(sr) sr.onclick=async ()=>{
    const ok=await dialog({title:"跑一轮签到并发日报？",
      message:"会真实调用各平台签到接口并发出一封签到日报邮件，约 10~60 秒。",
      confirmText:"开始"});
    if(!ok) return;
    const old=sr.querySelector(".rtitle").textContent;
    sr.querySelector(".rtitle").textContent="签到进行中…";
    try{
      const r=await postJSON("signin/run?mail=1",{});
      if(r.ok!==true){ toast("签到失败："+(r.error||r.message||"未知原因")); return; }
      const mailTip = r.mail_sent ? "邮件已发出，去收件箱看看"
        : (r.mail_failed ? "签到完成但邮件没发出去，检查发件邮箱配置" : "未配置发信");
      toast(`签到完成：${r.ok_count??"?"}/${r.total??"?"} 成功 · ${mailTip}`);
    }catch(e){ toast("触发失败："+e.message); }
    finally{ sr.querySelector(".rtitle").textContent=old; }
  };
  const se=document.getElementById("smtpEdit");
  if(se) se.onclick=async ()=>{
    let cfg=(SEC&&SEC.mail)||{};
    try{ cfg=await getJSON("mail-settings")||cfg; }catch(e){}
    const v=await smtpDialog(cfg);
    if(v===null) return;
    /* 授权码留空就不提交该字段，后端会保留原值 */
    const payload={smtp_host:v.smtp_host,smtp_port:v.smtp_port,smtp_user:v.smtp_user,
      smtp_from:v.smtp_from,smtp_ssl:v.smtp_ssl};
    if(v.smtp_password) payload.smtp_password=v.smtp_password;
    try{
      await postJSON("mail-settings",payload);
      toast("SMTP 配置已保存");
      load("security");
    }catch(e){ toast("保存失败："+e.message); }
  };
}

/* ==================== 记录 ==================== */
/* R1：调度切换——从「长列表」改成「关系图谱」。
   同一份 switch-history 数据（连续相同 账号+模型 折叠成段），两种视角：
   - 桑基图：每条彩带 = 一次真实的「从谁跳到谁」，粗细=次数，悬停高亮整条链；
   - 时间轴回放：横轴时间、纵轴账号，播放时逐段高亮并显示切换原因（reason 落库原值）。
   规范：Apple HIG Lists（固定可视区）+ ECharts 官方 sankey/custom 用法。
   平台色沿用固定值（与 .ptag 一致）：WB #0A62C4 / Qoder #8944AB。
   canvas 读不到 CSS 变量，颜色在 JS 里按当前主题显式取。 */
/* R1.5：默认视图 = "recent"（最近使用模型列表），用户要据此判断 low/high 实际调用。 */
let SW={segs:[],view:"recent",timer:null,idx:0,chart:null,bound:false,filter:"free",hidden:0,
  range:0};   // R2.28：时间轴范围（秒）：0=全部 / 300=近5分钟 / 3600=近1小时

function swName(s){ return (s.account?dispLabel(s.account):"—")+" · "+(s.model||"—"); }
/* R1.2：平台角标前缀 —— canvas 里塞不进 HTML 角标，用「WB 」/「QD 」前缀实现同样的
   一眼可辨效果（颜色也按平台固定，悬停 tooltip 里给全称）。 */
function swPlatTag(s){
  const p=(s&&s.platform||"").toLowerCase();
  return p==="workbuddy"?"WB ":(p==="qoder"?"QD ":"");
}
function swLabel(s){ return swPlatTag(s)+swName(s); }
/* R1.4：免费池 / 付费池 —— 按**模型粒度**判定，不是按单次扣费。
   免费池 = costmodel.robust_free 判定的真免费模型（线上只有 hy4flash-free）；
   扣费模型（哪怕短请求偶尔免费）都属于付费池。用户拍板：扣了费就不是免费模型。 */
function swInFreePool(s){ return !!(s&&s.in_free_pool); }
function swPoolText(s){ return swInFreePool(s)?"免费池":"付费池"; }
function swColor(s){
  const p=(s.platform||"").toLowerCase();
  if(p==="workbuddy") return "#0A62C4";
  if(p==="qoder") return "#8944AB";
  return "#8E8E93";
}
function swTheme(){
  const dark=document.documentElement.dataset.theme==="dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  return {dark,text:dark?"#E8E8E8":"#2C2C2A",sub:dark?"#98989D":"#6E6E73",
    grid:dark?"rgba(255,255,255,.12)":"rgba(0,0,0,.10)"};
}

/* R1.3/R1.4：按「免费池 / 付费池 / 全部」过滤切换段。
   用户明确：流向图应只展示**免费池之间的轮询调度**（4 个账号 × hy4flash-free），
   不混付费模型。默认只看免费池；付费池单独可查。 */
function swFilterSegs(){
  // R2.26：数据源已是最近 7 天全量，但桑基图/时间轴只画最近 300 段——
  // 一周上千段全画会挤成一团。切片放在这里（图表专用），最近使用列表
  // (swDrawRecent 用 SW.segs) 仍能聚合到一周前的 high 调用。
  const all=(SW.segs||[]).slice(0,300);
  if(SW.filter==="all") return all;
  if(SW.filter==="free") return all.filter(swInFreePool);
  if(SW.filter==="paid") return all.filter(s=>!swInFreePool(s));
  return all;
}
/* R2.30：时间范围过滤抽公共函数——流向图与时间轴共用同一口径。
   SW.range（秒）：0=全部 / 300=近5分钟 / 3600=近1小时；按段的最后活动时间过滤。
   Date.now() 实时计算 → liveRefresh 每 5 秒重绘时窗口自动向前滚动（实时效果）。 */
function swRangeSegs(){
  let seq=swFilterSegs();
  if(SW.range>0){
    const cutoff=Date.now()/1000-SW.range;
    seq=seq.filter(s=>(s.last_at||s.first_at||0)>=cutoff);
  }
  return seq;
}
function swPoolCounts(){
  const c={free:0,paid:0};
  for(const s of (SW.segs||[])) c[swInFreePool(s)?"free":"paid"]++;
  return c;
}

function switchHistoryHTML(segs){
  // body 每次重渲染，DOM 都是新节点：旧图表实例已失效 → 先复位
  if(SW.timer){clearInterval(SW.timer);SW.timer=null;}
  if(SW.chart){SW.chart.dispose();SW.chart=null;}
  SW.bound=false;
  if(!segs||!segs.length){ SW.segs=[]; return ""; }
  SW.segs=segs; SW.idx=0;
  const tc=swPoolCounts();
  // R2.34：池占比——绿色=免费池、灰色=付费池，做成「全部」按钮内的迷你堆叠条。
  // 小屏隐藏数字后比例条仍在，一眼看出 free/paid 占比（用户要看的是比例不是绝对数）。
  const total=tc.free+tc.paid||1;
  const freePct=Math.round(tc.free/total*100);
  return `<div class="group">
    <div class="ghead">调度切换 · 最近 ${segs.length} 段</div>
    <div class="hseg" id="swSeg" style="margin-bottom:6px">
      <button type="button" data-swview="recent" aria-pressed="${SW.view==="recent"?"true":"false"}">最近使用</button>
      <button type="button" data-swview="flow" aria-pressed="${SW.view==="flow"?"true":"false"}">流向图</button>
