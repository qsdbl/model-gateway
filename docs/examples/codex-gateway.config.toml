# Codex 0.142+ 网关专用 profile（放到 ~/.codex/gateway.config.toml）
#
# 用法：MGW_KEY=<网关 API Key> codex --profile gateway
# 依据：Codex 0.142.3 报错提示 + https://developers.openai.com/codex/config-advanced#profiles
#   —— 新版本 profile 设置必须放在 <profile>.config.toml，不要写进主 config.toml 的 [profiles.<name>]，
#      这样完全不改动用户已有的 provider / 插件 / MCP 配置。
#
# 为什么关掉这些上下文块（均为 Codex 官方配置项）：
#   model_instructions_file：替换内置约 20KB 基础提示，见 config-reference；
#   include_permissions_instructions / include_apps_instructions /
#   include_collaboration_mode_instructions / skills.include_instructions /
#   skills.bundled.enabled / features.plugins / features.memories：
#   见 https://developers.openai.com/codex/config-reference 与
#   https://developers.openai.com/codex/agent-configuration/subagents
#   这些块合计约 7.8KB，含自动注入的 skills 目录与权限说明；关闭后请求只剩简短
#   instructions + 用户消息，WorkBuddy 上游不再返回 11128 unapproved channel。
#   注意：这里没有伪装任何客户端身份，也没有改写上游请求，网关代码零改动。

model = "low"
model_provider = "gateway"
# 与用户现有 ~/.codex/config.toml 一致：本机已用 danger-full-access；
# workspace-write 在 macOS 上实测 sandbox-exec 拒绝所有命令（含 true）。
sandbox_mode = "danger-full-access"
approval_policy = "never"
model_instructions_file = "./docs/examples/codex-gateway-instructions.md"
include_permissions_instructions = false
include_apps_instructions = false
include_collaboration_mode_instructions = false

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[features]
plugins = false
memories = false
# 用户 hooks.json 的 SessionStart 输出会以 developer 消息注入请求，
# 实测这一条就足以让上游返回 11128；网关模式关闭 hooks。
# 依据：https://developers.openai.com/codex/config-reference（features.hooks）
hooks = false

# 网关模式不加载个人 MCP：实测 code-review-graph 的工具描述约 39KB，
# 叠加后整个请求体被 WorkBuddy 判为 unapproved channel（11128）。
# 需要 node_repl / code_review_graph 时用默认 profile（不走网关）。
[mcp_servers.node_repl]
enabled = false

[mcp_servers.code-review-graph]
enabled = false

[model_providers.gateway]
name = "gateway"
base_url = "http://your-server:8080/v1"
wire_api = "responses"
requires_openai_auth = false
env_key = "MGW_KEY"
